# ======================================================================
# layout.conf — layout, gaps, colours, effects.  Mirrors niri/layout.kdl
# (plus niri/noctalia.kdl, which overrides the colours there).
#
# niri is a scrollable-tiling compositor: a horizontal strip of columns,
# each column a vertical stack of windows.  mango's `scroller` layout is
# the same model, so every tag defaults to it (see rules.conf).
# ======================================================================

# Layouts Super+Ctrl+W cycles through; scroller first so it stays home.
circle_layout=scroller,tile,deck,dwindle,monocle

# --- scroller (niri: columns) -----------------------------------------
# niri: preset-column-widths { 0.2 0.25 0.33333 0.4 0.66667 0.8 }
scroller_proportion_preset=0.2,0.25,0.33,0.4,0.67,0.8
# niri: default-column-width { proportion 0.2 }
scroller_default_proportion=0.2
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
# niri: center-focused-column "on-overflow".  prefer_overspread and
# focus_center both outrank prefer_center, so they must be off for it.
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=1
# niri: struts { left 10; right 10 } — edge reservation on the strip.
scroller_structs=10

# --- master-stack fallbacks (the `tile` layout) ------------------------
new_is_master=1
default_mfact=0.7
default_nmaster=1
center_when_single_stack=1
center_master_overspread=0

dwindle_split_ratio=0.66

# --- tags (niri: workspaces) ------------------------------------------
# niri has dynamic workspaces; mango has a fixed set. Nine matches the
# Super+1..9 binds.
tag_num=9
tag_gather=0

# --- gaps (niri: struts + layout gaps) --------------------------------
# niri's struts are per-edge (top 1, sides 10, bottom 10); mango's outer
# gaps are horizontal/vertical only, so the sides win.
gappoh=1
gappov=1
gappih=1
gappiv=1
smartgaps=1

# --- borders (niri: focus-ring) ---------------------------------------
# mango has one border per window, no separate focus ring. Colours come
# from niri/noctalia.kdl, which is included last and so wins there.
borderpx=3
focuscolor=0x7aa2f7ff
bordercolor=0x1a1b26ff
urgentcolor=0xf7768eff
no_border_when_single=0
rootcolor=0x201b14ff

# niri: insert-hint { color "#7aa2f780" }
dropcolor=0x7aa2f78
splitcolor=0xeb441eff
# States niri has no colour for.
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
maximizescreencolor=0x89aa61ff

# niri: window-rule { geometry-corner-radius 12; clip-to-geometry true }
# border_radius=12
no_radius_when_single=1

# --- overview ---------------------------------------------------------
overviewgappi=5
overviewgappo=30
hotarea_size=10
hotarea_disable_on_fullscreen=1
overcircle_center_ratio=0.5
# Jump labels on the Gallium home row (n r t s g p h a e i) first, then
# the top and bottom rows.
jump_labels=NRTSGPHAEIBLDCVJYOUXQMWZKP

# --- effects (niri: blur {} + layout { shadow {} }) -------------------
# niri: blur { passes 3; offset 3.0; noise 0.02; saturation 1.2 }
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# niri: shadow { softness 20; spread 2; offset x=0 y=3; color "#000000ff" }
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=10
shadows_blur=10
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x00000099

focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# --- misc -------------------------------------------------------------
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1
focus_on_activate=1
axis_bind_apply_timeout=150
# niri's screenshot UI is built in; scripts/screenshot replaces it.
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
