# ======================================================================
# mango — tracking ~/.config/niri as closely as the compositor allows.
#
# Layout mirrors the niri config so the two stay diffable:
#
#   niri/io.kdl        -> io.conf          input + outputs
#   niri/layout.kdl    -> layout.conf      layout, gaps, colours, effects
#   niri/animation.kdl -> animation.conf   animations
#   niri/rules.kdl     -> rules.conf       window / tag / layer rules
#   niri/binds.kdl     -> binds.conf       keybindings
#   niri/apps.kdl      -> apps.conf        app launch / raise keybindings
#
# MAPPING.md records the niri -> mango translation and the handful of
# niri actions that have no mango equivalent.
#
# Docs:     https://mangowm.github.io/docs/
# Validate: mango -c ~/.config/mango/config.conf -p
# Reload:   Super+Shift+R  (or  mmsg dispatch reload_config)
# ======================================================================

# niri: cursor { xcursor-theme "breeze_cursors" } — mango reads the theme
# from the environment rather than a config key.
env=XCURSOR_THEME,breeze_cursors

source=./io.conf
source=./layout.conf
source=./animation.conf
source=./rules.conf
source=./binds.conf
source=./apps.conf

# --- autostart (niri: spawn-at-startup) -------------------------------
exec-once=noctalia
exec-once=stasis
exec-once=stasis tray
exec-once=vicinae server
exec-once=1password --silent
exec-once=signal-desktop
# niri's niriusd is niri-only; mango's scratchpad is built in.
