# ======================================================================
# binds.conf — mirrors niri/binds.kdl.
#
# Model translation:
#
#   niri                             mango
#   ───────────────────────────────  ────────────────────────────────
#   column (left/right)              scroller strip  (left/right)
#   window within column (up/down)   scroller stack  (up/down)
#   workspace (Page_Up/Down)         tag             (viewtoleft/right)
#
#        niri                             mango scroller
#     ┌────┬────┬────┐                 ┌────┬────┬────┐
#     │ A  │ B  │ D  │  columns        │ A  │ B  │ D  │  strip
#     │    ├────┤    │                 │    ├────┤    │
#     │    │ C  │    │  C stacked      │    │ C  │    │  C in B's stack
#     └────┴────┴────┘   under B       └────┴────┴────┘
#
#   Super+Left/Right   -> A B D        focusdir left/right
#   Super+Up/Down      -> B C          focusdir up/down
#   Super+[ / ]        -> join/leave   scroller_stack left/right
#
# Actions niri has and mango does not are left as commented-out notes so
# the two files stay line-comparable. See MAPPING.md for the summary.
# ======================================================================

keymode=default

# niri: Mod+Shift+Slash show-hotkey-overlay — mango has no overlay.

# --- launcher and panels ----------------------------------------------
bind=CTRL+ALT,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,space,spawn,vicinae open
bind=SUPER,z,spawn,noctalia msg panel-toggle clipboard

# --- system -----------------------------------------------------------
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-open session
# niri: power-off-monitors. mango's sleep_monitor takes one output at a
# time, so a script fans it out.
bind=SUPER+SHIFT,p,spawn_shell,~/.config/mango/scripts/sleep-monitors
bind=CTRL+SUPER,m,spawn,noctalia msg mic-volume-set 100
bind=SUPER,b,spawn,noctalia msg bar-toggle
bind=SUPER,l,spawn,noctalia msg panel-toggle control-center
bind=SUPER+CTRL,comma,spawn,noctalia msg settings-toggle
bind=SUPER,y,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,u,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER+SHIFT,u,spawn,noctalia msg notification-dnd-toggle

bind=SUPER,backslash,spawn_shell,~/.local/bin/toggle-audio-sink
# niri: Mod+X nirius toggle-follow-mode — nirius is niri-only.

# --- scratchpad -------------------------------------------------------
# niri drives these through nirius; mango has a built-in scratchpad.
bind=SUPER,n,toggle_scratchpad
bind=SUPER+SHIFT,n,minimized
bind=SUPER+CTRL,n,restore_minimized

# --- audio (niri: allow-when-locked=true -> the `l` flag) -------------
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 3
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down 3
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPause,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=CTRL,XF86AudioRaiseVolume,spawn,dms ipc call mpris increment 3
bindl=CTRL,XF86AudioLowerVolume,spawn,dms ipc call mpris decrement 3

# --- brightness -------------------------------------------------------
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up 5
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down 5

# --- overview ---------------------------------------------------------
bind=SUPER,o,toggleoverview
# mango extra: overview with jump labels (see layout.conf jump_labels).
bind=SUPER+SHIFT,o,togglejump

# --- window -----------------------------------------------------------
bind=SUPER,q,killclient

# --- focus ------------------------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=SUPER+ALT,Up,focus_window_or_workspace,up
bind=SUPER+ALT,Down,focus_window_or_workspace,down

# niri: Mod+Home/End focus-column-first/last and the Shift variants —
# mango has no jump-to-strip-edge action.

# --- monitors ---------------------------------------------------------
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Down,focusmon,down

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

# --- tags (niri: workspaces) ------------------------------------------
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft

bind=SUPER+SHIFT,Page_Down,tagtoright
bind=SUPER+SHIFT,Page_Up,tagtoleft

# niri distinguishes moving a whole column from moving one window; mango
# moves the focused window either way, so these mirror the Shift pair.
bind=SUPER+ALT,Page_Down,tagtoright
bind=SUPER+ALT,Page_Up,tagtoleft

# niri: Mod+Ctrl+Page_Up/Down move-workspace-up/down — mango's tags are
# a fixed, ordered set and cannot be reordered.

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+ALT,1,tag,1
bind=SUPER+ALT,2,tag,2
bind=SUPER+ALT,3,tag,3
bind=SUPER+ALT,4,tag,4
bind=SUPER+ALT,5,tag,5
bind=SUPER+ALT,6,tag,6
bind=SUPER+ALT,7,tag,7
bind=SUPER+ALT,8,tag,8
bind=SUPER+ALT,9,tag,9

# niri's Mod+Alt+N also follows the window; tagsilent leaves you put,
# which is the more useful of the two once columns are gone.
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# niri: Mod+Ctrl+X unset-workspace-name, Mod+Alt+R rename-workspace —
# mango's tags are numbered and cannot be named.

# niri: Alt+Tab focus-workspace-previous. mango 0.17.2 has no
# previous-tagset action, so this goes back to the last focused window
# instead. Tag ping-pong lives on the tag keys: view_current_to_back=1
# in io.conf (niri's workspace-auto-back-and-forth) means pressing the
# current tag's own Super+N returns you to the tag before it.
bind=ALT,Tab,focuslast

# --- window switcher (niri: recent-windows) ---------------------------
bind=SUPER,Tab,switcher,all_tag_next
bind=SUPER+SHIFT,Tab,switcher,all_tag_prev
# niri filters these by app-id; mango's switcher scopes by tag instead.
bind=SUPER,grave,switcher,next
bind=SUPER+SHIFT,grave,switcher,prev

# --- columns (niri: consume / expel) ----------------------------------
# scroller_stack pulls a lone window into the neighbouring stack, or
# pushes it back out if it is already in one — niri's combined
# consume-or-expel-window-left/right.
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right

bind=SUPER+SHIFT,comma,scroller_stack,left
bind=SUPER+SHIFT,period,scroller_stack,right
# niri's Mod+Comma/Period split that into consume and expel, which mango
# merges above. These drive mango's groups instead: the same "bind these
# windows together" idea, and they work in every layout, not just scroller.
bind=SUPER,comma,groupjoin,right
bind=SUPER,period,groupleave

# --- sizing -----------------------------------------------------------
# niri: Mod+R switch-preset-column-width
bind=SUPER,r,switch_proportion_preset
# niri: Mod+Shift+R switch-preset-column-width-back — no reverse cycle,
# so reload the config here instead (mango's own Super+R default).
bind=SUPER+SHIFT,r,reload_config

# niri: set-column-width -10%/+10%. mango's set_proportion is absolute
# and scroller-only, so these nudge the master factor, which is what the
# tile-family layouts use. On scroller, use Super+R to cycle presets.
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05

# niri: Mod+Shift+Minus/Equal set-window-height, Mod+Ctrl+R
# reset-window-height, Mod+Ctrl+Shift+R switch-preset-window-height —
# mango stacks share their slot evenly and have no per-window height.

bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,equal,incgaps,+1
bind=SUPER+CTRL,g,togglegaps

# --- maximize / fullscreen --------------------------------------------
# niri: Mod+F maximize-column
bind=SUPER,f,togglemaximizescreen
# niri: Mod+Shift+F fullscreen-window
bind=SUPER+SHIFT,f,togglefullscreen
# niri: Mod+M maximize-window-to-edges. Fake fullscreen is the nearest
# thing: full area, but the window stays managed.
bind=SUPER,m,togglefakefullscreen
# niri: Mod+Ctrl+F expand-column-to-available-width
bind=SUPER+CTRL,f,set_proportion,1.0

# niri: Mod+C center-column
bind=SUPER,c,centerwin
# niri: Super+Shift+C / Super+I center-visible-columns — mango centres
# via scroller_prefer_center in layout.conf, not per keypress.

# --- floating ---------------------------------------------------------
bind=SUPER,v,togglefloating
# niri: Mod+Shift+V switch-focus-between-floating-and-tiling. mango has
# no such focus hop; this floats/tiles everything visible instead.
bind=SUPER+SHIFT,v,toggle_all_floating

# --- layout -----------------------------------------------------------
# niri: Mod+W toggle-column-tabbed-display. `deck` is mango's stacked
# (tab-like) layout; Shift goes back to the niri-equivalent scroller.
bind=SUPER+ALT,w,setlayout,deck
bind=SUPER+SHIFT,w,setlayout,scroller
bind=SUPER,w,switch_layout

# --- screenshots (niri has these built in) ----------------------------
bind=NONE,Print,spawn_shell,~/.config/mango/scripts/screenshot area
bind=CTRL,Print,spawn_shell,~/.config/mango/scripts/screenshot screen
bind=ALT,Print,spawn_shell,~/.config/mango/scripts/screenshot window
bind=NONE,F10,spawn_shell,~/.config/mango/scripts/screenshot area
bind=CTRL,F10,spawn_shell,~/.config/mango/scripts/screenshot screen
bind=ALT,F10,spawn_shell,~/.config/mango/scripts/screenshot window

# --- mouse ------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# mango's default binds NONE+btn_middle; left unbound so middle-click
# paste keeps working, as under niri.
# niri: Mod+MouseForward/Back switch-layout next/prev. mango cycles one
# way only, so both buttons advance.
mousebind=SUPER,btn_forward,switch_keyboard_layout
mousebind=SUPER,btn_back,switch_keyboard_layout

# --- scroll wheel (niri: WheelScroll* binds) --------------------------
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft

axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left

# niri mirrors the horizontal binds onto Shift+vertical scroll.
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left

# --- touchpad gestures (niri: four-finger swipe up -> overview) -------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,left,4,viewtoright_have_client

# ======================================================================
# passthrough mode — niri's Mod+Escape toggle-keyboard-shortcuts-inhibit.
# In this mode nothing but the way out is bound, so every key reaches the
# client. That is the escape hatch for remote desktops and KVM software.
# ======================================================================
bind=SUPER,Escape,setkeymode,passthrough

keymode=passthrough
bind=SUPER,Escape,setkeymode,default

# Back to default so anything sourced after this lands in the right mode.
keymode=default
