# ======================================================================
# rules.conf — window / tag / layer rules.  Mirrors niri/rules.kdl.
# ======================================================================

# --- tags -------------------------------------------------------------
# niri is scrollable-tiling, so every tag gets the scroller layout.
tagrule=id:*,layout_name:scroller

# --- windows ----------------------------------------------------------
# niri: window-rule { match app-id="^com.mitchellh.ghostty$"; opacity 0.85 }
windowrule=appid:^com\.mitchellh\.ghostty$,focused_opacity:0.85,unfocused_opacity:0.85

# niri: open-floating true
windowrule=isfloating:1,appid:^org\.gnome\.Calculator$
windowrule=isfloating:1,appid:^gnome-calculator$
windowrule=isfloating:1,appid:^galculator$
windowrule=isfloating:1,appid:^blueman-manager$
windowrule=isfloating:1,appid:^org\.gnome\.Nautilus$
windowrule=isfloating:1,appid:^xdg-desktop-portal$
windowrule=isfloating:1,appid:^slack$
windowrule=isfloating:1,appid:^signal$
windowrule=isfloating:1,appid:^Spotify$
# App ID is "Zoom" (capitalised) — a lowercase match never fires.
windowrule=isfloating:1,appid:^Zoom$
windowrule=isfloating:1,appid:firefox$,title:^Picture-in-Picture$

# niri: these open tiled at half width; mango sizes tiles by layout, so
# only the "do not float" half carries over.
windowrule=isfloating:0,appid:^gnome-control-center$
windowrule=isfloating:0,appid:^pavucontrol$
windowrule=isfloating:0,appid:^nm-connection-editor$

# niri: steam toasts — open-focused false
windowrule=isopensilent:1,appid:^steam$,title:^notificationtoasts_

# The Ctrl+Alt+Shift app binds in apps.conf drive these as named
# scratchpads; toggle_named_scratchpad tags the window itself, so they
# need no rule here. single_scratchpad=1 (the global default) keeps one
# on screen at a time.

# --- layers -----------------------------------------------------------
# niri: layer-rule { match namespace="^notifications$"; block-out-from "screencast" }
layerrule=layer_name:^notifications$,shield_when_capture:1
# niri: blur behind the launcher.
layerrule=layer_name:^launcher$,animation_type_open:zoom,animation_type_close:zoom
# niri parks quickshell and the wallpaper in the backdrop; mango has no
# backdrop layer, so just keep them out of the animation path.
layerrule=layer_name:^quickshell$,noanim:1
layerrule=layer_name:^wallpaper$,noanim:1,noblur:1,noshadow:1
