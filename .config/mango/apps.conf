# ======================================================================
# apps.conf — app launch / raise keybindings.  Mirrors niri/apps.kdl.
#
# Two behaviours, as in niri:
#
#   raise-cycle-spawn   focus the app, cycle if there are several, spawn
#                       if there are none.  scripts/raise-cycle-spawn is
#                       the mango port of ~/.local/bin/raise-cycle-spawn.
#
#   named scratchpad    show/hide the app on top of the current tag,
#                       spawning it the first time.  niri needed nirius
#                       and ~/.local/bin/niri-scratch-spawn for this;
#                       mango has toggle_named_scratchpad built in.
# ======================================================================

keymode=default

# --- plain launches ---------------------------------------------------
bind=SUPER,Return,spawn,ghostty
bind=SUPER,k,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,firefox

# --- terminals (raise / cycle / spawn) --------------------------------
bind=SUPER,apostrophe,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn com.mitchellh.ghostty ghostty
bind=CTRL+ALT+SHIFT,apostrophe,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn kitty kitty

# --- editors and browsers (raise / cycle / spawn) ---------------------
bind=CTRL+ALT+SHIFT,grave,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn emacs emacs
bind=CTRL+ALT+SHIFT,o,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn obsidian ~/.local/bin/obsidian
bind=CTRL+ALT+SHIFT,t,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn thunderbird thunderbird
bind=CTRL+ALT+SHIFT,f,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn com-fastmail-fastmail ~/.local/bin/fastmail
bind=CTRL+ALT+SHIFT,b,spawn_shell,~/.config/mango/scripts/raise-cycle-spawn firefox firefox

# --- named scratchpads ------------------------------------------------
# toggle_named_scratchpad,appid,title,command — `none` in the title slot
# means match on app id alone (an empty field would be dropped by the parser).
bind=CTRL+ALT+SHIFT,g,toggle_named_scratchpad,signal,none,signal-desktop
bind=CTRL+ALT+SHIFT,s,toggle_named_scratchpad,slack,none,slack
bind=CTRL+ALT+SHIFT,y,toggle_named_scratchpad,Spotify,none,spotify
bind=CTRL+ALT+SHIFT,1,toggle_named_scratchpad,1password,none,1password
bind=CTRL+ALT+SHIFT,e,toggle_named_scratchpad,com.system76.CosmicEdit,none,cosmic-edit

# --- one-offs ---------------------------------------------------------
bind=CTRL+ALT+SHIFT,c,spawn_shell,ghostty --title=CLOCK -e clock-rs --fmt "%d %b" -c blue
