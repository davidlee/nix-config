# ======================================================================
# animation.conf — mirrors niri/animation.kdl.
#
# niri names an animation per transition and takes a duration + named
# easing curve; mango takes a duration + raw cubic bezier. The beziers
# below are the standard easings niri names:
#
#   ease-out-quad   0.5,1,0.89,1
#   ease-out-cubic  0.33,1,0.68,1
#   ease-out-expo   0.16,1,0.3,1
#
# niri's spring-based animations (window-resize, overview-open-close)
# have no mango equivalent, so they borrow the nearest duration curve.
# ======================================================================

animations=1
# Carried over from the previous mango config: bar/notification layers
# animate badly under noctalia.
layer_animations=0

animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
# niri's workspaces stack vertically.
tag_animation_direction=0

# niri: window-open { duration-ms 140; curve "ease-out-quad" }
animation_duration_open=140
animation_curve_open=0.5,1,0.89,1

# niri: window-close { duration-ms 100; curve "ease-out-cubic" }
animation_duration_close=100
animation_curve_close=0.33,1,0.68,1

# niri: workspace-switch { duration-ms 180; curve "ease-out-cubic" }
animation_duration_tag=180
animation_curve_tag=0.33,1,0.68,1

# niri: window-movement { duration-ms 220; curve "ease-out-expo" }
animation_duration_move=220
animation_curve_move=0.16,1,0.3,1

# niri has no focus-change animation.
animation_duration_focus=180
animation_curve_focus=0.33,1,0.68,1

animation_curve_opafadein=0.5,1,0.89,1
animation_curve_opafadeout=0.33,1,0.68,1

zoom_initial_ratio=0.90
zoom_end_ratio=1.0
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
