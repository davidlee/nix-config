# ======================================================================
# io.conf — input devices and outputs.  Mirrors niri/io.kdl.
# ======================================================================

# --- keyboard ---------------------------------------------------------
# niri: keyboard { xkb { options "compose:menu" } numlock }
xkb_rules_layout=us
xkb_rules_options=compose:menu
numlockon=1
repeat_rate=25
repeat_delay=600

# --- pointer ----------------------------------------------------------
# niri: mouse { accel-speed 0.4 }
mouse_accel_speed=0.4
mouse_natural_scrolling=0
# niri's trackball block (accel-speed 0.2, scroll-button-lock) has no
# per-device equivalent here; mango applies one profile to all pointers.

# --- focus behaviour --------------------------------------------------
# niri: focus-follows-mouse max-scroll-amount="30%"
sloppyfocus=1
edge_scroller_pointer_focus=1
# niri: warp-mouse-to-focus
warpcursor=1
# niri: workspace-auto-back-and-forth
view_current_to_back=1
# niri: focus-ring/monitor behaviour — keep focus inside the current
# monitor and tag, like niri's focus-column-left/right.
focus_cross_monitor=0
focus_cross_tag=0
focusdir_only_zone_overlap=1

# --- cursor -----------------------------------------------------------
# niri: cursor { xcursor-size 48; hide-when-typing; hide-after-inactive-ms 800 }
# cursor_hide_timeout is in whole seconds, so 800ms rounds up to 1.
cursor_size=48
cursor_hide_on_keypress=1
cursor_hide_timeout=1

# --- gestures ---------------------------------------------------------
# niri: gestures { hot-corners { off } }
enable_hotarea=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=1
swipe_min_threshold=1

# --- outputs ----------------------------------------------------------
# niri: output "DP-3" { scale 1.1 }
monitorrule=name:^DP-3$,scale:1.1
