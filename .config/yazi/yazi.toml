# Overrides only; defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

[mgr]
show_hidden = true
linemode = "size"

# Caps image previews in px; raised from 600x900 so zoom and
# max-preview (T) have room to enlarge.
[preview]
max_width = 2000
max_height = 2000

# Images open in swayimg (xdg-open picks chromium). Enter / o / S-Right
# use the first opener; O lists the rest.
[opener]
view = [{ run = "swayimg %s", orphan = true, desc = "swayimg" }]

[[open.prepend_rules]]
mime = "image/*"
use = ["view", "open", "reveal"]

# git.yazi: status signs in the file list
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# piper.yazi: directory tree with eza
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

# piper.yazi: render markdown with glow
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
