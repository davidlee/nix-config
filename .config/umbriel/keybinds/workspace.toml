# Keybinds - media

# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/keybinds.md
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/actions.md

[keybinds]

# --- workspaces -------------------------------------------------------
"Mod+Page_Down"            = "workspace-next"
"Mod+Page_Up"              = "workspace-previous"

"Mod+Shift+Page_Down"      = "window-move-to-workspace-next"
"Mod+Shift+Page_Up"        = "window-move-to-workspace-previous"

"Mod+Alt+Page_Down"        = "column-move-to-workspace-next"
"Mod+Alt+Page_Up"          = "column-move-to-workspace-previous"

"Mod+Ctrl+Page_Down"       = "workspace-move-down"
"Mod+Ctrl+Page_Up"         = "workspace-move-up"

"Mod+Ctrl+Tab"             = "workspace-focus-last"

"Mod+1"                    = "workspace-switch 1"
"Mod+2"                    = "workspace-switch 2"
"Mod+3"                    = "workspace-switch 3"
"Mod+4"                    = "workspace-switch 4"
"Mod+5"                    = "workspace-switch 5"
"Mod+6"                    = "workspace-switch 6"
"Mod+7"                    = "workspace-switch 7"
"Mod+8"                    = "workspace-switch 8"
"Mod+9"                    = "workspace-switch 9"

"Mod+Shift+1"              = "window-move-to-workspace 1"
"Mod+Shift+2"              = "window-move-to-workspace 2"
"Mod+Shift+3"              = "window-move-to-workspace 3"
"Mod+Shift+4"              = "window-move-to-workspace 4"
"Mod+Shift+5"              = "window-move-to-workspace 5"
"Mod+Shift+6"              = "window-move-to-workspace 6"
"Mod+Shift+7"              = "window-move-to-workspace 7"
"Mod+Shift+8"              = "window-move-to-workspace 8"
"Mod+Shift+9"              = "window-move-to-workspace 9"

"Mod+Alt+1"                = "column-move-to-workspace 1"
"Mod+Alt+2"                = "column-move-to-workspace 2"
"Mod+Alt+3"                = "column-move-to-workspace 3"
"Mod+Alt+4"                = "column-move-to-workspace 4"
"Mod+Alt+5"                = "column-move-to-workspace 5"
"Mod+Alt+6"                = "column-move-to-workspace 6"
"Mod+Alt+7"                = "column-move-to-workspace 7"
"Mod+Alt+8"                = "column-move-to-workspace 8"
"Mod+Alt+9"                = "column-move-to-workspace 9"

# A workspace name is a config declaration, not a runtime label: these add
# and drop entries in workspaces.toml, which the config watcher applies.
"Mod+Alt+R"                = "spawn ~/.config/umbriel/scripts/named-workspace add"
"Mod+Ctrl+X"               = "spawn ~/.config/umbriel/scripts/named-workspace drop"
