# Applications reached by a key: launchers, raise-or-run, and scratchpads.
# One block per scratchpad holds its definition and window rules; TOML allows
# one [keybinds] table per file, so all binds are at the top.

# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/scratchpad.md
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/keybinds.md

[keybinds]

"Mod+Return"           = "spawn ghostty"
"Ctrl+Shift+grave"     = "spawn ghostty +toggle-quick-terminal"

"Mod+Shift+Return"     = "spawn firefox"
"Ctrl+Alt+Shift+L"     = 'spawn ghostty --title=CLOCK -e clock-rs --fmt "%d %b" -c "#ff7700"'

# --- raise or run -----------------------------------------------------
"Mod+Apostrophe"       = "spawn ~/.config/umbriel/scripts/raise-cycle-or-spawn com.mitchellh.ghostty ghostty"
"Mod+Semicolon"        = "spawn ~/.config/umbriel/scripts/raise-cycle-or-spawn kitty kitty"
"Ctrl+Alt+Shift+Grave" = "spawn ~/.config/umbriel/scripts/raise-cycle-or-spawn emacs emacsclient -n -c"
"Ctrl+Alt+Shift+E"     = "spawn ~/.config/umbriel/scripts/raise-cycle-or-spawn org.kde.dolphin dolphin"
"Ctrl+Alt+Shift+B"     = "spawn ~/.config/umbriel/scripts/raise-cycle-or-spawn firefox-devedition firefox"

# --- scratchpads (definitions and rules below) ----------------------
# User-serviceable pads:
# main
"Mod+N"                = "scratchpad-toggle main"
"Mod+Shift+N"          = "spawn ~/.config/umbriel/scripts/toggle-window-scratchpad main"
"Mod+Ctrl+N"           = "window-restore-from-scratchpad main"

# secondary
"Mod+D"                = "scratchpad-toggle secondary"
"Mod+Shift+D"          = "spawn ~/.config/umbriel/scripts/toggle-window-scratchpad secondary"
"Mod+Ctrl+D"           = "window-restore-from-scratchpad secondary"

# tertiary
"Mod+I"                = "scratchpad-toggle tertiary"
"Mod+Shift+I"          = "spawn ~/.config/umbriel/scripts/toggle-window-scratchpad tertiary"
"Mod+Ctrl+I"           = "window-restore-from-scratchpad tertiary"

# Apps and their nooks

"Ctrl+Alt+Shift+G"     = "scratchpad-toggle signal"
"Ctrl+Alt+Shift+Y"     = "scratchpad-toggle spotify"
"Ctrl+Alt+Shift+1"     = "scratchpad-toggle onepassword"
"Ctrl+Alt+Shift+C"     = "scratchpad-toggle edit"
"Ctrl+Alt+Shift+D"     = "scratchpad-toggle discord"
"Ctrl+Alt+Shift+U"     = "scratchpad-toggle umbriel"
"Ctrl+Alt+Shift+F"     = "scratchpad-toggle fastmail"
