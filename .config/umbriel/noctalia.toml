# ======================================================================
# noctalia.toml — port of ~/.config/niri/noctalia.kdl
#
# The palette. Listed under [include.optional] in config.toml, so Umbriel
# merges it after every required include and it wins — the same effect
# niri gets by including noctalia.kdl last. Expect Noctalia to overwrite
# this file once its Umbriel colour export is pointed here.
# ======================================================================

[colors]
background = "#1A1B26FF"      # Umbriel's own panels and banners
text_primary = "#C0CAF5FF"
text_muted = "#565F89FF"
accent_primary = "#7AA2F7FF"
accent_secondary = "#E0AF68FF"
warning = "#E0AF68FF"
error = "#F7768EFF"
insert_hint = "#7AA2F780"     # niri: insert-hint { color "#7aa2f780" }

[colors.border]
focused = "#7AA2F7FF"         # niri: focus-ring { active-color }
unfocused = "#1A1B26FF"       # niri: focus-ring { inactive-color }
scratchpad_focused = "#E0AF68FF"
scratchpad_unfocused = "#3D2F14FF"
outer = "#1A1B26FF"

[colors.overview]
badge = "#7AA2F7FF"
workspace_background = "#00000044"

# Dropped: niri's urgent colours (focus-ring/border/tab-indicator
# urgent-color "#f7768e") and tab-indicator colours. Umbriel has neither an
# urgent border colour nor tabbed columns. See MAPPING.md.
