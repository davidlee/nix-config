# ======================================================================
# layout.toml — port of ~/.config/niri/layout.kdl
# https://docs.noctalia.dev/umbriel/layout/
# https://docs.noctalia.dev/umbriel/appearance/
#
# Colors here are the structural ones niri did not take from Noctalia.
# The palette lives in noctalia.toml, an optional include, which Umbriel
# merges after this file and so wins — the same ordering niri gets by
# including noctalia.kdl last.
# ======================================================================

# --- layout -----------------------------------------------------------
[layout]
mode = "scrolling"
gap = 0 # niri's default `gaps`, which the niri config left unset
# niri: preset-column-widths. Umbriel uses one preset list for both the
# primary (column width) and secondary (window height) extent.
extent_presets = [0.2, 0.25, 0.33333, 0.4, 0.66667, 0.8, 1]

[layout.struts]
top = 0
left = 0
right = 0
bottom = 0

[layout.scrolling]
default_extent_fraction = 0.2 # niri: default-column-width { proportion 0.2 }
center_underfull_strip = true
center_focused = "on_overflow"

# --- structural colors ------------------------------------------------
[colors]
backdrop = "#00000000"  # niri: layout { background-color "transparent" }
shadow = "#000000FF"

[colors.overview]
background_tint = "#00000000" # niri: overview { backdrop-color "transparent" }
