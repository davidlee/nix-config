# Tiling, workspaces and the overview.
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/layout.md
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/workspaces.md
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/workspaces-overview.md

[layout]
mode = "scrolling"
gap = 0
# One preset list for both the primary (column width) and secondary (window
# height) extent.
extent_presets = [0.2, 0.25, 0.33333, 0.4, 0.66667, 0.8, 1]

[layout.scrolling]
default_extent_fraction = 0.2
center_focused = "on_overflow"

# --- workspaces -------------------------------------------------------
# A named entry materializes a persistent workspace on every dynamic output.
# More are generated into workspaces.toml by scripts/named-workspace.
[workspaces]
back_and_forth = true
empty_above = false

[[workspace]]
name = "emacs"

# --- overview ---------------------------------------------------------
[overview]
zoom = 0.4
background_blur = true
workspace_wallpaper = true
shortcuts = true
