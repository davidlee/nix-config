# Keybinds: the session, windows, layout and workspaces. App launchers,
# raise-or-run and scratchpad binds are in apps.toml.
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/keybinds.md
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/actions.md

[keybinds]

# --- cheatsheet, launcher, panels -------------------------------------
"Mod+Shift+Slash" = "cheatsheet-toggle"
# "Ctrl+Alt+Space" = "spawn walker"
"Alt+Mod+Space" = "spawn noctalia msg panel-toggle launcher"
"Mod+Space" = "spawn vicinae toggle"
"Mod+Z" = "spawn noctalia msg panel-toggle clipboard"
"Alt+Tab" = "spawn noctalia msg window-switcher"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher" # the switcher reverses itself

# --- system -----------------------------------------------------------
"Mod+Alt+L" = "spawn noctalia msg session lock"
"Mod+Shift+E" = "session-quit"
"Ctrl+Alt+Delete" = "spawn noctalia msg panel-open session"
"Mod+Ctrl+P" = { action = "dpms-off", repeat = false } # any input wakes them
"Mod+Ctrl+M" = "spawn noctalia msg mic-volume-set 100"
# streaming dictation (flakes: dictate.nix). F13/F14 are push-to-talk: ZMK's
# `ptt` macro taps F13 on key down and F14 on key up (zmk-config combos.dtsi).
# xkb names F13/F14 XF86Tools/XF86Launch5; binds match the keysym.
"F9" = { action = "spawn ~/.local/bin/dictate toggle", repeat = false }
"XF86Tools" = { action = "spawn ~/.local/bin/dictate start", repeat = false }
"XF86Launch5" = { action = "spawn ~/.local/bin/dictate stop", repeat = false }
"Mod+B" = "spawn noctalia msg bar-toggle"
"Mod+Ctrl+Comma" = "spawn noctalia msg settings-toggle"
"Mod+Y" = "spawn noctalia msg panel-toggle wallpaper"
"Mod+U" = "spawn noctalia msg panel-toggle control-center notifications"
"Mod+L" = "spawn noctalia msg panel-toggle control-center"
"Mod+Shift+U" = "spawn noctalia msg notification-dnd-toggle"
# Rescue term runs in session.slice, which oom.nix protects from app.slice hogs.
"Mod+Ctrl+Delete" = "spawn systemd-run --user --scope --slice=session.slice --quiet kitty --class emergency-htop -o initial_window_width=120c -o initial_window_height=40c -e htop"

# Applications that inhibit shortcuts (remote desktop, software KVM) still
# leave this one way out.
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# --- audio ------------------------------------------------------------
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true }
"XF86AudioPause" = { action = "spawn noctalia msg media toggle", allow_when_locked = true }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"Mod+Backslash" = { action = "spawn ~/.local/bin/toggle-audio-sink", allow_when_locked = true }

# --- brightness -------------------------------------------------------
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up 5", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down 5", allow_when_locked = true }

# --- overview and window lifecycle ------------------------------------
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

# --- focus ------------------------------------------------------------
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
# window-focus-up/down, but stepping through tabs first: Umbriel skips them.
# Back to the native actions if upstream gains this (NOTES.md). Mod+Page_Up/Down
# change workspace.
"Mod+Up" = "spawn ~/.config/umbriel/scripts/focus-vertical up"
"Mod+Down" = "spawn ~/.config/umbriel/scripts/focus-vertical down"

"Mod+Alt+Down" = "column-focus-tab-next"
"Mod+Alt+Up" = "column-focus-tab-previous"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# --- move -------------------------------------------------------------
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"

# --- monitors ---------------------------------------------------------
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Right" = "output-focus-right"

"Mod+Ctrl+Shift+Left" = "column-move-to-output-left"
"Mod+Ctrl+Shift+Down" = "column-move-to-output-down"
"Mod+Ctrl+Shift+Up" = "column-move-to-output-up"
"Mod+Ctrl+Shift+Right" = "column-move-to-output-right"

# --- workspaces -------------------------------------------------------
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"

"Mod+Shift+Page_Down" = "column-move-to-workspace-next"
"Mod+Shift+Page_Up" = "column-move-to-workspace-previous"

"Mod+Alt+Page_Down" = "window-move-to-workspace-next"
"Mod+Alt+Page_Up" = "window-move-to-workspace-previous"

"Mod+Ctrl+Page_Down" = "workspace-move-down"
"Mod+Ctrl+Page_Up" = "workspace-move-up"

"Mod+Alt+Tab" = "workspace-focus-last"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"

"Mod+Alt+1" = "window-move-to-workspace 1"
"Mod+Alt+2" = "window-move-to-workspace 2"
"Mod+Alt+3" = "window-move-to-workspace 3"
"Mod+Alt+4" = "window-move-to-workspace 4"
"Mod+Alt+5" = "window-move-to-workspace 5"
"Mod+Alt+6" = "window-move-to-workspace 6"
"Mod+Alt+7" = "window-move-to-workspace 7"
"Mod+Alt+8" = "window-move-to-workspace 8"
"Mod+Alt+9" = "window-move-to-workspace 9"

# A workspace name is a config declaration, not a runtime label: these add
# and drop entries in workspaces.toml, which the config watcher applies.
"Mod+Alt+R" = "spawn ~/.config/umbriel/scripts/named-workspace add"
"Mod+Ctrl+X" = "spawn ~/.config/umbriel/scripts/named-workspace drop"

# --- mouse wheel ------------------------------------------------------
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"

# Shift turns vertical wheel into horizontal, as applications do.
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

# --- window switching -------------------------------------------------
# Layout order; Mod+Grave returns to the previously focused window.
"Mod+Tab" = "window-focus-next"
"Mod+Shift+Tab" = "window-focus-previous"
"Mod+Grave" = "window-focus-last"

# --- columns and stacks -----------------------------------------------
"Mod+BracketLeft" = "window-consume-from-left" # pull the neighbour in
"Mod+BracketRight" = "window-consume-from-right"
"Mod+Shift+BracketLeft" = "window-consume-or-expel-left"
"Mod+Shift+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-or-expel-left"
"Mod+Period" = "window-consume-or-expel-right"
"Mod+Shift+Comma" = "window-consume-left"
"Mod+Shift+Period" = "window-consume-right"

# --- sizing -----------------------------------------------------------
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Ctrl+Shift+R" = "window-cycle-secondary-extent"
"Mod+Ctrl+R" = "window-cycle-secondary-extent-back"

"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent 0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent 0.1"

"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+M" = "window-toggle-maximize-to-edges"

"Mod+C" = "column-center"
"Mod+Shift+C" = "window-center" # floating windows only

# --- floating, tabs and layout mode -----------------------------------
"Mod+V" = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"

"Mod+W" = "workspace-set-layout toggle"
"Mod+Shift+W" = "workspace-set-layout scrolling"
"Mod+S" = "column-toggle-tabbed"

"Mod+X" = "layout-master-count-increase"
"Mod+Shift+X" = "layout-master-count-decrease"

# --- keyboard layout --------------------------------------------------
"Mod+MouseForward" = "keyboard-layout-next"

# --- screenshots ------------------------------------------------------
# Umbriel has no built-in screenshot; scripts/screenshot uses grim, slurp and satty.
"Print" = "spawn ~/.config/umbriel/scripts/screenshot area"
"Ctrl+Print" = "spawn ~/.config/umbriel/scripts/screenshot screen"
"Alt+Print" = "spawn ~/.config/umbriel/scripts/screenshot window"
"F10" = "spawn ~/.config/umbriel/scripts/screenshot area"
"Ctrl+F10" = "spawn ~/.config/umbriel/scripts/screenshot screen"
"Alt+F10" = "spawn ~/.config/umbriel/scripts/screenshot window"
