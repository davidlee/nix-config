# Animation timing and curves.
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/animation.md

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 140
curve = "easeout"
style = "popin"
scale = 0.9

[animation.windows_out]
enabled = true
duration_ms = 100
curve = "easeout"
style = "fade"

[animation.windows_move]
enabled = true
duration_ms = 220
# curve = "spring:0.85,423"
curve = "easeinout"

[animation.workspaces]
enabled = true
duration_ms = 180
curve = "easeout"

# workspace_curve is the filmstrip scroll inside the overview.
[animation.overview]
enabled = true
curve = "spring:0.85,500"
workspace_curve = "spring:1,1000"

# A short fade with no dim or blur: scratchpads look like floating windows.
[animation.scratchpad]
enabled = true
duration_ms = 150
curve = "easeout"
dim = 0.0
blur = false
# scale = 0.0

[animation.border]
duration_ms = 160
enabled = true

[animation.dim_unfocused]
enabled = false # unfocused opacity !!!
dim = 0.1

[animation.layers]
enabled = false
