# Animation timing and curves.
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/animation.md

[include]
files = [
  "/run/current-system/sw/share/umbriel/effects/animation/workspace_wipe/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/reveal/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/squash/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/border/pulse/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/border/audio/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/window/scanlines/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/screen/vignette/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/cursor/trail/effect.toml"
]

[effects]
border = "pulse"
cursor = "trail"

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 220
curve = "easeout"
style = "popin"
scale = 0.9
effect = "reveal"

[animation.windows_out]
duration_ms = 220
curve = "easeout"
effect = "reveal"
style = "zoom"

[animation.windows_move]
duration_ms = 120
curve = "easeinout"
# effect = "reveal"

[animation.windows_resize]
enabled = true
duration_ms = 120
curve = "easeinout"

#wait_for_redraw = true
#enabled = false

[animation.workspaces]
curve = "spring:0.9,800"
style = "reveal"
effect = "workspace_wipe"

[animation.windows_drag]
physics = true
stiffness = 200
damping = 20
coupling = 4
pointer_response = 2.0

[animation.overview]
enabled = true
curve = "spring:0.95,300"
workspace_curve = "spring:1,1000"

[animation.scratchpad]
enabled = true
duration_ms = 250
curve = "easeout"
dim = 0.3
blur = false

[animation.border]
enabled = true
curve = "spring:0.4,900"

[animation.dim_unfocused]
enabled = false
dim = 0.1

[animation.layers]
enabled = true
