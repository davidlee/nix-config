# Window decoration: borders, title and tab bars, blur, shadow. Colours are
# in the palette (gruvbox.toml).
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/appearance.md

[layout]
gap = 2

[[workspace]]
index = 1
layout.gap = 4

[[workspace]]
index = 2
layout.gap = 8

[[workspace]]
index = 3
layout.gap = 12

[[workspace]]
index = 4
layout.gap = 16

[[workspace]]
index = 5
layout.gap = 20

[appearance]
prefer_no_csd = true
border_width = 1
outer_border_width = 0
drag_opacity = 0.9
corner_radius = 0

[appearance.title_bar]
mode = "off"
height = 24
font = "hack 12"
button_corner_radius = 6

[appearance.tab_bar]
position = "left"
tab_gap = 2
hide_when_single = false
style = "indicator"
overflow = "scroll"
height = 8
corner_radius = 1
visible = true

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 1.0
contrast = 1.0
saturation = 1.2

[appearance.shadow]
enabled = true
softness = 20
offset_x = 3
offset_y = 5

# The focused window gets an outer ring; its colours are in the palette.
[[window_rule]]
match.is_focused = true
outer_border_width = 1

# A window being shared gets a thicker frame; colour in the palette. Viewers
# don't see it.
[[window_rule]]
match.is_cast_target = true
border_width = 3
