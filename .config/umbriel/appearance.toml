# Window decoration: borders, title and tab bars, blur, shadow. Colours are
# in the palette (gruvbox.toml).
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/appearance.md

[appearance]
prefer_no_csd = true
border_width = 1
outer_border_width = 0
drag_opacity = 0.9

[appearance.title_bar]
mode = "on"
height = 24
font = "hack 12"
button_corner_radius = 6

[appearance.tab_bar]
position = "left"
tab_gap = 2
hide_when_single = false
title_format = ""
overflow = "scroll"
height = 8
corner_radius = 1
visible = true

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 1.0
contrast = 1.0
saturation = 1.2

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 3

# The focused window gets an outer ring; its colours are in the palette.
[[window_rule]]
match.is_focused = true
outer_border_width = 2
