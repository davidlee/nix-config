# ======================================================================
# config.toml — port of ~/.config/niri/config.kdl
#
# Umbriel merges required includes in list order, then optional includes,
# then this file. So this file wins over every include, and the optional
# Noctalia palette wins over the required layout.toml. Rule lists
# ([[window_rule]], [[layer_rule]], [[workspace]], [[scratchpad]])
# accumulate across all files.
#
# Validate: umbriel validate -c ~/.config/umbriel/config.toml
# See MAPPING.md for what niri does that Umbriel cannot, and vice versa.
# ======================================================================

[include]
files = [
  "io.toml",
  "layout.toml",
  "rules.toml",
  "binds.toml",
  "apps.toml",
  "appearance.toml",
  "animation.toml",
]

[include.optional]
files = [
  "gruvbox.toml",
  "workspaces.toml",
]

# --- general ----------------------------------------------------------
[general]
autostart = [
  "noctalia",
  "vicinae server",
  "1password --silent",
  "signal-desktop",
]
xwayland = true
show_cheatsheet = true
focus_on_activate = false

#[environment]

# --- workspaces -------------------------------------------------------
# A named entry materializes a persistent workspace on every dynamic output.
[workspaces]
back_and_forth = true
empty_above = false

[[workspace]]
name = "emacs"

# [[workspace]]
# name = "browser"
#
# [[workspace]]
# name = "dev"
#
# [[workspace]]
# name = "comms"

# --- overview ---------------------------------------------------------
# Umbriel has no per-workspace shadow in overview; colors live in colors.overview.
[overview]
zoom = 0.4
background_blur = true
workspace_wallpaper = true
shortcuts = true

# --- hot corners ------------------------------------------------------
[hot_corners.top_left]
enabled = false

[hot_corners.top_right]
enabled = false

[hot_corners.bottom_left]
enabled = false

[hot_corners.bottom_right]
enabled = false
