# Entry point: includes, session startup.
# https://github.com/noctalia-dev/umbriel/tree/main/docs/user/configuration.md
#
# Umbriel merges required includes in list order, then optional includes,
# then this file; a later file wins. Rule arrays ([[window_rule]],
# [[layer_rule]], [[workspace]], [[scratchpad]]) accumulate across files.


[include]
files = [
  # by documentation section:
  "layout.toml",
  "input.toml",
  "outputs.toml",
  "rules.toml",
  "appearance.toml",
  "animation.toml",
  # scratchpads + rules
  # for app binds:
  "app_support.toml",
  # key bindings
  "keybinds/navigation.toml",
  "keybinds/system.toml",
  "keybinds/apps.toml",
  "keybinds/workspace.toml",
  "keybinds/media.toml",
  "keybinds/mouse.toml",
]

[include.optional]
files = [
  "gruvbox.toml",    # the palette: every colour
  "workspaces.toml", # generated by scripts/named-workspace
]

[general]
autostart = [
  "noctalia",
  "vicinae server",
  "1password --silent",
  "signal-desktop",
]

show_cheatsheet = false
xwayland_native_resolution = true
# xwayland_primary_output = "DP-3"

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "wayland"
SDL_VIDEODRIVER = "wayland"
