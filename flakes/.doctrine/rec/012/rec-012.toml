id    = 12
slug  = "accept-req-028"
title = "accept REQ-028"
# no status — a REC is the immutable record of ONE reconciliation act:
# it has no lifecycle, so no status is stored. The act is the commit.

[rec]
move = "accept"              # accept | revise | redesign
owning_slice = "SL-023"

# status_deltas — the requirement-status facts THIS act already applied. May be
# EMPTY for a `redesign`, which records the reconcile→design escalation, not an
# instance-truth write. The reconcile writer appends
# them as `[[status_delta]]` tables; a fresh `rec new` writes none:
#   [[status_delta]]
#   requirement = "REQ-NNN"
#   from = "pending"
#   to   = "active"
#
# evidence_refs — the coverage entries this act rests on, cited by the stable
# 4-tuple key (slice, requirement, contributing_change, mode), never a file#line:
#   [[evidence_ref]]
#   slice = "SL-NNN"
#   requirement = "REQ-NNN"
#   contributing_change = "SL-NNN"
#   mode = "VT"

[[status_delta]]
requirement = "REQ-028"
from = "pending"
to = "active"

[[evidence_ref]]
slice = "SL-023"
requirement = "REQ-028"
contributing_change = "SL-023"
mode = "VA"
