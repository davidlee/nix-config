choice = "Keep the check, reworded: any outer option at <area>.<name> would be a second switch for a feature. The resolver returns only { modules }; the features specialArg goes."
alternatives = ["Drop the check with the flags (slice scope wording)"]
rationale = "Outer settings schemas (ADR-002 D4, CPT-001 default session) remain legitimate outer options; the guard stays cheap and ADR-002 stays unamended on this point."
consequences = ["Its resolver test keeps its fixture-declared option and no longer depends on modules/features.nix"]
