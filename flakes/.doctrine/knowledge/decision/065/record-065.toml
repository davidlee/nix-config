[facet]                         # every field typed; seeded empty (captured later)
context = "A LiteLLM openrouter/* wildcard would serve any OpenRouter model, but the key gate is an exact match (DEC-051), the admin CLI bakes the served names (DEC-050), SL-013's fail-safe rests on each key's own model list, and /v1/models would list all 269 mapped OpenRouter ids."
choice = "Every OpenRouter model the gateway serves is its own entry in the served-model list."
alternatives = ["openrouter/* wildcard with pattern matching in the gate and CLI"]
rationale = "gptel's hand-picked list is about 15 models; explicit entries keep every existing invariant."
consequences = ["A new OpenRouter model is a one-entry edit and a rebuild", "Keys still name exact models"]
