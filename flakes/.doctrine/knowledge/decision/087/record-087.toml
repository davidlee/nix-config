choice = "route_gate holds a field set per POST route: chat unchanged; /v1/systemone {model, state, questions, assets}; /v1/decisions {model, input, questions, safety_identifier}."
alternatives = ["one union set for all routes"]
rationale = "A union would admit chat fields on decisions and vice versa. assets lets raw-JSON clients send images (header opt-in)."
