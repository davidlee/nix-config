id = 16
slug = "factories-inject-platform-module"
title = "Factories inject one platform module; evaluators build pkgs; local fix overlays sit beside their consumer"
record_kind = "decision"
status = "accepted"
created = "2026-10-15"
updated = "2026-10-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "mkDarwin pre-built pkgs and passed it as a specialArg, so darwin-module nixpkgs.overlays were silently ignored (ISS-004). Each factory built or plumbed pkgs differently: four nixpkgs imports, agentsOverlay bound twice, stable passed as a specialArg to NixOS and home but not darwin, hostPlatform only from NixOS hardware config."
choice = "Factories pass host identity only: specialArgs = {inputs username hostname features} for every kind. Each evaluation gets one injected module: NixOS and darwin get nixpkgs.hostPlatform = meta.system (plain priority, IMP-009) plus nixpkgs.overlays = mkAfter [agentsOverlay] and _module.args.stable (stableModule); home gets nixpkgs.config.allowUnfree plus its overlays [lem claude-desktop agents llm-agents] plus stableModule as a module over a bare import of nixpkgs-home (conditional on the drvs gate showing Linux home identical; fallback keeps home overlays in the factory). stable becomes a module argument (_module.args.stable) set by the injected module; the 4 call sites are unchanged. It is kept out of pkgs: callPackage would inject a pkgs.stable into kicad's and guile-cairo's `stable ? true` (RV-009 F-2). darwin sets nixpkgs.config.allowUnfree in darwin/default.nix. agentsOverlay is bound once in hosts.nix. Local fix overlays live as modules beside their consumer. The darwin direnv doCheck overlay and the lix-tools overlay are deleted. mkPkgs/importPkgs is not introduced: three explicit imports remain and each has a different policy (stable: allowUnfree, as a module argument; nixpkgs-home: bare base for Home Manager to re-import; nixpkgs: legacyPackages with allowUnfree and agents), so a shared helper would only take parameters. A permanent evaluation-only check asserts an overlay set in a darwin module reaches darwin pkgs."
alternatives = ["Keep stable as a commonArgs specialArg (plumbing every factory must remember; darwin lacking it was that failure)", "Each module imports inputs.stable itself (4 copies; 4 instantiations)", "stable as pkgs.stable via overlay (callPackage injects it into packages declaring a stable argument: kicad; guile-cairo; RV-009 F-2)", "stable as pkgs.pkgsStable via overlay (collision-free but an odd namespace; superseded by the module argument on user direction 2026-10-15)", "Move direnv fix to the Mac home (obsolete: unpatched direnv and mise are cached for aarch64-darwin; the overlay forced local builds)", "Introduce mkPkgs helper (three imports with three different policies; a helper would only take parameters)"]
rationale = "One rule for every evaluation: the factory supplies identity plus one injected module, the evaluator builds pkgs, local fixes are modules. Removes the plumbing drift that caused ISS-004 and darwin's missing stable, and deletes code instead of adding a helper."
consequences = ["NixOS and Linux home derivations stay identical (gate)", "darwin gains an unused agents overlay and stable module argument: drv-neutral but every Mac evaluation must override the agents input (RV-009 F-1)", "legacyPackages is unchanged", "Draupnir fetches direnv and mise from cache.nixos.org instead of building them", "CHR-003 resolves without an importPkgs helper"]
decided_by = "user"
decided_on = "2026-10-15"

