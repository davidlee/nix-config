[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-030 splits profiles per platform; personal means the machines the user owns."
choice = "Areas satan (harness, patcher, attrd) and attention (behaviour, nudge, goad); audio.alarm. personal (portable) selects editor.emacs, editor.neovim, editor.misc and every cli feature with portable content, so Draupnir's effective selection is unchanged; personal-linux imports personal and selects satan.*, attention.*, media.spotify, services.postgresql; personal-darwin imports personal. audio.alarm is host-selected by Sleipnir (its Spotify Connect device name and speaker are bound to that machine; RV-017 F-8). Draupnir gains hosts/Draupnir/features.nix importing personal-darwin; Sleipnir imports personal-linux. walker becomes shell.walker (host-selected); sleipnir-doctor becomes Sleipnir host config."
alternatives = ["one personal area", "sleipnir-doctor as a personal feature", "walker in desktop.core"]
rationale = "Areas group by what a thing is; panopticon, nudge and goad form one observe-nudge-intervene loop. The doctor is named for and checks one host."
consequences = ["satan.harness requires editor.emacs.", "goad's darwin half waits for IMP-023."]
