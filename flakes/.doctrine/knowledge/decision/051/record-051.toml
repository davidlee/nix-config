schema = "doctrine.knowledge"
version = 1

id = 51
slug = "gateway-key-store-semantics"
title = "Gateway key store: lifetime budgets checked pre-call, allow-list in the pre-call hook, priced models only"
record_kind = "decision"
status = "accepted"
created = "2026-10-17"
updated = "2026-10-17"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-046 fixed the key-store fields and left open overshoot, unknown cost and where the model allow-list is enforced."
choice = "Table keys(hash primary key, alias unique, models, budget_usd, spent_usd, created, revoked_at). Revoke marks the row; spend history stays. Budgets are lifetime totals reset by the admin CLI, checked before each call against recorded spend: a safety net, not a hard cap. Under healthy accounting concurrent requests overshoot by about one request's cost each; lost accounting (a cost of 0 or none, DEC-068, or a failed ledger write) is unbounded. The allow-list is enforced in LiteLLM's async_pre_call_hook against the request's model; only chat-completion and model-listing routes are allowed. The build admits a model only by DEC-064's rule: its provider reports cost, or it sets both prices, or it is in the packaged cost map. Setting one price alone is an evaluation error; a missing cost at run time is logged and counted as 0. (Overshoot wording amended 2026-10-18, SPEC-001 review.)"
alternatives = ["Reserve cost from max_tokens before the call and refund after (needs price lookup and refunds)", "Periodic (monthly) budgets", "Fail closed at run time on unknown cost (refuses requests the provider already served)", "Enforce the allow-list inside custom_auth by reading the request body"]
rationale = "Smallest semantics that make budgets a safety net rather than an accounting system; the pre-call hook is LiteLLM's documented point that sees both the parsed request and the auth result."
consequences = ["Concurrent requests can overshoot a budget; lost accounting can exceed it without bound", "Model prices come from the provider's report; explicit prices or the pinned packaged map (DEC-064); map drift is caught by the build check", "The surface tests must run against the LiteLLM the system nixpkgs ships (1.102.1; not the spike's 1.100.1)"]
decided_by = "user (2026-10-17)"
decided_on = "2026-10-17"

