schema = "doctrine.knowledge"
version = 1

id = 121
slug = "sccache-unix-sockets"
title = "sccache servers on per-side unix sockets: host under XDG_RUNTIME_DIR, each jail in its /tmp"
record_kind = "decision"
status = "accepted"
created = "2026-11-03"
updated = "2026-11-03"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-023 PHASE-07 F-1: sccache's server runs the compiler, and by default listens on TCP 127.0.0.1:4226. Networked jails share the host's network namespace, so a jailed cargo used a host sccache server: rustc (build scripts, proc macros) ran unconfined on the host. Evidence: ENOENT writing the jail-private /tmp/sc-t from the host server; with the host server stopped the jail started its own and built. DEC-114 put RUSTC_WRAPPER=sccache in the host list for host shells and every jail."
choice = "Each side's sccache server listens on its own unix socket. Jails: the library's envOptions set SCCACHE_SERVER_UDS=/tmp/sccache.sock (every jail and form; /tmp is per-jail tmpfs). Host: agents/dev-env.nix hostOnlyEnv (Linux only) sets SCCACHE_SERVER_UDS=${XDG_RUNTIME_DIR}/sccache.sock, applied by the dev.env feature only, never in env (which consumers apply to jails). No library jail binds /run/user/<uid>. Doctrine's dispatch jail sees all of / and inherits the env, so it sets the same /tmp socket itself (doctrine:scripts/spawn-confined.sh, pi-respawn-nofork.sh; RV-047 F-1). darwin keeps sccache's default (no jails, no XDG_RUNTIME_DIR)."
alternatives = ["B: socket or port change in jails only: fixes the accidental crossing, but a jailed agent can still reach a host TCP server deliberately", "C: no sccache on the host: loses host caching; reopens whenever anything on the host starts a TCP server", "D: block host loopback from networked jails except the gateway: the class fix, out of scope; filed as RSK-001 (operator: needs stronger medicine than a port filter)"]
rationale = "Removes the TCP listener on both sides, so neither the accidental nor the deliberate route exists while every server is started with the variable set; per-side paths keep host and jail servers apart."
consequences = ["agents/dev-env.nix's for gains hostOnlyEnv; design § Host facts / DEC-114 to reconcile", "Residual: a host sccache started without SCCACHE_SERVER_UDS (a shell outside the home session env) listens on TCP again; covered by RSK-001", "Host server takes effect after a home switch and a fresh login; a running TCP server must be stopped (sccache --stop-server)", "A jail that sees all of / must set its own socket: the host's address is safe only there (RV-047 F-1)"]
decided_by = "user (\"A\", 2026-11-04, after /consult)"
decided_on = "2026-11-04"

