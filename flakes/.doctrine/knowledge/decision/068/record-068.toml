context = "DEC-051 logs and counts a missing run-time cost as 0. Under DEC-064 every served model has a cost source; OpenRouter free and :free models legitimately cost 0."
choice = "Keep DEC-051's run-time rule unchanged. Add a test that OpenRouter's reported usage.cost reaches the ledger, streaming and non-streaming."
alternatives = ["Log an error and block the key until reset (needs a free-model exemption list)"]
rationale = "An unexpected 0 is now rare and visible in the journal; free models make a hard rule noisy."
consequences = ["DEC-051's run-time clause stands"]
