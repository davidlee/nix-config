context = "launch dir binds at /workspace/$(basename $PWD) at run time, before workspace deps; a same-basename dep (now ro) would cover the rw project."
choice = "emit the launch-dir bind after the workspace-dep binds; bwrap's later mount wins, so the project is always visible and rw."
alternatives = ["launcher refuses at run time on a clash", "launcher skips the clashing dep"]
rationale = "no run-time logic; the eval-time list cannot see $PWD"
consequences = ["a dep with the project's basename is shadowed (inverse of today's behaviour)"]
