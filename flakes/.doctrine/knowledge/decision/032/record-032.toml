[facet]                         # every field typed; seeded empty (captured later)
context = "IMP-016 (apps taxonomy) asked to be settled with W5; linux GUI home modules and the cli _packages buckets are unflagged."
choice = "Organise by function, not GUI/TUI form; split a group where a host would plausibly select its parts independently. Areas: editor (emacs neovim kakoune zed lem misc), notes (joplin terminal), dev (scm: sublime-merge plus scm.nix minus git; build; runtimes; runners; tools), docs (diagrams typeset markdown help), data (structured hex), files (manage disk archive search sync), net (tools), web (browsers terminal), system (monitor process), text (tools pagers dictionary), office (calc calendar), security (credentials research), media (players spotify view convert obs), graphics (paint modelling color cad; apps.cad moves, apps area retired), comms (chat mail feeds), fun (toys), terminal (emulators utils), ai (claude-desktop). Exact membership per design.md taxonomy section. The NixOS linuxSystem bucket stays in the NixOS base. Revised 2026-10-16 after RV-017 (F-9, F-10, F-11, F-13): dev, security, media and graphics split by job; markdown moves to docs."
alternatives = ["a gui area (gui.browsers, gui.office, ...)", "all desktop home modules folded into desktop.core", "cli buckets kept in the base, repartitioned only"]
rationale = "User (2026-10-16): function is the more useful organising principle than form. Each existing file is already a functional group, so the mapping is close to one feature per file."
consequences = ["IMP-016 resolved by this decision.", "cli features keep common ++ optionals isLinux linuxHome until the behaviour phase.", "Linux-only GUI features carry platforms = lib.platforms.linux."]
decided_by = "user (2026-10-16)"
decided_on = "2026-10-16"

