slug = "flake-outputs-gated"
title = "Flake package outputs live in hosts.nix and the drvs gate covers them"
record_kind = "decision"
status = "accepted"
created = "2026-10-15"
updated = "2026-10-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "legacyPackages and packages sit in flake.nix with a second agentsOverlay binding; just drvs does not cover legacyPackages, packages or templates (CHR-004); default.nix is a tracked, unreferenced byte-identical copy of flake.nix."
choice = "legacyPackages and packages move into hosts.nix's flake attrset, linux-only as now; flake.nix keeps inputs, flake-parts wiring and templates. default.nix is deleted. just drvs gains packages (hash of all drvPaths per system), legacyPackages (probe drvPaths of stdenv, codex, claude) and templates (path and description), added and baselined before the move."
alternatives = ["Move them into perSystem (silently adds aarch64-darwin outputs)", "Gate legacyPackages exhaustively (infeasible over all of nixpkgs)"]
rationale = "flake.nix becomes inputs plus wiring; the move is gated rather than eyeballed."
consequences = ["CHR-004 resolves", "legacyPackages gate is a probe, not proof", "legacyPackages is the agents overlay's only carrier (DEC-040, SL-009)"]
decided_by = "user"
decided_on = "2026-10-15"

