schema = "doctrine.knowledge"
version = 1

id = 83
slug = "login-shell-feature"
title = "The user's login shell belongs to the shell's feature; nushell is a feature (amends DEC-042)"
record_kind = "decision"
status = "accepted"
created = "2026-10-27"
updated = "2026-10-27"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Commit 85686442 made zsh the user's login shell in the NixOS base (modules/nixos/user.nix) while programs.zsh stayed in terminal.zsh (DEC-042). NixOS refuses a zsh login shell without programs.zsh, so base@aarch64-linux, which evaluates the base without features, failed."
choice = "The base sets no login shell for the user (NixOS default, bash). A shell's feature record owns users.users.<user>.shell beside its system setup: terminal.zsh sets programs.zsh and shell = zsh. To change the login shell, move the shell = line to another shell's record and select it. The home base keeps direnv and the base cli; nushell (with fish for completions and the darwin PATH hack) is the home-only terminal.nushell, and the shared shell tools (carapace zoxide oh-my-posh eza fzf atuin television lazygit) are terminal.amenities, which nushell requires (its cd alias is zoxide's). Shell integrations follow shell selection through Home Manager's defaults: enable<Shell>Integration defaults to home.shell.enable<Shell>Integration (true) and only acts on an enabled programs.<shell>, so no module reads selection (ADR-001, ADR-004 rule 1) and explicit flags are set only where they differ from the default (eza's nushell aliases, default off)."
alternatives = ["programs.zsh in the NixOS base (rejected: zsh on every host; the base still names a shell it does not own)", "Integration flags computed from feature selection (rejected: modules cannot read selection", " ADR-001; HM defaults already give the same result)", "nushell as the login shell directly (not taken now: the zsh login hook execs nu)"]
rationale = "One record owns a shell entirely: system setup, login shell and dotfiles. The base stays shell-agnostic and evaluates alone. Removing integration flags is less code with the same behaviour. Sleipnir and Draupnir drvPaths unchanged."
consequences = ["A host without terminal.zsh gives the user bash", "A home without terminal.amenities has none of the shared shell tools; nushell refuses to be selected without it", "DEC-042's home base list loses nushell and its shell-ux tools"]
decided_by = "user (2026-10-27)"
decided_on = "2026-10-27"

