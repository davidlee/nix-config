[facet]                         # every field typed; seeded empty (captured later)
context = "SL-006 moves the remaining legacy flags onto the feature tree (DEC-015 area files) and must name their areas and features."
choice = "games: steam (was games.enable), gamescope (requires games.steam), mangohud. ai: llama-cpp, rocm. audio: mpd, speech, dictate. services: printing, webserver, sunshine. apps: cad (taxonomy still IMP-016). desktop: sway, niri, cosmic, kde, mango, fonts. New areas append to features/default.nix in phase order."
alternatives = ["games as one feature with nixos + homeManager halves", "sunshine under games", "media area for mpd/speech/dictate", "singletons in a catch-all system area"]
rationale = "Areas group by what a feature is, not its use (sunshine streams the desktop; no games dependency). Three games features keep the legacy flags' independent toggles; requires replaces the follows defaults and the resolver checks it."
consequences = ["Legacy paths games.enable and the top-level singletons are renamed", "games.gamescope selected without games.steam fails resolution"]
decided_by = "user (2026-10-16, 'agreed')"
decided_on = "2026-10-16"

