[facet]                         # every field typed; seeded empty (captured later)
context = "The legacy apps group mixes app formats (appimage, flatpak) with an application (cad). The apps taxonomy is deferred (IMP-016)."
choice = "A new feature area non-nix-packages holds package management outside Nix. SL-005 adds two features: non-nix-packages.appimage (programs.appimage with binfmt) and non-nix-packages.flatpak (services.flatpak)."
alternatives = ["apps (reserved for IMP-016's taxonomy)", "foreign (abstruse)", "packaging, runtimes, third-party, alt-package-managers"]
rationale = "Names the concept, non-Nix package management, without ambiguity. The two features are independent switches."
consequences = ["A future darwin half (homebrew, darwin/brew.nix) fits this area", "apps.cad stays a legacy flag until IMP-016"]
decided_by = "user (2026-10-15: 'non-nix-packages isn't confusing')"
