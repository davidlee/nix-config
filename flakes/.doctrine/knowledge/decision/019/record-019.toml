id = 19
slug = "host-bound-hardware"
title = "Host-bound hardware is host config, not a feature"
record_kind = "decision"
status = "accepted"
created = "2026-10-15"
updated = "2026-10-15"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "SL-005 retires the hardware.{microcode,ssd} flags. microcode.nix hard-codes the 9950X cpuModelId; ssd.nix sets Sleipnir's root mount options. RFC-001 W4 names a 'Sleipnir hardware' class; ADR-004 D5 would allow features with host-set options."
choice = "Config bound to one machine's parts — physical or, for a VM, virtual — lives in a hand-written hosts/<h>/machine.nix, imported by hosts/<h>/config.nix right after the generated hardware-configuration.nix. It is not a feature and has no flag. Sleipnir's microcode (ucodenix import, microcode.amd_sha_check=off, cpuModelId) and SSD mount options move there; modules/nixos/{microcode,ssd}.nix are deleted. Generic boot params (boot.shell_on_fail) go to modules/nixos/boot.nix."
alternatives = ["Features hardware.microcode / hardware.ssd with host-set options (ADR-004 D5)", "Edit the generated hardware-configuration.nix", "hosts/<h>/hardware.nix (one word from the generated file; shares a name with the features/hardware area)", "hardware-local.nix / hardware-custom.nix", "parts.nix (reads as config fragments; poor fit for a VM)", "generated/ subdirectory for hardware-configuration.nix"]
rationale = "Nothing else reuses a 9950X model id or Sleipnir's root mount; a feature adds a switch and an option for one consumer. hardware-configuration.nix is regenerated by just regenerate-hardware, so hand edits would be lost. 'machine' separates the hand-written file from the generated one beside it and from generic hardware features, and fits VMs as well as physical boxes (RV-011 F-5)."
consequences = ["Precedent for RFC-001 W4's host-bound class (renamed machine config)", "RFC-001 Target shape 'every optional module becomes a feature' needs qualifying for machine config", "Generic hardware support (radeon / bluetooth / QMK) can still become hardware.* features in W4", "A VM host's machine.nix holds its virtual hardware (virtio / guest agent)", "Kernel params may reorder relative to radeon.nix; prove by sorted compare"]
decided_by = "user (2026-10-15, SL-005 research round and design; file name machine.nix chosen in RV-011 F-5)"
decided_on = "2026-10-15"

