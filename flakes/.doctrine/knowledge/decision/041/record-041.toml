title = "An agents area holds the registry alias, eca and chatgpt, selected by personal-linux"
record_kind = "decision"
status = "accepted"
created = "2026-10-16"
updated = "2026-10-16"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "RFC-001 W2; DEC-031 left eca and chatgpt as direct imports in hosts/Sleipnir/home.nix until W2; nix.registry.agents sat in the NixOS base (DEC-027)."
choice = "features/agents.nix, area listed after ai: agents.registry (nixos half: nix.registry.agents -> inputs.self.outPath), agents.eca (homeManager half, platforms linux: bubblewrap jail), agents.chatgpt (homeManager half, no platforms: its package builds on aarch64-darwin). All three mkDefault in features/profiles/personal-linux.nix. modules/home/linux/{eca,chatgpt}.nix and the registry block in modules/nixos/nix.nix are removed."
alternatives = ["select them in hosts/Sleipnir/features.nix (W7 VM would repeat them)", "chatgpt in personal (portable) rather than personal-linux"]
rationale = "Profiles carry portable intent (DEC-024) and the W7 VM wants agents; personal-linux preserves the current effective selection (Sleipnir only, ADR-001 D7)."
consequences = ["ends the DEC-031 exception; the base loses registry.agents (DEC-027 content)", "coverage base@aarch64-linux loses the registry entry: a named diff", "home drvs change only by reorder (.manpath hash), proved by masked diff", "agents.registry has only a nixos half: a home-only Linux host importing personal-linux would be refused (none exists)"]
decided_by = "user (2026-10-16)"
decided_on = "2026-10-16"

