schema = "doctrine.knowledge"
version = 1

id = 63
slug = "pi-gateway-models-hand-written"
title = "Pi gateway model entries are hand-written beside each served model"
record_kind = "decision"
status = "accepted"
created = "2026-10-17"
updated = "2026-10-17"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-060 derived pi models.json entries from LiteLLM's price map. Drafting found pi's custom-provider models take compat and thinkingLevelMap only from their models.json entry (pi 1.3.0 provider-composer.js modelFromJson); the price map carries neither. Spike 2026-10-17 (pi 0.99.1 unjailed, eca gateway key): without compat, --thinking off is ignored (47 reasoning tokens); with pi's built-in deepseek-flash compat and thinkingLevelMap, off gives 0 reasoning, minimal..max are accepted, and a two-step tool exchange with reasoning works through LiteLLM."
choice = "Each served model in agents/gateway.nix carries a hand-written pi block (name, reasoning, input, contextWindow, maxTokens, thinkingLevelMap, compat), copied from pi's built-in entry for the upstream model and verified through the gateway. The pi models.json is generated from the served-model list and these blocks in Nix (no build step, no LiteLLM price map); a served model without a pi block is an evaluation error naming it. No costs: the gateway ledger records spend."
alternatives = ["DEC-060 price-map limits plus hand-written compat (two sources for one entry)", "Generate entries from pi's catalog at build time through its ModelRegistry API (couples the build to pi's library interface)", "Point pi's built-in deepseek provider at the gateway (reopens DEC-058: stored-key precedence, unserved models listed)"]
rationale = "compat is a fact about the gateway path that no catalog holds, so the entry is hand-written anyway; keeping the whole entry in the served model's own record is one source with less code, and drops the price-map build step and its consumer-nixpkgs skew."
consequences = ["A pi change to its DeepSeek compat leaves this copy stale silently; the live checks (inq-7, inq-9) catch a break", "Adding a served model means writing its pi block and checking it through the gateway", "agents gains no LiteLLM dependency; DEC-060's skew concerns no longer apply"]
decided_by = "user (option 1, 2026-10-17)"
decided_on = "2026-10-17"

