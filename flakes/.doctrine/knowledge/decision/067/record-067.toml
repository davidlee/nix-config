[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-048: a missing credential makes systemd refuse the gateway unit, so switching in a provider before its credential exists stops every provider."
choice = "Build the new system first; create the new providers' credentials with that build's llm-gateway CLI (the installed one refuses unknown providers); then switch. DEC-048 unchanged."
alternatives = ["Launcher and unit tolerate a missing provider credential"]
rationale = "Keeps the fail-loud credential rule; the ordering is a one-time rollout step."
consequences = ["The plan's rollout phase orders build, credentials, switch", "README's first-run/adding-a-provider steps say so"]
