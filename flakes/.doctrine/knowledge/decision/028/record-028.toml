[facet]                         # every field typed; seeded empty (captured later)
context = "SL-007 classifies every modules/nixos module as base, feature, machine config (DEC-019) or host-only."
choice = "Features: audio.pipewire (audio.nix, rtkit, rtprio limits, snd-* modules, audio/jackaudio groups; workstation), hardware.bluetooth, hardware.qmk, hardware.tablet (opentabletdriver + uinput), hardware.logitech (host, DEC-011), services.postgresql (host), services.webserver gains firewall ports 80/443. desktop.core is workstation-selected; desktop.greeter, compositor.*, shell.noctalia host-selected. Machine config: radeon (with the video group), kernel blacklist, i2c, the enp8s0 profile, nix max-jobs/cores/MemoryHigh, the swapfile. Sleipnir host config: stateVersion, oom.nix, ControlD DNS and gai.conf (site/account-bound, IMP-017, IMP-002), overlays (W9), the rtcwake sudo rule."
alternatives = ["oom as a workstation feature", "DNS and gai.conf in the base", "radeon as hardware.amdgpu"]
rationale = "Host properties stay with the host (DEC-024, DEC-011); site- and Sleipnir-tuned values stay out of the base until IMP-017 parametrises them; the GPU is the machine's part."
consequences = ["Follow-ups: oom parametrisation, i2c investigation. W7 decides the VM's DNS."]
