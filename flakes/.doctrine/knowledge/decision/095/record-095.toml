[facet]                         # every field typed; seeded empty (captured later)
context = "Upstream services.tangled.knot-rs reads KNOT_MASTER_KEY only via an asserted EnvironmentFile; POL-001 keeps it off the store; user chose 1Password + systemd creds (2026-10-31)."
choice = "LoadCredentialEncrypted=master-key:/etc/credstore.encrypted/knot.master-key; ExecStart wrapper exports KNOT_MASTER_KEY from $CREDENTIALS_DIRECTORY then execs knot-server; environmentFile = /dev/null to satisfy the assertion. Writer: just knot-credentials (op read | systemd-creds encrypt --with-key=host+tpm2)."
alternatives = ["root oneshot decrypting to /run/knot/knot.env before knot-rs", "hand-placed /etc/knot/knot.env"]
rationale = "Plaintext never lands on disk; same credstore as the LLM gateway."
consequences = ["Couples to upstream ExecStart shape (--config /etc/knot/config.toml); a module bump may need the wrapper updated."]
decided_by = "user (agreed 2026-10-31)"
decided_on = "2026-10-31"

