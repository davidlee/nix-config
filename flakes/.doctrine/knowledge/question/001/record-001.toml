[facet]                         # every field typed; seeded empty (captured later)
question = "How does a feature declare which platforms it supports (e.g. a linux-only Home Manager feature selected on darwin)?"
why_matters = "ADR-005 requires selected features that project nothing to fail, and coverage targets per supported platform; component presence alone (has homeManager) does not say whether it works on darwin."
answer = "DEC-030: a record may carry platforms (system strings, meta.platforms style; absent = all); the resolver gets the host system and refuses an unsupported selection. Profiles stay dumb and are split per platform (personal, personal-linux, personal-darwin). Covers OS and architecture."
