datum = "2026-10-17, pi 0.99.1 unjailed, throwaway PI_CODING_AGENT_DIR, PI_OFFLINE=1, via the local LiteLLM gateway (litellm 1.102.1, deepseek/deepseek-flash) on a custom provider llm-gateway (api openai-completions). Without compat: --thinking off is ignored (47 reasoning tokens); levels minimal..max accepted with no visible effect; a two-step bash tool exchange works. With pi's built-in deepseek-flash compat (thinkingFormat deepseek, requiresReasoningContentOnAssistantMessages, supportsDeveloperRole false, maxTokensField max_tokens, supportsStore false, supportsStrictMode) and thinkingLevelMap: off gives 0 reasoning tokens, minimal..max accepted, the tool exchange works. Custom-provider models take compat only from their own models.json entry (pi 1.3.0 provider-composer.js modelFromJson). One model, one run per case; re-check on pi 1.3.0."
