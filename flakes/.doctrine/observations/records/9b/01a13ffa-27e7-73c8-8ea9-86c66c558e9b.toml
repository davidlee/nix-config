detail = "SL-006 PHASE-01: planner spawned by capsule-orchestrator (running as a teammate) reported 'the agent that spawned you is no longer running' and its final report arrived at the capsule-driver seat as an agent-message. Driver forwarded it to the orchestrator by SendMessage. Likely cause: orchestrator spawned as a named teammate, so child completion routes to the team lead. Also: capsule-phase-planner contract (flip nothing) and phase-plan skill (flip in_progress) disagree on who flips phase status."

