summary = "capsule-driver: spawning the orchestrator with Agent `name` makes it a teammate whose children cannot hand back to it"
detail = "Probe 2026-10-16 (haiku, minimal). Unnamed parent (plain foreground subagent) → child: parent received MARKER-CHILD-OF-UNNAMED via SubagentHandback. Named parent (Agent name=probe-named → in_process_teammate) → child: parent got 'The subagent ended without delivering a report through SubagentHandback'; resuming the child via SendMessage gave the same. In the SL-006 run the named orchestrator's planner/worker reports instead surfaced at the driver seat ('agent that spawned you is no longer running'). Second orchestrator, spawned unnamed, worked normally. Fix for the skill: capsule-driver must spawn capsule-orchestrator WITHOUT `name` (no teammate mode). Supersedes the hypothesis in observation 01a13ffa."

