detail = "SL-007 PHASE-02: building the toplevel /etc for VA-3 identity checks shows nix/registry.json changed on every source edit, because the agents registry entry records the flake's own source path. just drvs pins it via nixos_pick (/drvs-gate) but there is no recipe that builds /etc with the same pin. A just recipe for a pinned /etc build would remove the false positive."

