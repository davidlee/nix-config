description = "The gateway stores only each client key's sha256. Its messages, logs and list output name the alias, never the key or its hash; keys reach the CLI on stdin, never argv. Keys start sk- so LiteLLM hashes any it logs. The client holds its own key in its key file and environment."
tags = ["gateway"]
acceptance_criteria = [
  "list shows no key or hash",
  "An auth failure log line carries no raw key",
]
