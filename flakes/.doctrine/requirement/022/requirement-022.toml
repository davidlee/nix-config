description = "A host's system (NixOS or nix-darwin) and its home are separate configurations: separate flake outputs, separate nixpkgs pins (nixpkgs and nixpkgs-home) and separate activation. Neither reads the other's config; a feature's two halves may be activated at different times (ADR-003)."
