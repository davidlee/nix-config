title = "A declared jail holds only what it declares"
status = "active"
kind = "quality"


description = "A jail declared in passthru.devEnv.jails has no network but the gateway and its forwards, no launch directory and a home discarded on exit. Beyond the gateway, the project's tools and env and the host env list, it holds only its declared mounts and forwards: no host integrations, Doctrine, quotient, subagents or git identity. Its agent has only the tools of its MCP servers."

