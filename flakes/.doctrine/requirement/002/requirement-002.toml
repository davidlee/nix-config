title = "Chat-completion bodies carry only allow-listed top-level fields"
status = "pending"
kind = "functional"

# description — the requirement statement (structured, queryable; `show` renders
# it as the statement line — the storage rule forbids deriving it from prose).
# Rationale and extended discussion stay in the sister `.md`. Add as:
#   description = "…"
description = "A chat-completion body must be a JSON object whose top-level fields are all on ALLOWED_FIELDS: a listed subset of the OpenAI chat-completions fields, reasoning_effort, and the provider-native thinking, reasoning and provider. Any other field, fallback forms included, gets a 400 naming it; a body over 16 MiB gets a 413. Both are marked x-llm-gateway: body refused."
tags = ["gateway"]
acceptance_criteria = [
  "extra_body, litellm_params, custom_llm_provider, models, route, usage, metadata and fallbacks are each refused with a 400 naming the field",
  "A non-object body is refused",
  "A 16 MiB + 1 byte body is refused with 413 before it is buffered whole",
]
