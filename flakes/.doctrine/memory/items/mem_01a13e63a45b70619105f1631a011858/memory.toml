title = "Plain-priority sudo extraRules always render after nixpkgs' blanket root/wheel rules"
summary = "nixpkgs adds root ALL at mkOrder 400 and %wheel ALL at mkOrder 600, so a plain (1000) extraRules entry renders after them regardless of import depth."
created = "2026-10-15"
updated = "2026-10-15"

