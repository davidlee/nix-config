memory_key = "mem.fact.nix.callpackage-autoargs"
schema_version = 1
memory_type = "fact"
status = "active"
title = "Attrs added to pkgs leak into callPackage's defaulted arguments"
summary = "callPackage fills every argument, defaulted or not, from the package set by name; a pkgs.stable overlay breaks kicad/guile-cairo (stable ? true). Pass non-package values as module args (_module.args), not pkgs attrs."
created = "2026-10-15"
updated = "2026-10-15"

