status = "active"
title = "An overridden flake input is relocked under the parent, not from its own flake.lock"
summary = "Under Lix 2.95.4, --override-input X relocks X's inputs from the parent's lock or fresh; X's own flake.lock is ignored. Evaluate X with flake-compat (flake = false) to honour its pins."
