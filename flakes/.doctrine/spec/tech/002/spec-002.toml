schema = "doctrine.spec.tech"
version = 1

id = 2
slug = "host-composition"
title = "Host composition"
status = "active"
kind = "tech"
tags = ["composition", "features", "hosts"]
responsibilities = [
  "Read the host table from hosts/*/meta.nix and validate it",
  "Resolve each host's feature selection once, outside every module evaluation",
  "Refuse a malformed tree or an invalid selection before anything is built",
  "Project selected features into each evaluation in tree order",
  "Build each host's system and home as separate configurations on separate pins",
  "Hold the NixOS base, the darwin base, the home base and its platform layers",
  "Keep off features evaluated through coverage targets",
]
category = "composition"
c4_level = "container"

