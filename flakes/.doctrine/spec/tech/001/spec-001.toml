schema = "doctrine.spec.tech"
version = 1

id = 1
slug = "llm-gateway"
title = "LLM gateway"
status = "active"
kind = "tech"
tags = ["gateway", "agents", "security"]
responsibilities = [
  "Serve an OpenAI-compatible chat-completions endpoint to local clients",
  "Hold the provider keys so no client needs one",
  "Authenticate each client by its own key and enforce its model list and budget",
  "Record each request's cost against the client that made it",
  "Refuse every route and body field outside its contract",
  "Administer keys and provider credentials locally",
]
category = "service"
c4_level = "container"

