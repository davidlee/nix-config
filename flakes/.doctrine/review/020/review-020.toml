"""

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "dev-checkouts-test should cover every ahead branch; the no-upstream warning and a worktree .git file are untested"
detail = """
Expected: each behaviour branch of the script has a test.
Observed: bin/dev-checkouts:45 (no upstream → "has no upstream" warning, exit 0) has no case in bin/dev-checkouts-test. Neither does a checkout whose `.git` is a file (a git worktree), the reason `present` uses `-e`, not `-d` (handover lens). Both are cheap: `git init` without a remote for the first, `git worktree add` for the second.
"""
disposition = "fix-now"
response = "Adding both cases to bin/dev-checkouts-test."

[[finding.turn]]
act = "raise"
role = "raiser"

