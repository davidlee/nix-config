note = """
Conformance audit of SL-010 at fe348e8f plus the F-6 edit. Checked against design.md (locked r32), plan.toml EX/VT, DEC-042/043/044 and ADR-001 D4:
- the move tables against the end-state files
- the per-phase drv evidence in notes.md and evidence/
- the source-delta registry (corrected) and selectors, mapped by hand (ISS-005)
- doctrine check gate, just test, just coverage
