[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected root's bash usable from every terminal after PHASE-04; observed broken under TERM=xterm-ghostty"
detail = """
Expected (design § Home side, DEC-042): root → NixOS default bash, rescue-safe.
Observed (user, after switch): `sudo -i` from ghostty gave a broken bash until `TERM=kitty`.
Cause: ghostty's terminfo lived only in the home profile (terminal.emulators is home-only); readline fails on an unknown TERM, root's old zsh coped. The design did not consider terminfo.
Remedy landed: fe348e8f sets environment.enableAllTerminfo = true in modules/nixos/env.nix (user-approved; notes.md § FIX-1). Sleipnir +13 terminfo outputs only; coverage/test/gate green. VH-1 re-checked by the user with default TERM: pass.
fe348e8f lies outside every phase's boundary row (it follows PHASE-05).
"""
disposition = "design-wrong"
response = """
Code is fixed (fe348e8f) and the user re-checked VH-1. What's wrong is the design: it treats root → bash as a shell choice only, and readline needs the system terminfo. Reconciliation Brief (per-slice): add environment.enableAllTerminfo to design.md's base-after list and to the P4 row. Reconcile also records fe348e8f's delta, which follows PHASE-05: record-delta PHASE-04 cannot span it without swallowing PHASE-05, so reconcile notes it in design.md § Phases instead.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
