status = "verified"
severity = "minor"
title = "Provenance reports where name is written, not where the feature lives"
detail = """
origin uses unsafeGetAttrPos "name". A record built by a helper (the test fixture's feat, or a future mkFeature for RFC-001 W3) reports the helper's line for every feature. Raised by an external reviewer.
"""
disposition = "aligned"
response = """
Implementation matches design sec-3. The limitation is a rule to state: records are written literally. Routed to the Reconciliation Brief (ADR-002 D6).
"""

