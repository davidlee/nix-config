[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "PHASE-02 VA-1 grep is defective"
detail = '''
VA-1 greps 'session/snooze\|<area>/default.nix'. The first alternative matches the new, correct path features/session/snooze-nag (justfile:42, features/session.nix:28); the second matches only placeholder text, never a real stale path. Raised by an external reviewer.
'''
disposition = "tolerated"
response = '''
Plan criteria are immutable. Intent verified with the corrected grep 'session/snooze/\|features/[a-z]*/default\.nix\|hardware/openrgb' over the tree: hits only historical .doctrine records (SL-001/002 designs and plans, DEC-003, DEC-010, CHR-012). Lesson: test a VA grep against the expected end state when authoring it.
'''

