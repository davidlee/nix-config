[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Bare path in an area list reported as 'has no name'"
detail = """
Listing ./virt/capsule.nix instead of (import ./virt/capsule.nix), the likeliest spill mistake, failed with 'feature #1 in area virt has no name'. Raised by an external reviewer.
"""
disposition = "fix-now"
response = """
Fixed in fbb27f68: a non-attrset feature reports 'is not a record; list a feature's own file as (import ./<area>/<name>.nix)'. Check renamed badRecords. testNonRecordFeatureFails guards rejection; the message itself cannot be asserted in pure Nix (tryEval drops it), checked by hand. drvs identical.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
