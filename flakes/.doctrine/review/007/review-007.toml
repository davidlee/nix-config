[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "'Never a store path' rationale overstated in design sec-3"
detail = """
sec-3 says a store path would churn derivations that embed definition locations. Path-imported halves already label definitions with store paths, and just drvs stayed identical across commits (SL-002, SL-003), so _file does not reach these derivations. Line numbers churn on edits anyway. The real reason is readable errors. Raised by an external reviewer.
"""
disposition = "aligned"
response = """
Implementation unaffected. Rationale corrected at reconcile: design.md sec-3 (direct edit) and ADR-002 D6 wording (REV). Routed to the Reconciliation Brief.
"""

