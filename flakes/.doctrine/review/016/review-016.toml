id    = 16
slug  = "reconciliation-review-of-sl-007"
title = "reconciliation review of SL-007"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-007 PHASE-01–06 (0a7458d5..9fe49432) against design.md (§ Shape, base, machine/host, desktop/compositor/shell, audio/hardware/services, aarch64, behaviour changes, phases and verification, code impact), plan.toml criteria, ADR-001/002/005, POL-001 and REV-006. Evidence: the three orchestrator hand-backs, notes.md gate snapshots, plus auditor re-runs of just gate, just drvs, slice verify-vt, slice conformance (prefix-normalised), the close grep and the VA-4 removal grep.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-007"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "rtcwake sudo rule: comment should name its caller; observed caller dropped and rule reported dead"
detail = """
Expected (design § Machine and host config, config.nix sketch): "rtcwake sudo rule for snooze — moved verbatim".
Observed: hosts/Sleipnir/config.nix:44 now reads "wheel may run rtcwake (scheduled wake from suspend) without a password." PHASE-02's hand-back claimed nothing in the repo calls rtcwake and that the rule may be dead.
Evidence: ~/.local/bin/snooze:16 (tracked in the home repo) runs `sudo rtcwake -m mem -s $SEC` — the hand-run "suspend until 07:00" command. The rule is live; the comment lost the only pointer to its consumer, inviting a future wrongful removal.
"""
disposition = "fix-now"
response = """
Comment at hosts/Sleipnir/config.nix:44 now names the caller (~/.local/bin/snooze, `sudo rtcwake -m mem -s …`). Comment-only: `just drvs` identical to the phase-06 snapshot. The PHASE-02 "may be dead" claim is refuted; no backlog item.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Comment at hosts/Sleipnir/config.nix:44 now names the caller (~/.local/bin/snooze, `sudo rtcwake -m mem -s …`). Comment-only: `just drvs` identical to the phase-06 snapshot. The PHASE-02 "may be dead" claim is refuted; no backlog item.
"""

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design §7 expects firewall ruleset to lose postgresql's duplicate ports and dev to vanish visibly; observed neither leaves a build-level trace"
detail = """
Expected (design § Behaviour changes, rows "postgresql's stray 80/443" and "undefined dev group"): "firewall ruleset loses the duplicates"; "extraGroups loses dev".
Observed (PHASE-06 hand-back, notes.md): nftables.service is byte-identical before and after — NixOS already deduplicates allowedTCPPorts when rendering. The dev group never existed, so the probe (which lists only existing groups) and every drv are unchanged. Evidence is option-level only: extraGroups lacks "dev"; allowedTCPPorts = [22,80,443,27015,27036,27037,27040]; with webserver forced off 80/443 are absent (VA-2).
The code change is right; the design's stated *effect* for these two rows is wrong. Plan VA-1's wording ("firewall duplicates gone") is immutable and is met at option level.
"""
disposition = "design-wrong"
response = """
Code is correct; design § Behaviour changes misstates the observable effect of two rows. Reconcile edits design.md §7 (Reconciliation Brief, per-slice): postgresql row → "allowedTCPPorts loses the duplicates at option level; rendered ruleset unchanged (NixOS dedups)"; dev row → "option-level only; the group never existed". Plan VA-1 stays as authored (immutable); met at option level, evidence in notes.md.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
Code is correct; design § Behaviour changes misstates the observable effect of two rows. Reconcile edits design.md §7 (Reconciliation Brief, per-slice): postgresql row → "allowedTCPPorts loses the duplicates at option level; rendered ruleset unchanged (NixOS dedups)"; dev row → "option-level only; the group never existed". Plan VA-1 stays as authored (immutable); met at option level, evidence in notes.md.
"""

[[finding.turn]]
act = "verify"
role = "raiser"

