[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "slice conformance should map edits to design-target selectors; observed 62 undeclared, 7 undelivered, 0 conformant"
detail = """
Expected: conformance reports the slice's edits against its design-target selectors (modules/nixos/**, hosts/Sleipnir/**, features/**, hosts.nix, features-test.nix, README.md, modules/shared/cli/_packages/system.nix).
Observed: every path carries the git-root prefix `flakes/` (worktree is $HOME), so nothing matches; likewise verify-vt reports every VT UNATTRIBUTABLE though every keyword is present. This is ISS-005, already open. The mechanical conformance signal is therefore unavailable for SL-007; the auditor normalised the prefix by hand (see F-5).
"""
disposition = "follow-up"
response = """
Tooling defect owned by existing ISS-005 (source-delta paths git-root-relative vs ~/flakes-relative selectors). Not slice governance. Conformance and verify-vt were read by hand with the prefix normalised for this audit (F-5); no new backlog item needed.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "follow-up"
response = """
Tooling defect owned by existing ISS-005 (source-delta paths git-root-relative vs ~/flakes-relative selectors). Not slice governance. Conformance and verify-vt were read by hand with the prefix normalised for this audit (F-5); no new backlog item needed.
"""

[[finding.turn]]
act = "verify"
