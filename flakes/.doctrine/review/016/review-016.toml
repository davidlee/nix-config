[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Design § Code impact governance-at-close writes should land with the slice; observed RFC-001, DEC-016, DEC-024, IMP-004 still stale"
detail = """
Expected (design § Code impact, "Governance at close"): RFC-001 W4 row done, W5 told to follow the base pattern (DEC-027); IMP-004 closed; DEC-016's stale `features` specialArg corrected; DEC-024's consequences refreshed.
Observed: RFC-001 W4 row still "(next)"; IMP-004 open; DEC-016 choice still lists specialArgs = {inputs username hostname features}; DEC-024 consequences still say a host importing workstation "gets fonts and dictate only" — it now also gets desktop.core and audio.pipewire, NixOS-only records, so the profile is Linux-only (design § Shape).
"""
disposition = "design-wrong"
response = """
Governance trails delivered truth. Reconcile via REV: RFC-001 W4 row done + W5 note (follow the base pattern, DEC-027); DEC-016 choice drops `features` from specialArgs; DEC-024 consequences refreshed (workstation also brings desktop.core and audio.pipewire, NixOS-only, so the profile is Linux-only). IMP-004 closed at /close. See Reconciliation Brief.
"""

