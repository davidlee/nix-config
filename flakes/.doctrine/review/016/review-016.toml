[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "Edits should fall within design-target selectors; observed SATAN.md and sleipnir-doctor.nix touched undeclared"
detail = """
Expected: every edited path under a design-target selector (design § Code impact).
Observed, after stripping the flakes/ prefix: SATAN.md:78 (postgres pointer → features/services.nix, PHASE-04) and modules/home/linux/sleipnir-doctor.nix:1-2 (comment → features/compositor/sway.nix, PHASE-03). Both are pointer updates forced by moved files, required for the design's close grep to stay clean. The remaining undeclared paths are .doctrine/ artefacts the lifecycle itself writes (ADR-002, REV-006, notes, memory) — expected.
Not scope creep; the selector registry and design § Code impact simply omit them.
"""
disposition = "design-wrong"
response = """
Not scope creep: pointer updates forced by moved files, needed for the close grep. Reconcile adds the two paths to the selector registry (`doctrine slice selector add SL-007 SATAN.md modules/home/linux/sleipnir-doctor.nix` as design-target) and mirrors them in design.md § Code impact. See Reconciliation Brief.
"""

