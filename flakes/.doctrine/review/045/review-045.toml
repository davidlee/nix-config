[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Design § Quotient forms: the link target names a file the form output does not contain"
detail = """
Expected (design): bin/dev-envs-forms links `.quotient/forms/<c>` to
`$(readlink -f ".quotient/result-'$c'")/bin/jailed-quotient-'$c'`.

Observed: that file does not exist in the form package's output. A family member is
two derivations: `family.<c>` is `writeShellScriptBin "quotient-<c>"`, which takes
the session directory and execs `<launcher>/bin/jailed-quotient-<c>` from another
store path. Quotient's `probeProjectForm` (src/server/forms.ts) resolves the link
and requires an executable regular file, so the design's target is dangling and is
refused as `form-invalid`. `bin/dev-envs-forms` links `bin/quotient-<c>`, which
is what quotient's own docs/nix-forms.md:95-131 builds and links.

Evidence: notes § PHASE-02; the script's own comment; an end-to-end run of the real
linker against the stub project (both links resolve, executable, lock unwritten);
the operator has since run it for real in a Smut checkout (VH-1b).

Disposition intended: design-wrong — the design's target sentence is wrong, only
the target; the "linked file name is the bare capability word" claim still holds."""
disposition = "design-wrong"
response = """
Confirmed against the artefact, not against preference: the design's target does not
exist in a form's output, and quotient refuses a dangling link. § Quotient forms must
name `bin/quotient-<c>` — the wrapper a delegate runs — and keep the note that a
rebuild which changes the output is a new form, so the linker is re-run and
`quotient allow` records the new identity.

Obligation: per-slice direct edit to design.md, carried in the reconciliation brief."""

