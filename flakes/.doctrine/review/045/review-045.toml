[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "README's by-hand join command was unrunnable: path:~/…-dev-envs#jail"
detail = '''
Expected: the § Jailed Agents block a reader copies actually runs.

Observed as shipped in c8aa633b: `nix develop path:~/flakes/dev-envs#jail` carried two
independent traps — no shell expands `~` mid-word (nix: `getting status of
'/tmp/~/flakes/dev-envs'`), and in an interactive zsh with `extendedglob` an
unquoted `#` is the repetition operator, so the word dies `no matches found`.
The operator hit both in anger and worked around them with an absolute path and
`\#`; the helper (`envrc/dev-envs.sh`) was never affected because it already
writes `"path:$HOME/flakes/dev-envs#jail"`.

Corrected to that quoted form in the README and verified by running it under the
failing shell (`zsh -i -c`), exit 0, `…-smut-dev-tools/bin/rustc`. Committed at
`e20765ce`. Memory mem.fact.nix.flakeref-no-tilde carries the rule and the testing
rule (verify quoting claims with `zsh -i`, never `sh -c`).

Disposition intended: aligned — the artefact now behaves correctly and no further
work is owed.'''
disposition = "aligned"
response = """
Confirmed, corrected and committed (`e20765ce`). The artefact now carries the quoted
form the helper always used, verified under the shell that failed, and
mem.fact.nix.flakeref-no-tilde records both the rule and the testing rule. Nothing
further is owed."""

