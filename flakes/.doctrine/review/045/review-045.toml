[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "No recorded source deltas: slice conformance is unavailable for SL-022"
detail = """
Expected: `doctrine slice conformance 22` reports the mechanical
selectors-vs-git delta for every completed phase.

Observed: `unavailable — no recorded source deltas`, and
`doctrine slice record-delta 22 PHASE-0N --start … --end …` fails with
`Read-only file system (os error 30)`: the registry resolves into the home repo's
git common dir (/home/david/.cfg), which the auditing session cannot write. The
per-phase bindings were never captured either, because all three phases were
implemented uncommitted and landed in one commit (`c8aa633b`, parent
`ca2257cc`) — so per-phase boundaries do not exist in history to record.

Substituted check, run by hand against the nine design-target selectors and that
commit: **9/9 conformant, 0 undeclared, 0 undelivered**. The other 26 paths in the
commit are `.doctrine/**` — the slice's own scope/design/plan/notes, its memory
records and the two backlog items; they are expected for a slice and are not
design-target material.

Remedy (one command each, from a writable tree):

    doctrine slice record-delta 22 PHASE-01 --start ca2257cc --end c8aa633b
    doctrine slice record-delta 22 PHASE-02 --start ca2257cc --end c8aa633b
    doctrine slice record-delta 22 PHASE-03 --start ca2257cc --end c8aa633b

coarse by construction (one commit, three phases) — disclosed rather than papered
over. Disposition intended: fix-now, before closure, so `conformance` is not left
reading clean-by-absence."""
disposition = "fix-now"
response = """
Confirmed. The absence is environmental (the registry lives in a read-only git common
