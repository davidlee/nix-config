[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Design § The flake, in full: the stub check greps the launcher the jail does not carry"
detail = """
Expected (design): checks.stub greps `${lib.getBin jail}/bin/jailed-pi` for the
project bundle, and takes `probe` as an alternative needle because the bundle might
be rendered flattened into its members.

Observed (code, dev-envs/flake.nix): `packages.jail` is not the launcher. With
`gateway` set, `mkJailedPi` returns `gatewayJail.wrap inner`
(agents/gateway-jail.nix) — a wrapper that checks the key file and run directory
and `exec`s the real launcher. The bundle is rendered in the *inner* launcher's
`--setenv PATH`, so a grep of the wrapper matches nothing and the check fails for
the wrong reason. The check therefore follows exactly one `exec`, resolving the
target through `builtins.readFile` (a store *reference* of the wrapper is not a
build input; reading it carries the reference in the string's context), and
`needles = [devTools]` alone — the bundle is rendered as its own `/bin`, never
flattened members, so the stub's `probe` survives as a fixture, not as a needle.

Evidence: notes § PHASE-01 (settled empirically on a built stub jail);
dev-envs/flake.nix's comment above `checks.stub`; memory
mem.fact.flakes.jail-launcher-indirection. The operator decided the departure
because it departs from a locked design.

Disposition intended: design-wrong — the design text is stale, the code is right."""
disposition = "design-wrong"
response = """
Confirmed, and the code is the right side of it. § The flake, in full must be
rewritten to the mechanism the phase actually shipped: `packages.jail` is the
gateway wrapper, the bundle is rendered in the inner launcher, so the check follows
exactly one `exec` and resolves it with `builtins.readFile` (a store reference is
not a build input), with `needles = [devTools]` alone. The stub's `probe` stays in
the stub as the contract's fixture and must be described as such, not as a needle.
§ The stub project's rationale survives; its mechanism does not.

Obligation: per-slice direct edit to design.md, carried in the reconciliation brief."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
