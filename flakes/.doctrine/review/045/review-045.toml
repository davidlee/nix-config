title = "Design § Verification: the override commands cannot run as written"
detail = """
Expected (design § Verification): `nix develop … --override-input project
git+file:~/dev/smut`, and the same ref in the pin-fidelity comparison.

Observed: a flakeref does not expand `~`. No shell expands a tilde mid-word
(`zsh -c 'echo path:~/x'` prints `path:~/x`), so nix resolves it literally:

    error: getting status of '/tmp/~/flakes/dev-envs': No such file or directory

The commands were run with `git+file:/home/david/dev/smut`. The same defect bit the
README's by-hand join example (raised separately), so it is not a one-off typo in
one place.

Disposition intended: design-wrong — design prose should name an absolute path or
`$(git rev-parse --show-toplevel)`."""
disposition = "design-wrong"
response = """
Confirmed by running it. Design commands must be runnable: replace every
`git+file:~/…` with `git+file:/home/david/dev/smut` (or
`$(git rev-parse --show-toplevel)`), and say once that a flakeref does not expand
`~`. The same trap reached the README and is fixed there; the design should not
retain the broken form.

Obligation: per-slice direct edit to design.md § Verification, carried in the
reconciliation brief."""

