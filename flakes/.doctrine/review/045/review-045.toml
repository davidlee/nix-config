[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "just drvs cannot complete: homeConfigurations fails on aarch64-darwin elfutils"
detail = """
Expected (plan EX-6): `just drvs` after equals the before-snapshot, proving no host
drift.

Observed: `just drvs` aborts after one group. `_drvs homeConfigurations` cannot
evaluate `homeConfigurations."david@Draupnir".activationPackage` because
`elfutils-0.195` is "not available on the requested hostPlatform:
aarch64-darwin" in the pinned nixpkgs; `set -euo pipefail` then hides
`darwinConfigurations`, `packages`, `legacyPackages` and `templates`.

Substituted evidence: each group run through the same `_drvs` sub-recipe with the
same `local_override` string, before and after the phase — `diff` identical, and
the single result line `nixosConfigurations.Sleipnir` unchanged across both full
`just drvs` attempts (line numbers shifted only by the seven lines this phase adds
above the recipe). Smut's HEAD and `status --porcelain` unchanged.

Pre-existing and owned: ISS-023; memory mem.fact.flakes.drv-gate-aborts-at-home.
Disposition intended: follow-up (a code/infrastructure finding with a durable
backlog owner, not a spec item)."""
