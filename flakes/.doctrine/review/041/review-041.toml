Rechecked with the pinned Python 3.14.8 decoder: the original 11-byte frame 28b52ffd00881100007b7d raises ZstdError with DecompressionParameter.window_log_max:24, rather than returning '{}'. Ordinary compressed JSON still decodes; truncated and concatenated frames remain refused by the eof/unused_data checks. Checked the new SDK evidence directly: /home/david/.local/src/typesafe-sdk-js/src/compression.ts:53-58 calls Node zstdCompress without custom options. Synthetic default Node v26.12.1 zstdCompressSync output at input sizes 1024, 1048576 and 16777216 bytes all decoded completely under the 24-bit window cap. This is bounded compatibility evidence for the default encoder path, not proof for every possible encoder/frame. Production enforcement remains an inference until the implementation and planned tests run.
"""

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Decoded replay retains Transfer-Encoding while synthesizing Content-Length"
detail = """
Evidence: .doctrine/slice/019/design.md:109 specifies only 'drop content-encoding, content-length = len(decoded)' and :114-115 claims that the rewritten headers describe the replayed body. There is no removal of Transfer-Encoding or policy for repeated encoding/length headers. The gateway really uses Uvicorn (features/agents/gateway/llm-gateway-serve:56-58). In the pinned Uvicorn 0.51.0, protocols/http/h11_impl.py:199-217 copies the incoming request headers, including transfer-encoding, into the ASGI scope; httptools_impl.py:242-246 similarly preserves them.

Verified synthetic HTTP parsing reproduction using the pinned h11 environment, without sockets: a valid chunked HTTP/1.1 POST carrying Content-Encoding: zstd and a compressed '{}' produced request headers containing transfer-encoding: chunked and body events containing only the compressed bytes (HTTP chunks already removed). Applying the design's stated rewrite yielded transfer-encoding: chunked plus content-length: 2, while replaying plain b'{}'. Thus a normal chunked client request reaches LiteLLM with both framing headers and an already dechunked/decompressed body. The current recording-app test plan (:149-151) does not assert removal of Transfer-Encoding.

Concrete failure: the new rewrite manufactures inconsistent transport metadata on otherwise valid chunked requests; downstream body consumers see a fixed plain body marked both chunked and length-delimited. No request-smuggling exploit is claimed: this rewrite occurs after Uvicorn has already parsed the wire request, so that stronger claim is unproven. This is a concrete framing-contract defect, hence minor.

Repair: define one header canonicalization rule: remove every Content-Encoding, Content-Length and Transfer-Encoding occurrence and append exactly one decoded Content-Length; define handling of duplicate/list Content-Encoding values before choosing a decoder, rejecting unsupported/ambiguous chains instead of silently selecting one occurrence. Add an incoming chunked zstd request test that asserts the complete inner header multimap and body, plus duplicate-encoding/length cases.
"""
disposition = "fix-now"
route = "review"
response = "Accepted; repaired by F-1's canonical replay headers, which remove every transfer-encoding occurrence. Content-encoding is read as the list of all its occurrences and values; only none, [identity] or [zstd] is accepted, every other list (chains, repeats, other codings) is 415. VT (sec-6): a chunked zstd request reaches the app with exactly the canonical header set; repeated and chained encodings are 415."

