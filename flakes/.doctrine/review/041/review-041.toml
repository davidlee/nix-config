[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The zstd output cap leaves decoder window memory outside the bound"
detail = """
Evidence: .doctrine/slice/019/design.md:101-106 constructs ZstdDecompressor() with no options and relies on max_length=MAX+1 as its bomb bound; :149-151 tests only oversized decoded output, truncation and multiple frames. The guard executes before authentication (gateway_hooks.py:98-101, :121-130; MAX_BODY_BYTES comment at :81). Python documents max_length as a returned-output limit and provides a separate DecompressionParameter.window_log_max to limit decoder memory: https://docs.python.org/3.14/library/compression.zstd.html#compression.zstd.DecompressionParameter.window_log_max .

Verified reproduction with the gateway's Python 3.14.8 compression.zstd: bytes.fromhex('28b52ffd00881100007b7d') is an 11-byte, single complete frame advertising a 128 MiB window and decoding to b'{}'. ZstdDecompressor().decompress(frame, max_length=16777217) returned b'{}', eof=True, unused_data=b''. Process VmSize rose from 16948 kB to 148492 kB while the decoder remained alive. VmRSS rose only from 10624 kB to 10756 kB: this proves a large decoder allocation/address-space reservation, not 128 MiB of resident memory consumption. All of the design's encoded-size, decoded-size and frame checks accept this input.

Concrete failure: any local caller, without a key, can make the pre-auth guard allocate a window far larger than its body limit using a tiny request. Repetition or overlapping live decoder instances create memory/address-space pressure that the claimed bomb bound does not control. Service exhaustion is an inference; no exhaustion attack was run.

Repair: choose and state an explicit decoder window cap, e.g. ZstdDecompressor(options={DecompressionParameter.window_log_max: 24}) for a 16 MiB window, alongside the existing encoded/output caps. The same frame was refused under that option with ZstdError: 'Frame requires too much memory for decoding'. Define the guarded refusal status and add an oversized-window fixture whose actual decoded JSON is tiny, so output-size tests cannot substitute for this check.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. max_length bounds output only; the decoder window is sized from the frame header. Repair (sec-4): ZstdDecompressor(options={DecompressionParameter.window_log_max: 24}), a 16 MiB window, equal to MAX_BODY_BYTES; a frame needing more raises ZstdError, refused 400 like any undecodable body. Compatibility checked: the TypeSafe SDK compresses with Node's one-shot zlib.zstdCompress at default parameters (~/.local/src/typesafe-sdk-js/src/compression.ts), whose window is bounded by the source size, so no legitimate body under MAX_BODY_BYTES needs a larger window. VT (sec-6): an oversized-window frame whose content is {} is 400."

