Verified with synthetic h11 wire bytes and the proposed canonicalization recipe: a chunked zstd POST decoding to '{}' retained Host and reached the inner representation with exactly Content-Type: application/json and Content-Length: 2, with no Transfer-Encoding/Content-Encoding. Separate duplicate length/type inputs were collapsed to one correct value each, and an unrelated control header was preserved. The recipe rejected gzip, zstd/identity chains, repeated zstd header occurrences, blank encodings and trailing empty list elements. No production rewrite or wire-level smuggling exploit was tested; implementation correctness remains an inference pending the specified tests.
"""

