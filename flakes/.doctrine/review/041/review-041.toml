[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Content-Type lets the downstream parser reintroduce forbidden top-level fields"
detail = """
Evidence: .doctrine/slice/019/design.md:65-77 retains today's CHAT_FIELDS and _body_refusal mechanism, while :98-109 replays decoded bytes on every POST and changes only Content-Encoding/Content-Length. No Content-Type rule ensures that LiteLLM interprets those bytes as the JSON object the guard checked. features/agents/gateway/gateway_hooks.py:147-155 uses json.loads(body); the pinned LiteLLM 1.106.2 proxy/common_utils/http_parsing_utils.py:231-262 selects request.form() for form content types, and proxy/proxy_server.py:12333 consumes that parser's result for chat completions. This violates DEC-073 and SPEC-001's fail-closed field boundary.

Verified reproduction against the current route_gate and the pinned LiteLLM parser, in-process with network connections disabled: POST /v1/chat/completions, Content-Type: application/x-www-form-urlencoded, body:
{"messages":"&model=deepseek-flash&api_base=http%3A%2F%2F127.0.0.1%3A9&custom_llm_provider=typesafe&ignored="}
The guard returned no refusal and called the inner app. LiteLLM's read_request_body returned a dictionary containing model='deepseek-flash', api_base='http://127.0.0.1:9' and custom_llm_provider='typesafe', plus form artefacts. Under application/json the same bytes remained only a messages field. These are fields the allow-list explicitly claims cannot reach LiteLLM. The defect is present in the retained path; the proposed per-route refactor and zstd replay preserve it.

Concrete failure: a client embeds form delimiters in an allowed JSON value, chooses the form media type, and supplies internal routing/provider fields after the guard has approved a different object. ModelGate only checks model/fallback names (gateway_hooks.py:225-240), so it cannot repair the field boundary. Provider redirection/credential misuse is an inference from the injected controls, not a provider-call reproduction; no real provider or secret was used.

Repair: specify and enforce one downstream interpretation for every accepted POST. Reject conflicting/unsupported Content-Type values (including duplicates), or normalize accepted JSON to one application/json header before replay so downstream form parsing cannot occur. Add a real-parser regression with this polyglot body, plain and zstd-encoded, on both chat aliases, and verify injected fields never enter request processing. The recording Reader alone cannot detect this defect.
"""
disposition = "fix-now"
route = "review"
response = "Accepted. Verified: LiteLLM 1.106.2 read_request_body parses form content types with request.form() (common_utils/http_parsing_utils.py:238-262), and the chat handler takes that result (proxy_server.py:12333), so the guard's json.loads view and LiteLLM's can differ. Defect is live in today's gate, not only in the design. Repair (sec-4): every POST the guard admits is replayed with canonical headers: all content-type, content-encoding, content-length and transfer-encoding occurrences removed, then exactly content-type: application/json and content-length: len(body). LiteLLM then takes its orjson branch on the bytes the guard checked. Normalise rather than refuse: no client's declared type is load-bearing, and refusing would break clients that omit it. VT (sec-6): the polyglot form body, plain and zstd, on both chat aliases, through the real proxy: injected fields never reach the fake upstream. Sibling checked, not a defect: query parameters merged at auth are dropped from the handler's parsed-body cache (http_parsing_utils.py:351-353); only api-version reaches handler data (litellm_pre_call_utils.py:2313-2317)."

