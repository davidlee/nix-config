[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "P1 equality proof assumes clean checkouts"
detail = "GPT (gpt-6-sol) design review. design.md P1 requires drvs with checkouts to match FLAKES_DEV=/nonexistent 'clean at the pushed revision', but ~/dev/oubliette has a modified tracked file (verified: git status shows M .doctrine/backlog/idea/001/backlog-001.toml). git+file includes dirty tracked changes, so the equality fails for reasons outside the migration."
disposition = "fix-now"
response = "Fixed in design text: P1 proof requires equality only where a checkout is clean at its locked revision; other diffs attributed to dirty/ahead checkouts (design.md § Phases and verification, rev 28)."
route = "review"

