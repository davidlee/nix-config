[[finding]]
id = "F-3"
status = "answered"
severity = "major"
title = "sec-2: pin filter must apply before outPath is forced"
detail = "codex #4 (reasoning): evaluating all probes then filtering lets a broken probe on the other pin abort update-system's check. Fix: filter in nix (--apply) before forcing outPath; test with a deliberately failing probe on the other pin."
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-3)."

