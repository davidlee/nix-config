[[finding]]
id = "F-5"
status = "answered"
severity = "major"
title = "sec-3/sec-6: lastGood test only proves same-revision import; lock nodes resolved wrongly"
detail = "codex #6 plus own finding: flake.lock node names are not input names (root.inputs.nixpkgs -> nixpkgs_28; .nodes.nixpkgs is a transitive input). Research's fetchTree test read the wrong node, and that is why config=pkgs.config looked like it changed hello; through root.inputs the result is the same (verified). Fix: last-good resolves nodes via root.inputs; the flake check asserts lastGood at the stable node's rev equals stable's outPath, which differs from the current one (no extra fetch: stable is already an input)."
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-5)."

