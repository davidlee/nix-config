severity = "major"
title = "sec-5: |& is bash 4; macOS /bin/sh is bash 3.2"
detail = "Own finding: just runs recipe lines with sh; on the Mac that is bash 3.2, which lacks |&. Fix: 2>&1 | with set -o pipefail (bash 3.2 has pipefail). Same in run.sh if it ever runs on darwin (it is linux-only today)."
disposition = "fix-now"
