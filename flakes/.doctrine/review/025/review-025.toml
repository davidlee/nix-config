id    = 25
slug  = "design-review-of-sl-012"
title = "design review of SL-012"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-012"

[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "sec-3: lastGood example has lib unbound"
detail = "codex #1 (verified by inspection): design.md sec-3 calls lib.getAttrFromPath with no lib in scope. Fix: pkgs.lib.getAttrFromPath."
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-1)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-1)."

[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "sec-4: yEd probe attr is yed, and yEd is unfree"
detail = 'codex #2/#3, verified: features/docs.nix:16 uses pkgs.yed; pname yEd; meta.license unfree (nix eval, aarch64-darwin nixpkgs-home). Unfree is never on cache.nixos.org, so a cached probe never fires. Fix: attr ["yed"], signal = manual with the review condition stated; skip list keeps yEd (getName).'
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-2)."

[[finding.turn]]
act = "raise"
