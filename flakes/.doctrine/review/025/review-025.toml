[[finding]]
id = "F-7"
status = "answered"
severity = "major"
title = "sec-5: nom is not installed on Draupnir"
detail = "User question, verified: nom is only in modules/nixos/nix.nix:89 (Sleipnir) and the dev shell (perSystem.nix:13, not loaded: .envrc has use flake commented out). Fix: add nix-output-monitor to the home base (modules/home/cli.nix); cached for aarch64-darwin (200). P4 is then not drv-neutral: both homes gain or dedupe one package."
disposition = "fix-now"
response = "Fixed in design.md rev 23 (sections revised at design run revision 22; the section text cites RV-025 F-7)."

