[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "VH-1 evidence is weaker than its criterion: zstd not sent by the SDK, spend below the ledger's display precision"
detail = """
Expected (plan PHASE-04 VH-1): one /v1/systemone call, 200 and spend recorded; the same zstd-encoded via the SDK, 200.
Observed (notes § Rollout):
- the zstd call was a hand-encoded Content-Encoding: zstd body, not the TypeSafe JS SDK. README's "Its default zstd bodies work" and the SDK limits (models.list(), multipart) rest on mem.fact.typesafe.sdk-js-wire (medium trust, read from SDK source), not a live SDK call.
- `llm-gateway list` shows spend to 4 decimals; 2.4e-05 reads 0.0000, so the ledger write was not observed live. x-litellm-response-cost (1.1802e-05 = 281 x 4.2e-8) was.
Operator accepted VH-1 ("agreed"). JevTest asserts spend exactly and covers zstd through the real proxy.
"""
disposition = "tolerated"
response = """
Accepted: the operator passed VH-1 on this evidence. The gaps are covered elsewhere: JevTest asserts the ledger spend exactly and serves a zstd systemone body through the real proxy; the live call showed the provider cost header. What stays unverified live is the SDK's own zstd and the SDK limits in README, which rest on mem.fact.typesafe.sdk-js-wire. screwtape:SL-004, the first SDK consumer, will exercise that path; a failure there reopens this.
"""

