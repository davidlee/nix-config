[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Design sec-4 should say what an empty content-encoding element does; the code answers 415"
detail = """
Expected: design sec-4 fixes the encoding grammar fully.
Observed: sec-4 says split on commas, trimmed, lowercased; [] | [identity] pass. It is silent on empty elements. _encodings keeps them, so `Content-Encoding: zstd,` and an empty header value ([""]) are 415. RFC 9110 § 5.6.1 lets a recipient ignore empty list elements, so this is the stricter reading (PHASE-01 Autonomy log A3).
Effect: fail-closed; no known client (TypeSafe SDK, OpenAI clients) sends either form.
"""
disposition = "design-wrong"
response = """
Keep the code: refusing an ambiguous encoding list fails closed, and no known client sends one. Reconcile adds one line to design sec-4: empty elements are kept, so `zstd,` and an empty header value are 415. Reconciliation Brief, Per-slice.
"""

