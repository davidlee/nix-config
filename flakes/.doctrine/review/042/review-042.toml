[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "SPEC-001 should describe the gateway as built; it lacks /v1/systemone, per-route fields, zstd, typesafe and the root refusal"
detail = """
Expected: SPEC-001 (binding tech spec) tells the truth about the client contract after SL-019.
Observed (notes § Autonomy log, PHASE-04 VA-1; checked against gateway_hooks.py at 761e0165):
- § Client contract routes lack POST /v1/systemone and the /v1/decisions 404 (DEC-092).
- § Body and FR-002's REQ text name ALLOWED_FIELDS; the code now has ROUTES with per-route CHAT_FIELDS / SYSTEMONE_FIELDS (DEC-087). Not in design sec-8's list.
- Refusals table lacks 415 (encoding), 400 (zstd not one frame / does not decode), 413 on decoded size.
- § Request path lacks the zstd decode and the application/json canonical replay.
- § Model names / Providers lack typesafe and the four Jev models.
- TypeSafe SDK limits (models.list() shape, multipart images; DEC-089) absent.
- § Admin CLI lacks the root refusal (DEC-091).
"""
disposition = "design-wrong"
response = """
The code is right; SPEC-001 is stale. Reconcile writes it by REV: every item in the finding, including the ALLOWED_FIELDS → ROUTES change, which design sec-8 omitted. Reconciliation Brief, Governance/spec.
"""

