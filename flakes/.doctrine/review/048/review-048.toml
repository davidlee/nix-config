note = "VERIFIED as a prose refresh, not runtime proof. Re-read design.md:325-360 against research/raw/nix:3-12, research/raw/spike-dev-envs.diff:30-34, agents/workspace-binds.nix:35-42 and quotient/scripts/form-probe:125-150,326-345. The revised design separates workspace mounts from the probe-family closure; specifies host capture of every requested build/eval result, requisites of the built outputs into fp/closure, the /workspace/root/fp layout expected by the stand-in, and a scratch real jailed-shell with read-only mounts at each original store path. Fresh persisted homes exclude residual spike mounts; this fixture stays out of the shipped consumer and other verification rows use the unmodified jail. The original missing setup is now specified. Rechecked slice-024.md:50-58, research.md:71,81-82 and DEC-127: they remain consistent with the accepted stand-in and limited probe-family claim. No fixture was generated or launched during this review."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Bare subagent entrypoints do not establish that quotient remains unregistered"
detail = """
Expected: the account of the subagent graph must distinguish omission of injected MCP arguments from absence of an MCP server.

Evidence: .doctrine/slice/024/design.md:188-191 says jailed-claude inside jailed-codex execs the bare binary, "so it is not registered", and uses this to describe it as a depth-guarded subagent rather than another orchestrator. The bare-binary premise is correct: agents/jailed-agents.nix:568-583 increments JAILED_AGENT_DEPTH and execs the resolved binary with the caller's arguments. It supplies no MCP exclusion. The same design explicitly says a project's bare quotient .mcp.json entry now finds a server (design.md:87-90). satan/.mcp.json:10-12 actually contains that entry. The parent's mounted config and quotient PATH are shared by its sibling process.

Verified: these source/config facts and the contradiction between the two design explanations. Inference, conditional on the project's MCP entry being enabled/approved: the bare claude subagent can discover and start quotient through project configuration even though its wrapper injected no registration flags. The wrapper's depth counter governs jailed-* entrypoints, not that server's direct form launches (quotient/src/server/spawn.ts:180-186). No logged-in client or bypass was exercised here; this is not a claim that the accepted trusted-orchestrator boundary is broken.

Repair: state precisely that subagents receive no injected registration and may still discover quotient through project or persisted client configuration. Describe what remains depth-guarded. If actual exclusion is a requirement, name and verify a client-level exclusion rather than relying on bare exec. Otherwise retain the accepted registration choice and correct the claimed consequence."""
disposition = "fix-now"
response = """
Correct: the design contradicted itself. sec-declaration now says a subagent gets no injected registration and can still find quotient through PATH, a project .mcp.json entry or persisted client configuration; exclusion is not a requirement because protection binds delegates only; the depth guard counts jailed entrypoints, not form launches; recursion ends at the delegate because a form's packages do not include quotient. Registration choice unchanged.
"""

