[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "The preserved MCP probes do not substantiate startup of the real quotient server from both clients"
detail = """
Expected: the design's established evidence must separate MCP child environment checks from successful startup/handshake of the real registered quotient server.

Evidence: .doctrine/slice/024/design.md:333-335 says the probes "spawned the server from both" clients; research/research.md:77-78 makes a similar assertion. The preserved Codex probe explicitly registers /workspace/root/envdump.sh, not quotient (research/raw/p4.sh:3-7). The Claude probe reads the environment dump through ./mcp.json (research/raw/p3.sh:11-13), whose config and envdump implementation are not among the preserved raw artifacts. The actual quotient calls in research/raw/mcp-call.mjs:1-8 spawn quotient directly from Node, without going through either client's registration.

Verified: the preserved command paths and direct Node launch. The supplied evidence establishes useful child-environment behavior and direct nested delegation, but does not show either client completing initialize/tools/list with the real quotient binary under the proposed registration. This is an evidence gap, not proof that the clients failed or that an unpreserved experiment never happened. The already-required logged-in human calls remain valid closure obligations.

Repair: narrow the established claim to what the preserved artifacts show, or preserve evidence of real client-to-quotient startup/handshake. A repeatable registration smoke check can establish that connection without claiming a logged-in model call; keep that distinction explicit in verification and handover."""
disposition = "fix-now"
response = """
Correct. p3.sh and p4.sh use an environment-dumping stand-in and mcp-call.mjs drives quotient from Node, so the claim was overstated. Narrowed in sec-verification, slice-024.md risks and research.md. Added a no-login registration smoke to the agent rows: jailed-claude mcp list for a handshake, jailed-codex exec for startup, explicitly not a model call. sec-handover lists real client startup as not yet observed. Logged-in human calls stay as they were.
"""

