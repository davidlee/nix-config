[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "The required stand-in form-probe run has no specified probe-closure mount"
detail = """
Expected: the mandatory real-jailed-shell form-probe proof must be repeatable with an explicitly identified test setup, preserving DEC-127's accepted stand-in rather than changing quotient.

Evidence: .doctrine/slice/024/design.md:319-326 promises a repeat on the shipped consumer, specifically contrasting it with the spike's stand-in closure bind, and names rebuilding research/raw/nix plus JAIL_WORKSPACE_DEPS. The proposed jail closure at design.md:145-148 contains only the real server and the consumer's forms. But research/raw/nix:3-12 merely replays host build/eval answers; it neither supplies their store contents nor binds their closures. The spike separately bound every path from its fp/closure at research/raw/spike-dev-envs.diff:31-34. That is a distinct operation from its workspace dependencies on line 30.

quotient/scripts/form-probe:125-150 reads the form scripts at the absolute store paths returned by nix build and follows them to their launcher and bwrap; quotient/nix/checks/flake.nix:1-2,21-31 establishes that these are a separate probe family with a fake pi, not the consumer family. agents/workspace-binds.nix:35-42,79-85 maps each workspace dependency to /workspace/<basename>; it does not mount the dependency at its original /nix/store path or compute its requisites.

Verified by source inspection: the spike has an additional probe-closure mount, the replay script does not create it, and workspace binds have different destinations. Inference: repeating the described proof on an otherwise ordinary shipped jailed-shell cannot read/execute probe-family paths not already present in that jail's closure. An accidental closure overlap would not establish a repeatable test prerequisite. This review did not build or launch the probe.

Repair: specify the complete test-only fixture generation and closure injection into a real jailed-shell, including every family used by form-probe and its absolute store paths (for example, a bounded test jail with explicit extraPkgs or the spike's explicit read-only closure binds). Keep the shipped consumer family and the probe family distinct, retain the accepted stand-in, and require a fresh-jail run without residual spike mounts before claiming the proof."""
disposition = "fix-now"
route = "refresh"
response = """
Correct. The spike bound fp/closure as a separate step and the design named only workspace deps, which land under /workspace, not at store paths. Which side is right: the spike. Edited sec-verification: a named test jail section gives the fixture steps (host captures, requisites to fp/closure, launch dir root, a scratch dev-envs copy adding only the closure bind), fresh persisted home with no residual spike mounts, probe family kept apart from the consumer family, stand-in retained per DEC-127. Swept: slice proof list and DEC-127 name the stand-in and stay true; research.md already records the closure bound in. No shipped code carries the bind.
"""

