[[finding]]
id = "F-8"
status = "verified"
severity = "major"
title = "Order-only package diffs can flip which binary wins a PATH collision"
detail = "sec-7 accepts systemPackages diffs that are 'order only' and proves them by an identical sorted set. That is unsound where two packages ship the same path: NixOS's system-path buildEnv ignores collisions and keeps the FIRST package (pkgs/build-support/buildenv/builder.pl:200-202). Sleipnir today: podman.nix sets dockerCompat = true, so podman-docker-compat (systemPackages index 334) also ships bin/docker; real docker wins only because docker.nix's entry sits at index 71. Verified: /run/current-system/sw/bin/docker -> docker-29.8.1. Moving docker into a feature module appended after config.nix moves its entry; if it lands after 334, 'docker' silently becomes podman, and the sorted-set proof stays green. Class: any colliding path in system-path. Proposed: (1) gate compares the realised system-path symlink map (sw paths -> store targets) before/after each commit, catching every collision flip; (2) make the docker winner explicit, not positional — lib.hiPrio on the feature's docker, or drop podman dockerCompat."
disposition = "fix-now"
response = "Fixed in design: system-path link-map compared after every commit (control); positional docker win replaced by DEC-022: podman becomes an unselected feature, docker feature asserts podman off, so no bin/docker collision exists. hiPrio dropped."
route = "control"

