response = "Gate gains the system-path link map, identical after every commit (catches any collision flip). Docker's win made explicit with lib.hiPrio in the feature, preserving today's behaviour. User prefers podman to win; that change (podman engine, docker deselected + coverage target, DOCKER_HOST / supabase .envrc) is backlogged as IMP-018 to keep SL-005 behaviour-preserving."

