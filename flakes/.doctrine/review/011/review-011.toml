[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "docker feature carries a group that does not exist"
detail = """sec-3 moves users.users.${username}.extraGroups = ["docker"] into the docker feature and claims 'deselecting one now removes its group'. But the feature sets virtualisation.docker.enable = false (rootless only), and nixpkgs creates users.groups.docker only under mkIf cfg.enable (nixos/modules/virtualisation/docker.nix:267,280). Evaluated today: Sleipnir config.users.groups ? docker == false. Rootless docker uses a per-user socket and needs no group. So the entry is dead in user.nix and would stay dead in the feature, contradicting sec-1 'each feature owns everything it switches'. Proposed: drop 'docker' from user.nix and do not re-add it in the feature; define the sec-7 effective-membership proof over groups that exist (intersect extraGroups with attrNames users.groups), so the drop proves identical."""
disposition = "fix-now"
response = "Fixed in design sec-3/sec-7: docker group dropped, membership proof over existing groups, rootful-docker assertion in security.nix. Checked by design review."
route = "review"

[[finding.turn]]
