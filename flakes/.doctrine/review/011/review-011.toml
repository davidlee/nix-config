response = "User: never rootful docker. docker group dropped from user.nix and not moved into the feature; effective-membership proof restricted to existing groups. Added an unconditional assertion in modules/nixos/security.nix refusing virtualisation.docker.enable (user requested). Note: nixpkgs podman already asserts dockerCompat -> !docker.enable, but incidentally and with a misleading message; ours states intent and survives a podman change. Sweep: dev, caddy, jackaudio in user.nix also name nonexistent groups — recorded for IMP-003 at reconcile, out of scope."

