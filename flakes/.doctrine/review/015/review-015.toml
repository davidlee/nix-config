[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "desktop.greeter → compositor.niri over-constrains"
detail = """User (2026-10-16): the edge exists only because greeter.nix:19 hard-codes default = "niri". It forces niri onto any host wanting the greeter, while the user plans umbriel-only. Proposed: the host sets services.displayManager.defaultSession (NixOS asserts it names an installed session); the greeter record passes it to noctalia-greeter's settings.default; no requires edge."""
disposition = "design-wrong"
response = """Integrated (user: 'go', 2026-10-16): DEC-026 amended; sec-1 drops the edge; sec-3 host sets services.displayManager.defaultSession = "niri"; sec-4 greeter record passes it to noctalia-greeter; sec-8 drops testGreeterRequiresNiri, adds a bogus-name refusal check and greeter.toml identity in P3."""

