role = "responder"
disposition = "fix-now"
response = "sec-8 states the deliberate ADR-002 D5 deviation on SL-006's terms (per-phase gate proof)."

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "New files need git add -N before evaluation"
detail = "The flake sees only tracked files (mem.fact.flakes.git-add-n). P1-P5 create modules/nixos/default.nix, hosts/Sleipnir/dns.nix, features/compositor.nix, features/shell.nix, features/desktop/core*. The design does not say so; a phase gate would fail or, worse, evaluate a stale tree. Fix: add to sec-8."
disposition = "fix-now"
response = "sec-8 lists the new files and requires git add -N before each phase's gate."

