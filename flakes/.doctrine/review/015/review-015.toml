[[finding]]
id = "F-14"
status = "verified"
severity = "minor"
title = "P1 does change module order; the interim config.nix is not drawn"
detail = """
sec-2 says the base list "keeps config.nix's current relative order ... so moving the imports into it changes nothing by itself". In config.nix the base modules are interleaved alphabetically with non-base ones (1password, audio, bluetooth, greeter, keyboard, keyring, oom, postgresql, qt, radeon, umbriel, wayland, wayland_packages, x11, xdg). Replacing them with a single ../../modules/nixos import moves every base module relative to those, which reorders merged lists. P1's row allows an order-only diff, so the gate copes, but the prose overclaims. Nor does the design show what config.nix still imports flat between P1 and P4: each phase removes some flat imports, and a reader has to reconstruct the interim states.
"""
disposition = "fix-now"
response = """
sec-2 no longer claims P1 changes nothing: grouping the interleaved base modules under one import reorders merged lists relative to the remaining flat imports, which P1's gate row allows. The base import goes first and the remaining flat imports keep their order. sec-8 gains a table of what config.nix imports flat after each of P1 to P4, and where each departing file goes.
"""

