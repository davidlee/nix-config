id    = 15
slug  = "design-review-of-sl-007"
title = "design review of SL-007"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-007"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "desktop.core merges wayland.nix and wayland_packages.nix, losing history"
detail = "sec-4 lists ./core/wayland.nix as 'wayland.nix + wayland_packages.nix' while claiming whole-file moves keep history via git mv. Merging two files breaks that for one of them, and the merge is not needed. Fix: keep each moved file whole under its own name in features/desktop/core/."
disposition = "fix-now"
response = "sec-4: wayland.nix and wayland_packages.nix move separately under their own names. Class sweep: radeon.nix into machine.nix is the same loss, settled by DEC-019/DEC-028; sec-3 now states it."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "sec-4: wayland.nix and wayland_packages.nix move separately under their own names. Class sweep: radeon.nix into machine.nix is the same loss, settled by DEC-019/DEC-028; sec-3 now states it."

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Order deviation from ADR-002 D5 not stated"
detail = "Moving modules into features reorders merged lists, deviating from ADR-002 D5 ('migration preserves existing order'), as SL-006 did with proof per phase. sec-8 relies on this but never says it is a deliberate, accepted deviation. Fix: state it in sec-8, citing SL-006's precedent."
disposition = "fix-now"
response = "sec-8 states the deliberate ADR-002 D5 deviation on SL-006's terms (per-phase gate proof)."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
