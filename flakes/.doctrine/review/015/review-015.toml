[[finding]]
id = "F-13"
status = "verified"
severity = "minor"
title = "cosmic re-enables bluetooth, rtkit and avahi, so feature switches leak"
detail = """
nixpkgs services/desktop-managers/cosmic.nix sets hardware.bluetooth.enable = mkDefault true (:166), security.rtkit.enable = true (:156) and services.avahi.enable = mkDefault true (:169). With compositor.cosmic selected, switching hardware.bluetooth off leaves the bluetooth stack enabled, and switching audio.pipewire off leaves rtkit on. The bluetooth control's signature (bluetui absent) passes while the radio stays on, so it cannot notice that the switch does not switch. sec-5 mentions rtkit's upstream overlap but not bluetooth, and does not state what the switch means while cosmic is selected.
"""
disposition = "fix-now"
response = """
Accepted as a known overlap, not engineered around: the user plans to drop cosmic after this slice. sec-5 names the three upstream settings (cosmic.nix:156, 166, 169) and what each switch then leaves on. The bluetooth control in sec-8 also checks blueman off, and reports hardware.bluetooth.enable as true while cosmic is selected and false with cosmic deselected too, so it no longer passes vacuously on the radio. Sweep: the kde record here sets none of the three (packages only); mango's upstream module was not checked; niri sets gnome-keyring by mkDefault, which the desktop.core control avoids by deselecting niri with it.
"""

