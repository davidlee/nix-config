[[finding]]
id = "F-6"
status = "verified"
severity = "major"
title = "desktop.core imports modules of its own, against ADR-002 D3"
detail = """
Raised by an external agent pass (user-relayed); verified. sec-4 makes desktop.core's record import eight modules from features/desktop/core/. ADR-002 D3 says "The own file holds the whole record. Assets sit near their feature", and CHR-012 tightened D3 to one file per feature. sec-9 says "There is no ADR change" and changes only the README rule, which leaves README and ADR-002 disagreeing. The files-as-interface question is the slice's organising principle, so it must be decided explicitly: revise ADR-002 D3 to admit "a big record may import modules of its own from features/<area>/<name>/", or justify the eight modules under the existing rule.
"""
disposition = "fix-now"
route = "review"
response = """
User chose to revise ADR-002 D3 (2026-10-16), not to inline the eight modules or call them assets. REV-006 (proposed; SL-007 related) carries the before and after wording: a record too big for one file may import modules of its own from features/<area>/<name>/, listed explicitly, belonging to that record only. It is applied in P3 with the README rule, so the README and the ADR never disagree. sec-4 states it and why D4's boundary holds; sec-9 replaces "no ADR change" and adds a code-impact row; the README bullet is tied to REV-006's wording. Sweep: no other record in the design imports modules of its own.
"""

