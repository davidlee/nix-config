role = "responder"
disposition = "design-wrong"
response = """The design assumed `mcp list` reads `--mcp-config`; the code is right. Operator's ruling, 2026-11-05, answering the audit's question ("Accept the evidence"): EX-8's purpose, a client-to-server handshake, is met by the stream-json init line plus VH-1. plan.toml's text stays, since criteria are immutable; this disposition is the record that its claude half was met by other evidence. design.md § Verification is corrected at /reconcile (brief). agents/README.md and README.md already state the right check."""

