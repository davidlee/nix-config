[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "Autonomy-log items flagged for audit: no `mountLaunchDir` assertion, empty mount point against EN-3, README statements without a PHASE-04 row"
detail = """
Flagged by the implementing seat; each needs a verdict.
1. `quotientServer` has no `mountLaunchDir` assertion, unlike the relay.
2. A launch leaves an empty `.config/quotient` in the persisted home, against PHASE-04 EN-3's "no `.config/quotient`".
3. agents/README.md rests three statements on decisions, not PHASE-04 rows: the boundary sentence, `outerGit` in a delegate, the profile refusal.
Also unrun in PHASE-04: design § Failure modes' planted `/workspace/.quotient/forms` row, and the design's claim that a form holds no quotient."""
disposition = "aligned"
response = """
1. mountLaunchDir: the design states three assertions and this is not one. The relay needs the launch dir as its one root; in-jail quotient's root is /workspace, and workspace deps sit there without it. Inference, not run: with neither, a call has no root in view and fails per call, which is SPEC-003's "an absent layer gives less". No dev-envs jail is in that state.
2. EN-3: an entrance criterion, and it held at entry; PHASE-03's residue was removed first. An empty directory is bwrap's mount point, and EX-5 saw it empty afterwards.
3. README statements, run at audit in a real jailed-shell: a delegate at /workspace/flakes gets `not a git repository`, with `git` on PATH, and `command -v quotient` rc 1. The planted link is refused `form-unapproved`. The profile refusal is EX-9's. The boundary sentence is what quotient:DEC-071 requires the docs to say."""

