[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "PHASE-04/EX-8 expects `jailed-claude mcp list` to report quotient connected; the command never lists it"
detail = """
Expected (plan.toml PHASE-04 EX-8, design.md § Verification): `jailed-claude mcp list` reports `quotient` connected, as a client-to-server handshake.
Observed (notes § PHASE-04 proof, EX-8 claude): `mcp list` omits it and `mcp get quotient` says no such server. Both read stored config only, never `--mcp-config` (mem.fact.claude.mcp-list-ignores-mcp-config).
The handshake is proved another way: the stream-json init line shows quotient `connected`, source `dynamic`, with its five mcp__quotient__* tools, and VH-1 is a logged-in delegate call that completed. The phase was marked complete with this unmet as worded and no operator ruling."""
disposition = "design-wrong"
response = """The design assumed `mcp list` reads `--mcp-config`; the code is right. Operator's ruling, 2026-11-05, answering the audit's question ("Accept the evidence"): EX-8's purpose, a client-to-server handshake, is met by the stream-json init line plus VH-1. plan.toml's text stays, since criteria are immutable; this disposition is the record that its claude half was met by other evidence. design.md § Verification is corrected at /reconcile (brief). agents/README.md and README.md already state the right check."""

