[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Forms are described as inert on the host, but a host server with LLM_GATEWAY_KEY set overrides the key file"
detail = """
Expected (design § Forms, agents/jailed-agents.nix comment at line 220): both form changes are inert on the host.
Observed: the key expression prefers the environment, and quotient's childEnv (src/server/spawn.ts) passes every variable not prefixed for the server through to the form. A host quotient started from an environment holding LLM_GATEWAY_KEY uses that key, with its budget and model list, in place of keys/pi.
Reach today: none observed. LLM_GATEWAY_KEY is unset in this host session, and the only host-side mention is a comment in features/agents.nix about eca's config. DEC-124 and agents/README.md state the order correctly; only "inert" overclaims."""
disposition = "design-wrong"
response = "Behaviour is DEC-124's and stays: env first is what makes one family serve both places. The claim was too broad. The comment in agents/jailed-agents.nix is corrected in this audit (comment only); design.md § Forms is corrected at /reconcile (brief). Recorded in the Synthesis as a standing risk: nothing sets the variable on the host today."

