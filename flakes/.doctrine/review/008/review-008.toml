[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected malformed requires/area shapes to fail as catchable throws; observed uncatchable type errors"
detail = """
Expected (invariant 2): every structural error is a catchable `throw` with a
clear message; `badRecords` guards inputs that would abort later checks.
Observed (exec, tryEval; reproduced by the auditor for the first row):
- `requires = "a.y"` → `expected a list but found a string` (features.nix:121)
- `requires = null` → `expected a list but found null`
- `requires = [1]` → `cannot coerce an integer to a string` (features.nix:120)
- area `value = {x={};}` → `expected a list but found a set` (imap1, :94)
- area without `name`, area `name = 1`, `tree` a set → abort
Not a regression: these expressions predate SL-003. But SL-003 introduced
the `badRecords` gate at record level only; `requires` (a record key this
slice's allowed-keys list owns) and area shape get no equivalent check.
Source: independent code-review agent, finding 1.
"""
disposition = "fix-now"
response = """
0237ff67: `badRecords` → `badShapes`, checked alone before everything else: area is { name = <string>; value = <list>; }; feature is a record with a string name; `requires` is a list of strings. testMalformedShapeFails covers each (5 bad, 1 twin). Red run aborted uncatchably; green after. `tree` itself not a list is left unchecked: it is only ever `import ./features`.
"""

