title = "Expected empty feature and area names to be rejected; observed both resolve"
detail = """
Expected: `name` is the feature's identity and address segment; the dotted
check (features.nix:110-111) exists to keep `<area>.<name>` well-formed.
Observed (exec; reproduced by the auditor): `name = ""` resolves, giving
path `a.` and `_file "unknown (a.#nixos)"`; an empty area name gives `.x`.
`feature.a."".enable` is then a legal but meaningless option.
Fix: reject "" beside the dotted check, for areas and features.
Source: code-review agent, finding 3.
"""
disposition = "fix-now"
response = '''
0237ff67: `dotted` → `badName` (empty or contains "."), for areas and features; messages say "is empty or contains \".\"". testEmptyNameFails.
'''

