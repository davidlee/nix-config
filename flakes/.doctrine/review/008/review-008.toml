[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected _file never to hold a store path; observed an absolute path for records outside the flake root"
detail = """
Expected: features.nix:128-130 — "Relative, never a store path".
Observed (exec): a record imported from outside the flake root yields
`_file = "/tmp/.../ext/x.nix:2 (a.x#nixos)"`. `lib.removePrefix root` is a
no-op on mismatch, so a record from a flake input would carry
`/nix/store/<hash>-source/...`. Latent: every current record is in-tree. The
comment states as a guarantee what is a property of today's tree.
Fix options: make the comment honest (precondition: records live in this
flake), or fall back to "unknown"/input-relative on mismatch.
Source: code-review agent, finding 2.
"""
disposition = "fix-now"
response = """
0237ff67: the comment now states the precondition (records written in this flake) and what happens otherwise. No fallback machinery: no record comes from outside today (YAGNI). ADR-002 D6 wording carries the precondition → reconciliation brief (REV).
"""

