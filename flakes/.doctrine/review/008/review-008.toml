[[finding]]
id = "F-1"
status = "verified"
severity = "nit"
title = "Expected features/session/snooze/ gone (PHASE-01 EX-1); observed empty dirs left on disk"
detail = """
Expected: PHASE-01 EX-1 — "features/session/snooze/ ... are gone".
Observed: `find features/session/snooze` lists two empty directories,
`features/session/snooze/` and `features/session/snooze/bin/`. Git does not
track empty directories, so the commit is correct and `git+file:` evaluation
never sees them. A `path:` flake ref (the README's darwin bootstrap uses one)
copies the working directory, and a reader browsing `features/session/` sees
a stale `snooze/` beside the area's real assets.
Fix: `rmdir features/session/snooze/bin features/session/snooze`.
"""
disposition = "fix-now"
response = """
Removed the empty directories (rmdir features/session/snooze/bin features/session/snooze). Untracked, so no commit; on disk only.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

