severity = "nit"
title = "Comment drift from design sec-3: one added, one lead dropped"
detail = """
Expected: design sec-3 — comments travel verbatim except cross-file references.
Observed: (a) features/virt/capsule.nix adds a "Plain priority: sudoers is last-match-wins …mkOrder 400/600" comment on the sudo rule (DEC-013's rationale, in code); (b) the firewall.interfaces comment lost its `~/dev/microvm-spike/ —` lead, since the file header already names that checkout. (c) Also a new "devshell path's perimeter" lead comment on the networking block, which design sec-2's sketch shows. No behaviour effect."""
disposition = "aligned"
response = "Aligned: (a) puts DEC-013's reason next to the rule it governs; (b) removes a duplicate of the header; (c) matches the sec-2 sketch. Nothing changes in the evaluated config, as the identical drvs-sets show."

