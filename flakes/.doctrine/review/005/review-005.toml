[[finding]]
id = "F-3"
status = "verified"
severity = "nit"
title = "Move landed as two commits, design implies one `git mv`"
detail = """
Expected: design sec-3/sec-6 — capsule.nix moved with `git mv` "so history follows".
Observed: 9b5dbf79 is a pure rename (Sleipnir imports the new path); 5f672bdb absorbs the pieces and wires the feature. A single commit would put rename similarity below 50% (file more than doubles), so `git log --follow` would lose capsule's history — the stated purpose of the git mv. Notes PHASE-01 § "Two commits" record this."""
disposition = "aligned"
response = "Aligned: the design asks for `git mv` so history follows, and never says how many commits. Two commits is what makes the history follow. Notes record why."

