Observed: `error: justfile does not contain recipe `gate``. Substitute gates run this audit: `just test` green (features check + script tests); `just drvs` at HEAD identical to the PHASE-01 after-capture, differing from baseline only in nixosConfigurations.Sleipnir; sudoers diff is the rtcwake/nft rule swap only; nix-diff's only differing leaf is sudoers-in; flake.lock sha 528ed051 unchanged. Already captured as CHR-010."""
