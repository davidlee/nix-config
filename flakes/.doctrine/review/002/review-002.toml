Codex (gpt-6-sol), read-only, over bf2eb570..d19a1d45 (flakes/) against design sec-3/4/6 and the brief's lines of attack. Claude reproduced every candidate by eval or code reading before raising (F-1..F-6), and added F-7. Also checked by Claude and found sound, so not raised: self-referencing requires, empty area, a hand-written host assertions entry (enforced), resolver tests returning [].
