title = "Expected a dotted area or feature name to be refused clearly; observed an uncatchable abort"
detail = """
features.nix builds `path = "${area.name}.${f.name}"` and later splits it (`lib.splitString "."` in `checks`) to look the option up.
Proof (eval): area "a.b", feature x, requires ["a.b.x"], selected → `evaluation aborted … cannot find attribute 'a.b.x.enable'`. It's an abort, so tryEval cannot catch it.
Suggested: reject names containing "." in the structural checks, with a message naming the culprit.
Raised by codex, verified by claude.
"""
