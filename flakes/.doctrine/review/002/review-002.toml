title = "Expected one name per concept in features.nix; 'selected' names two different things"
detail = """
In `checks`, `selected = path: getAttrFromPath …` is a predicate on a path, beside `on = r: …`, a predicate on a record. At top level, `selected = filter … records` is the list of selected records. Two predicates do one job, and one name means two things.
Suggested: one predicate in checks (e.g. `enabled = path: …`, used as `enabled r.path`), and keep `selected` for the list only.
Raised by claude (code reading).
