[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected each failure test to prove its specific check fired; they accept any failure"
detail = """
features-test.nix `fails = e: !(builtins.tryEval e).success` (~:17) is used by testUnknownPrerequisiteFails, testNowhereToLandFails and testDuplicateNamesFail. Any throw in the resolver passes them, e.g. a regression that throws for every fixture.
Only testPrerequisiteOffFails has a passing twin (testPrerequisiteOnPasses) that differs in exactly the property under test. There is also no test for a hand-written host `assertions` entry (the documented escape hatch).
tryEval drops the message, so asserting the text is not available in pure eval. Suggested: pair each failure fixture with a minimally different passing one, and add a false host-assertion fixture with its passing twin.
Raised by codex, verified by claude (code reading; the resolver's own error paths are throws, so the claim holds).
"""
disposition = "fix-now"
response = """
