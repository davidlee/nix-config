[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected an unknown descriptor key to fail resolution; a misspelt class key silently drops that half"
detail = """
features.nix only tests key presence: the D6 check (`lib.any (c: r.descriptor ? ${c}) classes`, ~:75) passes as long as one class key exists, and `project` (~:100) emits only the recognised keys.
Proof (eval): `{nixos = {}; homeManger = {};}` selected with classes [nixos homeManager] → modules.nixos has the feature, modules.homeManager = [ ]. No error.
Risk: every later migration writes descriptors by hand; a typo removes a feature half invisibly (the drvs gate catches it only during a migration, not afterwards).
Suggested: structural check over every record that attrNames descriptor ⊆ [nixos homeManager darwin requires]; reading names forces no value (ADR-002 D4 holds).
Raised by codex (gpt-6-sol), verified by claude.
"""
disposition = "fix-now"
response = """
fix-now. User agreed 2026-10-15 ("agreed") to fix all seven in SL-001, F-1/F-2/F-5 as additions to design sec-3 structural checks, to be recorded in slice notes for reconcile. Repair delegated to a subagent; verified by claude before verify.
"""

