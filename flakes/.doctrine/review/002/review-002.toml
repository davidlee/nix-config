title = "Expected coverage drvPaths to vary only with the config; they also vary with the repo"
detail = """
justfile `coverage` picks `c.config.system.build.toplevel.drvPath` with no agents-registry pin; `drvs` (~:81) pins it because the registry points at this flake's source. So any edit under flakes/ changes the coverage drvPath. It's harmless for an evaluation check, but misleading if anyone compares runs. (PHASE-03 already had to verify openrgb directly for this reason.)
Suggested: share the pinned nixos pick between drvs and coverage (one just variable), so both stay identical across repo edits.
