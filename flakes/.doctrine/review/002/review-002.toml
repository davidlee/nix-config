title = "Expected the README to state when an unselected feature can fail a host; it says one never can"
detail = """
README.md ~:214: "Unselected features are never evaluated, so a broken one blocks no host."
features.nix's structural checks deliberately run over every record (design sec-3 step 1, invariant: "a misspelt prerequisite fails on every host"). Proof (eval): an unselected feature with requires ["absent.y"] → `unknown feature absent.y in a.x.requires` on every host.
The code matches the design; the README overclaims. Same applies to any new structural checks (F-1, F-2).
Suggested: README says structural errors in the tree (names, requires paths, descriptor keys) fail every host; module contents of unselected features are never evaluated.
Raised by codex, verified by claude.
"""
