[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected first home-switch on a nom-less home to work; observed it fails (nom not yet on PATH)"
detail = """
Expected: design sec-5 makes `home-switch` / `home-build` pipe through `nom --json`
and adds nix-output-monitor to the home base, implying a working switch path.
Observed (justfile:95,98): the recipes call `nom` unconditionally. A home built
before PHASE-04 has no nom (Draupnir today: design sec-5 says "nom is not
installed on Draupnir today"), so its first `just home-switch` fails with
`nom: not found` before home-manager's result can install it. The design never
addresses this bootstrap. PHASE-05 documents a manual bootstrap
(`nix shell nixpkgs#nix-output-monitor -c just home-switch`), untested on the
Mac. Sleipnir is unaffected (nom at ~/.nix-profile/bin/nom). VH-1 pending.
"""
disposition = "fix-now"
response = """
User chose a code fallback (2026-10-17). justfile `nom_pipe` is
`--log-format internal-json -v 2>&1 | nom --json` when `command -v nom`
succeeds, else empty; home-switch / home-build use it, pipefail kept. Verified
with `just --evaluate nom_pipe` under PATH with and without nom (dry-run does
not evaluate backticks). README § Bootstrap macOS and § Workarounds no longer
ask for a manual bootstrap. `just test` green. Commit 86df50be. Design sec-5
gains a sentence on this at reconcile (brief, per-slice).
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
User chose a code fallback (2026-10-17). justfile `nom_pipe` is
`--log-format internal-json -v 2>&1 | nom --json` when `command -v nom`
succeeds, else empty; home-switch / home-build use it, pipefail kept. Verified
with `just --evaluate nom_pipe` under PATH with and without nom (dry-run does
not evaluate backticks). README § Bootstrap macOS and § Workarounds no longer
ask for a manual bootstrap. `just test` green. Commit 86df50be. Design sec-5
gains a sentence on this at reconcile (brief, per-slice).
"""

[[finding.turn]]
act = "verify"
role = "raiser"

