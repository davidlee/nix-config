[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected design.md to match the implementation; observed drift in sec-2, sec-3, sec-5, sec-6"
detail = """
Expected: design.md (canonical) matches the code.
Observed (notes.md "For /reconcile" + D-items):
- sec-2: probe field is `storePath`, not `outPath` (nix serialises any attrset
  with outPath as a bare string under --json); unfree read from `meta.unfree`
  (per plan EX-3), not `meta.license.free`; exit 2 (usage / probes failed to
  evaluate) missing from the result table; `workarounds/pin-filter.nix` is a
  new shared file; probes.nix checks missing keys itself and names the probe.
- sec-3: lastGood passes `filterAttrs (v != null) pkgs.config`, not
  `pkgs.config` (nixpkgs 24.11 calls `replaceStdenv = null`); `last-good` exit
  table (refuses unknown, follows, non-NixOS/nixpkgs inputs; no lock at HEAD;
  single lock commit) absent; "last good" = previous lock, not previous rev.
- sec-5: will-build dispatch is `os()` (not "like run.sh");
  preferLocalBuild has two encodings (plain env and structured `__json`);
  update-* call `just host='{{host}}' will-build` nested.
- sec-6: tests bullet says `|& nom --json`, contradicting sec-5 / EX-3 (`2>&1 |`);
  drvs table names two homes, actual diff is three (incl. `david` alias), and
  `coverage.home@aarch64-linux` also moves.
"""
disposition = "design-wrong"
response = """
Each item is a reasoned implementation finding recorded in notes.md by the
phase that hit it; the code is right. Reconciliation Brief § Per-slice:
design.md sec-2, sec-3, sec-5, sec-6 edits as enumerated.
"""

