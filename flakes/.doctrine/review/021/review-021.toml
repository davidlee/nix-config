[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Expected the flake's oubliette follows to match oubliette's inputs; local oubliette dropped target/goad-walk, so every override run warns"
detail = """
`just gate` and `just coverage` warn "input 'oubliette' has an override for a non-existent input 'target'" (and 'goad-walk'). flake.nix:132-133 declares `target.follows` and `goad-walk.follows`. The locked oubliette (61701fe) still has both inputs. The local checkout's SL-004 work (1284c5a, "no target is in its lock") removed them. Harmless today; the follows lines must go when oubliette is pushed and re-locked. The cause is outside SL-009 (another agent's oubliette slice), and notes.md § Harvest Open already records it.
"""
disposition = "follow-up"
response = """
The cause is outside this slice (oubliette SL-004), and fixing it depends on oubliette being pushed. Captured as ISS-011, with the fix and how to verify it.
"""

