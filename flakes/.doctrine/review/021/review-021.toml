[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Expected governance records to describe the delivered system; DEC-016/018/027/031/034, ISS-003/006, IMP-010, IDE-002, HYP-001 and RFC-001 predate SL-009"
detail = """
design.md § Records at reconcile lists the records the slice changes. With every phase landed:
- ISS-003 (system_override fails without ~/dev/oubliette), ISS-006 (lock pins local paths): fixed in PHASE-01 (lock guard green; absence run evaluates). Still open.
- IMP-010 (meta validation): fixed in PHASE-02. Still open.
- IDE-002: not adopted (DEC-037). Still open.
- DEC-016: its overlay clause and its "every Mac evaluation must override agents" consequence no longer hold (DEC-040; the lock names no Linux path).
- DEC-018: legacyPackages is now the overlay's only carrier.
- DEC-027, DEC-031: the registry is out of the NixOS base; the eca/chatgpt W2 exception has ended (features/agents.nix).
- DEC-034: the stub set is the dev-checkout list, which now includes oubliette.
- HYP-001: evidence that W2 needed no factory selection read.
- RFC-001: W2 and W6 done.
"""
disposition = "design-wrong"
response = """
These are the planned governance updates (design § Records at reconcile), confirmed against the delivered code. Each one is in the Reconciliation Brief § Governance/spec, with its write surface: a backlog status move for ISS-003, ISS-006, IMP-010 and IDE-002; record revision for DEC-016, DEC-018, DEC-027, DEC-031, DEC-034, HYP-001 and RFC-001.
"""

