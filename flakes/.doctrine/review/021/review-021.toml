[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Expected slice conformance and verify-vt to attribute the slice's paths; both read every path as undeclared or unattributable"
detail = """
`doctrine slice conformance 9`: 28 undeclared, 20 undelivered, 0 conformant. `doctrine slice verify-vt 9`: every VT UNATTRIBUTABLE ("not modified by this slice"). The registry records git paths with the `flakes/` prefix (the git worktree is $HOME), while selectors are flakes-relative. This is ISS-005.
Judged by agent: each of the 20 undelivered selectors matches one undeclared `flakes/<path>` exactly. The other 8 undeclared paths are .doctrine bookkeeping (notes, slice toml, ISS-010, one memory). No path was edited outside the design's code-impact table. Every VT keyword is present in its file.
"""
disposition = "follow-up"
response = """
The defect is in the tooling, not the slice, and ISS-005 already owns it. This audit judged by agent instead (see the finding detail): every undelivered selector matches a prefixed undeclared path, and every VT keyword is present. Nothing to reconcile in SL-009.
"""

