id    = 21
slug  = "reconciliation-review-of-sl-009"
title = "reconciliation review of SL-009"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance self-audit of SL-009 (P1–P4) at 61680d0c. Checked against design.md sec-1..6, plan.toml EX/VA, and DEC-037..041. Read the P3/P4 diffs in full. Re-ran doctrine check gate, just gate, just coverage, the jq lock guard and the close grep, all green. Read slice conformance and verify-vt by agent, because of the ISS-005 prefix. Took P1/P2 evidence from notes.md and RV-020. VH-1 not run (user).
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-009"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected comments to follow moved code; justfile:105 still said the agents registry lives in nix.nix"
detail = """
The drvs recipe's comment explained the nixos pin by "the `agents` registry points at this flake's source (nix.nix)". PHASE-04 moved the registry to features/agents.nix (agents.registry). The phase sheet kept the justfile off-limits because of the user's uncommitted push-local recipe, so the worker noted the stale comment but did not fix it (notes.md § PHASE-04).
"""
disposition = "fix-now"
response = """
Fixed in 61680d0c: the comment now names agents.registry and is rewrapped to 80 columns. The commit staged a filtered copy of the justfile, so the user's push-local recipe stays unstaged. `just gate` green afterwards.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Fixed in 61680d0c: the comment now names agents.registry and is rewrapped to 80 columns. The commit staged a filtered copy of the justfile, so the user's push-local recipe stays unstaged. `just gate` green afterwards.
"""

[[finding.turn]]
act = "verify"
role = "raiser"

[[finding]]
id = "F-2"
status = "verified"
severity = "nit"
title = "Expected design § Phases to place the config.nix comment in one phase; the P4 row names it, §4/§6 and plan P3 EX-2 put it in P3"
detail = """
design.md sec-5 table, P4 row: "agents area, README, `config.nix` comment". sec-4 ("The comment in hosts/Sleipnir/config.nix:10-11 about mkAfter ordering is updated" under the overlay section), sec-6 code-impact (config.nix → P3) and plan.toml PHASE-03 EX-2 all assign it to P3, which delivered it (1f4d6bd8). There is also a count typo: sec-6 calls bin/dev-checkouts "its three verbs"; sec-2 defines four (override, stub, ahead, names).
"""
disposition = "design-wrong"
response = """
The design's sec-5 P4 row was wrong; the code followed sec-4, sec-6 and plan P3 EX-2. Reconcile edits design.md directly: drop "`config.nix` comment" from the P4 row (sec-5), and change "its three verbs" to "its four verbs" (sec-6). Reconciliation Brief § Per-slice, items 1–2.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The design's sec-5 P4 row was wrong; the code followed sec-4, sec-6 and plan P3 EX-2. Reconcile edits design.md directly: drop "`config.nix` comment" from the P4 row (sec-5), and change "its three verbs" to "its four verbs" (sec-6). Reconciliation Brief § Per-slice, items 1–2.
"""

[[finding.turn]]
act = "verify"
