[[finding]]
id = "F-1"
status = "answered"
severity = "blocker"
title = "agents input is locked to a Linux-only path; darwin/Mac home would force it"
detail = """
Raised by Codex (gpt-6.1-sol) adversarial review, round 1.
Claim: sec-2 adds agentsOverlay to darwin (platformModule) and Mac home (homeModule); sec-4 overrides only emacs on the Mac.
Evidence: flake.lock nodes.agents.locked = {type=path; path=/home/david/flakes/agents}. overlays/agents.nix:11 reads inputs.agents.lib.${system} as soon as the overlay is constructed. justfile:11 overrides agents only in system_override (Linux run.sh); home_override (justfile:15) overrides only emacs.
Failure: on the Mac (/Users/david) the locked path does not exist; any evaluation that builds the overlay list fails to fetch agents. "Lazy, drv-neutral" (DEC-016 consequences) does not hold for fetching the input that supplies the overlay.
Fix: supply a portable agents source for every Mac evaluation (bootstrap, darwin-build/switch, home-build/switch, checks), e.g. override agents to path:<justfile_dir>/agents.
"""
disposition = "fix-now"
response = """
Design rev 32 sec-4: agents_override joins home_override (system_override already has it), so every Mac evaluation (darwin-build/switch, home build, drvs, just test) overrides agents to the checkout; lands in phase 1. Lock drift itself: ISS-006.
Criterion: on Draupnir, from a checkout at /Users/david/flakes where the locked path /home/david/flakes/agents does not exist, the justfile darwin-build for host Draupnir and the home activationPackage build for david@Draupnir both evaluate and build (cut-over step 1). Linux: just drvs shows home outputs identical after the override is added.
Host-phase constraint: the Mac half runs in the human cut-over phase, after the justfile change and the Draupnir host and home exist; the Linux identity half runs in the phase that adds the override.
"""
route = "demonstrate"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Confirmed: flake.lock nodes.agents.locked is path:/home/david/flakes/agents. Linux home-switch also consumes agentsOverlay without overriding it (works only because the path exists locally), so the justfile:9-10 "Linux-only consumer" comment is already false.
Design revision 25, sec-4: agents_override joins home_override (system_override already has it), so home, darwin, drvs and `just test` all carry it; lands in phase 1 (sec-7). Linux home unchanged (same tree; drvs gate). Cut-over step 1 builds with the home_override flags. DEC-016 consequence amended. Lock drift itself out of scope: ISS-006.
