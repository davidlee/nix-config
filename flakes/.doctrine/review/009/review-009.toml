Raised by Codex, round 1.
Claim: sec-2 item 1 / DEC-016: stableOverlay adds pkgs.stable, derivation-preserving.
Evidence: nixpkgs pkgs/by-name/ki/kicad/package.nix:25 `stable ? true`; also ki/kicad/base.nix and gu/guile-cairo/package.nix. lib/customisation.nix callPackageWith fills defaulted args from the package set. Codex eval: with the overlay, kicad fails "expected a Boolean but found a set" (package.nix:192).
Failure: pkgs.kicad (and siblings) break in every overlaid set, incl. legacyPackages (agents#kicad). The 3-attr legacyPackages probe would not catch it.
Fix: keep stable out of the package namespace or use a collision-free name; add a concrete regression probe.
