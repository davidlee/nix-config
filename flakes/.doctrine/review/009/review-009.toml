[[finding]]
id = "F-4"
status = "answered"
severity = "major"
title = "cut-over removes home packages before the replacement is built; no recovery path"
detail = """
Raised by Codex, round 1.
Claim: sec-4 orders darwin-switch (embedded HM leaves), then nix build of standalone home, then activate; "run 2 immediately".
Evidence: nix-darwin modules/users/default.nix:336 builds the per-user profile from users.users.<u>.packages, which embedded HM fed. HM check-link-targets.sh:26 rejects collisions incl. an existing .backup.
Failure: a fetch/build failure (e.g. F-1) or collision leaves the user in the package gap with no documented way back. Embedded HM leaves no standalone generation history to roll back to.
Fix: build both artifacts before switching; record the recovery (darwin-rebuild --rollback restores embedded HM, darwin-rebuild.sh:204) and verify it.
"""
disposition = "fix-now"
response = """
Design rev 32 sec-4: build both artifacts first; activate the prebuilt system as darwin-rebuild.sh:241-248 does; standalone home activation restores packages even if darwin activation aborts; last resort darwin-rebuild --switch-generation to the generation noted as current, then host named explicitly.
Criterion: on Draupnir, cut-over steps 1-5 complete; home packages resolve in a new login shell; then a switch-generation to the noted generation restores embedded HM packages, and a re-switch with host Draupnir returns to standalone.
Host-phase constraint: the final, human-run phase on Draupnir, after all code phases and with network available; not runnable on Linux.
"""
