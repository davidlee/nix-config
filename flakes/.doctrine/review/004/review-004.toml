status = "verified"
severity = "minor"
title = "sec-5 red claim and DEC-014 'exactly' overstate the test"
detail = "Before the tree entry the test yields [false false], an assertion failure, not an eval error. DEC-014(1) says 'exactly #nixos and nothing for homeManager or darwin'; the test checks membership with classes = both and selects via Sleipnir's host file, and goes red if Sleipnir turns capsule off."
disposition = "fix-now"
response = "sec-5 red claim now [false false]; ordering note added; DEC-014 amended to match the test (membership, Sleipnir selection pinned on purpose, darwin via generic D6)."

