title = "design review of SL-002"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Adversarial pass by a fresh Claude subagent: design.md sec-1..6 against code, research, ADR-001..005, DEC-001..014; evaluated the design's edits in a scratch copy (gate: only sudoers-in differs, the sec-4 swap; test red [false false] → green; negative control clean). Five minor findings, all fixed and verified."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-002"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "wheel sudo rule is mkOrder 600, not 400"
detail = "Adversarial pass (subagent). nixpkgs sudo.nix:252 root mkOrder 400, :257 wheel mkOrder 600. sec-4, DEC-013 and research say both 400. Conclusion unchanged (600 < 1000). Verified by orchestrator."
disposition = "fix-now"
response = "sec-4, DEC-013 and research corrected to mkOrder 400 (root) / 600 (wheel)."

