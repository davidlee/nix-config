note = "brief entry exists (## Reconciliation Brief)"

[[finding]]
id = "F-3"
status = "verified"
severity = "nit"
title = "design sec-3 binds room = roomDoor.shared.room; landed inherit (roomDoor.shared) room; sec-5 README row still conditional"
detail = """
Expected (design.md sec-3): `room = roomDoor.shared.room;`. Observed (runner.nix): `inherit (roomDoor.shared) room;`, statix's form of the same binding. Same value.
Expected (design.md sec-5): README.md changes "if the tree names satan's files". Observed: README is unchanged, because its feature tree lists satan.nix's features, not the files under features/satan/. The condition is settled and sec-5 should say so.
"""
disposition = "design-wrong"
response = """
Reconciliation brief: design.md sec-3, show `inherit (roomDoor.shared) room;`; sec-5, drop the README row (README unchanged: its tree names features, not files).
"""

