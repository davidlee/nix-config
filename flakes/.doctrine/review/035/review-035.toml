Expected: conformance lists features/satan/{room,room-test,runner}.nix, perSystem.nix, justfile and SATAN.md as conformant.
Observed: each selector is reported undelivered and the same path, prefixed `flakes/`, undeclared. The git worktree is $HOME, so recorded deltas carry the `flakes/` prefix (ISS-005; CLAUDE.md: judge by agent). By inspection, all six declared paths were delivered and nothing undeclared was touched apart from doctrine workflow files (notes.md, plan.toml). verify-vt's UNATTRIBUTABLE results have the same cause; every VT keyword is present.
"""
disposition = "aligned"
response = """
Aligned: a known tool limitation, tracked as ISS-005, not a slice defect. Attribution judged by inspection, as recorded in the finding.
"""

