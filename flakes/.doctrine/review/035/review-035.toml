slug  = "reconciliation-review-of-sl-016"
title = "reconciliation review of SL-016"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-016: b08fe1f2 and fc3ca4c8 against design.md (r28), plan.toml and DEC-079. Ran doctrine check gate (green); compared config.toml and check drvPaths to baselines; read back the built and live door.toml; ran the mutation test; judged slice conformance and verify-vt by inspection (ISS-005).
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-016"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "design sec-4 specifies evalTests = name: failures:; landed evalTests takes the test file"
detail = """
Expected (design.md sec-4): `evalTests = name: failures: …`, called as
`evalTests "features" (import ./features-test.nix lib)`.
Observed (perSystem.nix, b08fe1f2): `evalTests = file: let name = lib.removeSuffix ".nix" (baseNameOf file); failures = import file lib; …`, called as `evalTests ./features-test.nix`.
Why: with `name`, checks.satan-room would throw `satan-room-test.nix failed:`, naming a file that does not exist (the file is room-test.nix). The existing checks' drvPaths and messages are unchanged (PHASE-01 VA-1, VA-2; notes.md § PHASE-01). The design text is the defect.
"""
disposition = "design-wrong"
response = """
The code is right; the design text is stale. Reconciliation brief: design.md sec-4, change evalTests to the landed `evalTests file` form and its three call sites.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The code is right; the design text is stale. Reconciliation brief: design.md sec-4, change evalTests to the landed `evalTests file` form and its three call sites.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = "brief entry exists (## Reconciliation Brief)"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "design sec-6 says write room-test.nix before room.nix exists; red needs a wrong-valued stub"
detail = """
Expected (design.md sec-6): "Red first: write room-test.nix before room.nix exists."
Observed: with room.nix absent (or empty), the check fails on a missing file or attribute, which is an eval error rather than a runTests assertion failure. PHASE-02 went red against a stub room.nix with wrong values: all four tests failed on assertions (notes.md § PHASE-02). plan.toml PHASE-02 EX-1 already says "stub"; design sec-6 does not.
"""
disposition = "design-wrong"
response = """
Reconciliation brief: design.md sec-6, red against a wrong-valued stub room.nix (git add -N'ed), not an absent file.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

