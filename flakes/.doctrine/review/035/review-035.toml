[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "plan.toml PHASE-01 VT-1 keywords and objective edited during the phase"
detail = """
Expected: plan criteria are append-only once authored (boot rule: ids immutable, edits append).
Observed: during PHASE-01 (before completion), VT-1's `keywords` changed from ["evalTests = name: failures:", ...] to ["evalTests = file:", "evalTests ./features-test.nix", "evalTests ./host-meta-test.nix"], and the objective text gained "(as landed; design sec-4 sketched …)". No id changed. Separately, 3e670506 restored PHASE-01's `[[phase]]` header, which an earlier authoring script had dropped. That was a repair, not a change of meaning.
"""
disposition = "tolerated"
response = """
Tolerated. The edits came before the phase completed, kept every id, and made VT-1 test the code that actually landed rather than a signature the design abandoned. Keeping the old keywords would have left VT-1 failing against correct code. The header restore repaired an authoring error and changed no meaning. Reconcile changes no plan criterion (off-surface).
"""

