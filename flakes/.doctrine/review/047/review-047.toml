[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Expected dispatch-confined cargo unaffected and the host sccache server out of reach; observed the inherited host UDS breaks builds, or routes them to the host server"
detail = """
Expected: SPEC-003 responsibility "Keep the host's sccache server out of reach of jails"; REQ-029 and agents/dev-env.nix state the host socket is under XDG_RUNTIME_DIR, "which no jail binds". The slice's Non-Goals leave dispatch confinement unchanged, so its builds should behave as before.

Observed: Doctrine's dispatch jail (~/dev/doctrine/scripts/spawn-confined.sh, Linux PREFIX) is `bwrap --ro-bind / / ... --tmpfs /tmp`, no --clearenv. /run/user/1000 is therefore visible, and a worker inherits RUSTC_WRAPPER=sccache (host-wide since dev.env; previously from Doctrine's .envrc) and SCCACHE_SERVER_UDS=/run/user/1000/sccache.sock (new: DEC-121).

Evidence, run in that PREFIX's shape by hand (not a real dispatch run), sccache 0.19.0, the doctrine dev-tools rustc:
- UDS unset, no host server, writable worktree (pre-slice shape): compile succeeds, artefact written; the client starts a server inside the jail.
- UDS inherited, no host server (post-slice shape): `sccache: error: Server startup failed: Read-only file system (os error 30)`, no artefact. With a stale socket file: `Connection refused`, rc=2. The client cannot bind in the read-only directory. This is a regression: cargo fails in a worker whenever no host server is running.
- UDS inherited, host server up: the jail client reached it; the host server's `Compile requests` went to 1. rustc errored in my probe, so no artefact shows whether output escapes the read-only jail. Inference, not shown: a successful compile would run rustc and proc macros outside the jail. Same-class exposure existed before over TCP 127.0.0.1:4226 (pre-existing), so this half is not new, but DEC-121 and REQ-029 claim it closed.

Cause: DEC-121 assumed jails are the library's. PHASE-07 verified jailed-* and forms only; no dispatch-shaped run. The library's jails and forms are unaffected: they set /tmp/sccache.sock (launcher position 10)."""
disposition = "fix-now"
response = """User chose option A (reply: "A"). Doctrine's scripts/spawn-confined.sh Linux prefix, and its twin scripts/pi-respawn-nofork.sh, set --setenv SCCACHE_SERVER_UDS /tmp/sccache.sock. This sets an env var; the jail's mounts are unchanged, so the Non-Goal holds. tests/e2e_worker_confinement.rs now runs the shipped prefix with the host address exported and asserts the worker sees its own socket (red, then green). Live, in the prefix's shape: compile succeeds with no host server; with a host server up, it succeeds and that server's Compile requests stays 0. REQ-029's wording goes through the reconcile brief. Uncommitted in ~/dev/doctrine, under CHR-184."""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """User chose option A (reply: "A"). Doctrine's scripts/spawn-confined.sh Linux prefix, and its twin scripts/pi-respawn-nofork.sh, set --setenv SCCACHE_SERVER_UDS /tmp/sccache.sock. This sets an env var; the jail's mounts are unchanged, so the Non-Goal holds. tests/e2e_worker_confinement.rs now runs the shipped prefix with the host address exported and asserts the worker sees its own socket (red, then green). Live, in the prefix's shape: compile succeeds with no host server; with a host server up, it succeeds and that server's Compile requests stays 0. REQ-029's wording goes through the reconcile brief. Uncommitted in ~/dev/doctrine, under CHR-184."""

