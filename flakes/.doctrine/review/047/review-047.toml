Observed: `nix eval path:~/flakes/dev-envs#packages.x86_64-linux.jailed-pi.name` fails: "function 'makeJailedAgent' called with unexpected argument 'nixDoctrine'". dev-envs/flake.lock pins agents at 27f6ca32, which predates PHASE-02 (it still holds /run/doctrine-bin). The override has become mandatory: use_dev_envs, bin/dev-envs-forms and just test all pass it, so nothing green exposes this.

The root flake.lock has the same pin, but its recipes always override agents (tree_override), so it evaluates. flakes has no unpushed commits, so a current pin is available."""
