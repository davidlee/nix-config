note = "Doctrine just gate rc 0; e2e_worker_confinement 4 passed; bwrap_core_argv_matches_spawn_core_flags passed. Live probes in the prefix's shape pass both cases. Not run: a real dispatch worker."

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected one owner per fact (DEC-108); observed a project's devEnv can override the library's SCCACHE_SERVER_UDS unrefused"
detail = """
Expected: checkDevEnv refuses a name the host layers own, and REQ-029 holds for every jail.

Observed: dev-envs/flake.nix passes hostNames = attrNames hostDevEnv.env, which excludes hostOnlyEnv, so SCCACHE_SERVER_UDS is accepted. SPEC-003 § Concerns says "Whether a project's env wins over the library's value is unverified". It is now settled from a built launcher (Doctrine's jailed-shell): SCCACHE_SERVER_UDS is --setenv number 10, the project's LD_LIBRARY_PATH number 14. Project env comes later, and for a repeated bwrap --setenv the last one applies (inference from order; the override itself was not run). A project stating env.SCCACHE_SERVER_UDS would replace the jail's value.

No project does this today."""
disposition = "fix-now"
response = "One owner per fact is DEC-108's rule, and the fix is small: hostNames also takes hostOnlyEnv's names, with a test that the real list refuses SCCACHE_SERVER_UDS. Lands with the F-1 repair; verify after."

[[finding.turn]]
