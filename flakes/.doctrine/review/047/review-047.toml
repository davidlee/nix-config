Observed: ~/.local/share/jail.nix/home/agent/.codex/config.toml now has command = /home/david/.local/share/doctrine/bin/doctrine. Repos with a codex jail, no own bind, no use_dev_envs: satan, satan-attrd, www, org-incremental-writing. Their locks pin older agents revisions; the two checked (19b9740e for satan-attrd, 84efebe6 for satan) bind only /run/doctrine-bin. satan-attrd's re-baked .doctrine/state/pi/extensions/mcp.ts also names the host path.

Inference, not run: if those jails use the shared `agent` home, jailed codex there cannot start Doctrine's MCP server, and jailed pi in satan-attrd cannot either. PHASE-07 verified Doctrine and Smut only.

The design's "six" counted only repos with a bind; it did not consider those without one."""
