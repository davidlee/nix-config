[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "hosts.nix: design sec-6 lists it as changed; the selector registry has it scope-relevant only"
detail = """
Expected: every path in design sec-6 (Code impact) is a design-target selector, so conformance can attribute it.
Observed: `doctrine slice selector list 5` has `hosts.nix` as scope-relevant only. PHASE-03 edited it (coverage."Sleipnir+podman", per design sec-5), so conformance reports it undeclared (after normalising the ISS-005 `flakes/` prefix). The edit is in scope; the registry is incomplete.
"""
disposition = "design-wrong"
response = """
Registry gap, not scope creep: design sec-5 calls for the coverage target and sec-6 lists hosts.nix. Reconcile: `doctrine slice selector add` hosts.nix as design-target (load-bearing; sec-6 already mirrors it). Brief: Per-slice F-1.
"""

[[finding.turn]]
