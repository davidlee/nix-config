[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design sec-3/sec-7 say distrobox stays only as a home package; it also stays in system-path"
detail = """
Expected (design sec-3 podman bullet, sec-7 table podman row): distrobox removed from system packages, remaining only in home (`modules/shared/cli/_packages/dev.nix`).
Observed (notes.md `## PHASE-03`): distrobox stays in system-path, because dev.nix also reaches NixOS through `modules/nixos/cli.nix` (linuxSystem). The removed-package set was one smaller than the design predicted; the gate passed against the corrected expectation. Design prose is wrong, code is right.
"""
disposition = "design-wrong"
response = """
Code and gate are right; the design prose mispredicted. Reconcile edits design.md sec-3 (podman bullet) and sec-7 (podman row): distrobox also reaches system-path via modules/nixos/cli.nix, so it stays in both. Brief: Per-slice F-2.
"""

