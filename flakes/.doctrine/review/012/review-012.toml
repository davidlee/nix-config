[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Design sec-7.4 claims flatpak leaves the system closure when deselected; it leaves system-path only"
detail = """
Expected (design sec-7 check 4; PHASE-04 EX-5): with non-nix-packages.flatpak off, `flatpak` absent from the system closure.
Observed (notes.md `## PHASE-04`): services.flatpak.enable false and flatpak gone from system-path (not installed, not on PATH), but flatpak-1.18.4 stays in the drv closure: its referrers there are plasma-workspace and xdg-desktop-portal, which link it as a library. appimage's control passed outright. The feature is still the only switch for installing flatpak and running its service, which is what the check was for; the check's wording over-claimed. Same shape as PHASE-02's qemu source tarball (notes.md `## PHASE-02`).
"""
disposition = "design-wrong"
response = """
The check over-claimed; behaviour is the intended one (feature is the only install/service switch). Reconcile edits design.md sec-7 check 4: "absent from system-path" for flatpak, noting library referrers keep it in the closure. PHASE-04 EX-5 text is immutable plan criteria and is not edited; its evidence is qualified in notes.md. Brief: Per-slice F-3.
"""

