[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Socket mode applied twice fails at launch, not at evaluation"
detail = """
Expected (design sec-3, GPT F-2/F-5 intent): misuse of socket mode is an evaluation error.
Observed: offline profile + `gateway` (adds gatewaySocketOptions) + `extraOptions = gatewaySocketOptions` evaluates; at launch the second socat fails to bind 127.0.0.1:4000 and the wrapper exits "gateway forwarder exited before listening". Fails closed with a clear message; no committed jail does this (satan's jailed-malebolge has no `gateway`, so it adds the options once).
"""
disposition = "tolerated"
response = """
Fails closed at launch with a named error before the agent runs, so no unsafe state is reachable. The eval guard exists to stop socket mode in a jail sharing the host netns (a real exposure); doubling is a configuration mistake with no consumer (jailed-malebolge has no `gateway`). Deduplicating via jail.nix include-once is cheap to add if a consumer ever needs both paths.
"""

