[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Forwarder readiness and file layout diverge from design sec-3/sec-6: inode tie, reuseaddr, new file, restartTriggers"
detail = """
Expected: design sec-3 sketch: readiness = socat alive AND a 127.0.0.1:<port> LISTEN row in /proc/net/tcp; `gatewayForwarder` inside jailed-agents.nix; sec-6: no agents/flake.nix change; relay change = second listener + ownership.
Observed: (a) readiness also requires the LISTEN row's inode to be one of our socat's fds (a row alone accepts a foreign listener on an occupied port, breaking VT-5b); DEC-076's text says "socat PID + /proc/net/tcp" without the inode tie. (b) the sketch already had reuseaddr; fine. (c) gatewayForwarder lives in new agents/gateway-forwarder.nix (needed to test it on its own socket/port). (d) agents/flake.nix gained `impureChecks`, justfile gained the impure build (PHASE-05). (e) features/agents/gateway.nix gained `restartTriggers` on llm-gateway-relay (PHASE-04 live finding; NixOS#74899).
"""
disposition = "design-wrong"
response = """
Each divergence is the better reading and is covered by tests (VT-5b occupied port with mutation check; restartTriggers proven live). Brief: design sec-3 readiness gains the inode tie and the file location; sec-6 lists gateway-forwarder.nix and the relay restartTriggers; sec-2 gains the switch precondition from F-1; DEC-076 amended to say readiness requires the LISTEN row to belong to our socat's fd.
