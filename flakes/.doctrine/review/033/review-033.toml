[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "README relay-restart fallback is unsafe: expected a recovery that works in any state; observed it breaks the relay when the service runs"
detail = """
Expected: README § LLM gateway "Relay restart" gives recovery commands that are safe whatever the relay's state.
Observed (d1275a3e): it said `sudo systemctl restart llm-gateway-relay.socket` applies a listener change. Live 2026-10-20 01:55:45 that command, run while llm-gateway-relay.service was active, was refused ("Socket service ... already active, refusing") and left the socket inactive with the service holding the fds. switch-to-configuration-ng (main.rs handle_modified_unit) adds the socket to stop/start only if `active_cur.contains_key(socket)`; with the socket inactive, the subsequent dry-activate showed "would stop: llm-gateway-relay.service" and nothing to start: the switch would have left :4000 and the client socket dead.
Also undocumented: restartTriggers only fire when the service is active at the switch (a stopped service is skipped; dry-activate after stopping it listed nothing).
"""
disposition = "fix-now"
response = """
Fixed in this audit (commit following d1275a3e; see git log RV-033 F-1): README "Relay restart" now states the precondition (service and socket active at the switch), says to wake the relay with a keyless curl before switching, tabulates the three pre-switch states and what the switch does in each, and limits `systemctl restart <socket>` to a stopped service. Proven live 2026-10-20 02:04:22-23: with the service woken first, the switch stopped service and socket and started the socket (notes.md "Live: relay restartTriggers"). The precondition also goes into design.md via the brief.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

