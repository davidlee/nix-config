title = "NaN or negative budget/spend disables or corrupts limits"
detail = "Adversarial pass: no constraint on budget_usd/spent_usd and no CLI validation; a NaN budget makes spent >= budget false forever. Fix: reject nonfinite and negative values in CLI and keystore; CHECK constraints; tests for malformed budgets and costs."
