status = "verified"
severity = "minor"
title = "Nothing creates the creds directory before first encryption"
detail = "Adversarial pass: StateDirectory creates /var/lib/llm-gateway only; the credentials step writes to creds/ and fails on first run. Fix chosen: use systemd's own /etc/credstore.encrypted (root 0700, created by systemd tmpfiles, present on Sleipnir) and LoadCredentialEncrypted by name."
disposition = "fix-now"
response = "sec-2/sec-4: credentials live in systemd's /etc/credstore.encrypted (root 0700, created by systemd tmpfiles, present on Sleipnir); LoadCredentialEncrypted by name. DEC-048 choice updated."

