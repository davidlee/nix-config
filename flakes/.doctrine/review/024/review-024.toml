[[finding]]
id = "F-6"
status = "answered"
severity = "major"
title = "issue --out has no failure rule: a live key can be orphaned"
detail = "Second adversarial pass: if the unprivileged parent fails to write after the child issued the key, the DB holds a live key nobody holds. Fix: --out only in the parent, preflight destination, atomic 0600 write, revoke on failure; tests for existing destination and failed write."
disposition = "fix-now"
response = """
Fixed in design sec-4 (--out only in the unprivileged parent; preflight; atomic 0600 temp write and rename; revoke on failure). Route control. The concrete incorrect candidate the check must reject: an issue --out that issues the key, fails to write the file, and leaves the key live in keys.db; and one that overwrites an existing key file. Criterion: a test with the privileged step stubbed in-process injects a write failure after issue and asserts the key is revoked and no file remains, and asserts an existing destination is refused before any key is issued; a successful run leaves a 0600 file holding the key. Host phase constraint: the phase that builds the admin CLI.
"""
route = "control"

