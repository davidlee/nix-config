[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "Missing searched credential is not fatal; start refusal claim unproven"
detail = "Second adversarial pass: systemd.exec documents cases where a LoadCredentialEncrypted lookup failure is not fatal, so 'systemd refuses to start and names the missing credential' is not guaranteed. Fix: absolute path in LoadCredentialEncrypted, and the launcher checks every required credential and fails with a clear message."
disposition = "fix-now"
response = "sec-2: absolute path deepseek:/etc/credstore.encrypted/llm-gateway.deepseek; launcher checks each configured credential in CREDENTIALS_DIRECTORY and exits naming the missing one and 'just gateway-credentials'. sec-6 VH step 1 reads the launcher's journal message."

