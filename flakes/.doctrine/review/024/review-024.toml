severity = "major"
title = "Missing searched credential is not fatal; start refusal claim unproven"
detail = "Second adversarial pass: systemd.exec documents cases where a LoadCredentialEncrypted lookup failure is not fatal, so 'systemd refuses to start and names the missing credential' is not guaranteed. Fix: absolute path in LoadCredentialEncrypted, and the launcher checks every required credential and fails with a clear message."
disposition = "fix-now"
response = """
Fixed in design sec-2 (absolute LoadCredentialEncrypted path; launcher checks each configured credential). Route control. The concrete incorrect candidate the check must reject: a launcher that starts uvicorn when a configured provider credential file is absent from CREDENTIALS_DIRECTORY (or the directory is unset), leaving the provider key empty. Criterion: a test runs the launcher's credential check with the deepseek credential missing and asserts a non-zero exit whose message names the missing credential and just gateway-credentials, and asserts the present case loads it into DEEPSEEK_API_KEY. VH step 1 confirms the journal message on Sleipnir. Host phase constraint: the phase that builds the launcher, with the VH after the service phase.
"""
