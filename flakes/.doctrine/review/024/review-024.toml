status = "answered"
severity = "major"
title = "NaN or negative budget/spend disables or corrupts limits"
detail = "Adversarial pass: no constraint on budget_usd/spent_usd and no CLI validation; a NaN budget makes spent >= budget false forever. Fix: reject nonfinite and negative values in CLI and keystore; CHECK constraints; tests for malformed budgets and costs."
disposition = "fix-now"
response = """
Fixed in design sec-3 (usd parser, CHECK constraints, record_spend counting bad costs as 0). Route probe. Must hold against malformed money arriving through the CLI (budget arguments) and through any keystore write (issue, set_budget, record_spend): NaN, positive and negative infinity, negative numbers, and non-numeric strings never land in budget_usd or spent_usd, and a key whose budget is spent is always refused. Need not hold against someone editing keys.db directly as the llm-gateway user, beyond the CHECK constraints refusing negative values. Criterion: keystore-test feeds each malformed value to every write path and asserts refusal or zero spend, and asserts a direct negative write is refused by the CHECK. Host phase constraint: the phase that builds keystore.py and keystore-test.
"""
