response = "sec-4: --out handled only by the unprivileged parent: preflight (no existing destination, writable dir, keys dir 0700), atomic 0600 temp+rename, revoke the issued key through the child on failure. sec-6 P1/P3 tests: existing destination refused; failed write revokes."

