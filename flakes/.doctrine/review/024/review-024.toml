[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Two adversarial passes (GPT gpt-6-sol, read-only) over design.md, the DECs and LiteLLM 1.100.1 source. Pass 1: F-1..F-4. Pass 2: confirmed F-1..F-3, raised F-5..F-7, and found sound: pre-call hook invocation, custom_auth without master key, hash pass-through to user_api_key_hash, Nix default, relay group access, credential readability. Not independently cleared: the sudo re-exec path beyond F-6, and hardening options other than @system-service against CPython/uvicorn (left to P3 verification)."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-011"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Unauthenticated LiteLLM routes bypass custom_auth"
detail = "Adversarial pass (GPT gpt-6-sol), verified: /health/liveness (health_endpoints/_health_endpoints.py:1813) and /public/model_hub (public_endpoints/public_endpoints.py:208, one of 12 public routes) have no auth dependency in 1.100.1, so the custom_auth route allow-list (design § Key store) cannot refuse them on a host-wide relay. Fix: path+method allow-list at the ASGI boundary in front of LiteLLM; test unauthenticated requests to permitted and excluded paths against 1.102.1."
disposition = "fix-now"
response = "Verified in 1.100.1. Design sec-3: route gate (ASGI wrapper) in front of LiteLLM passes only POST /chat/completions and GET /models (± /v1), 404 otherwise; route check removed from custom_auth. sec-6 P2 tests unauthenticated /health/liveness, /public/model_hub and an admin route."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified in 1.100.1. Design sec-3: route gate (ASGI wrapper) in front of LiteLLM passes only POST /chat/completions and GET /models (± /v1), 404 otherwise; route check removed from custom_auth. sec-6 P2 tests unauthenticated /health/liveness, /public/model_hub and an admin route."

