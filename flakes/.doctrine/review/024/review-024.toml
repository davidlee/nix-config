[[finding]]
id = "F-2"
status = "answered"
severity = "major"
title = "Spend check fallback bypasses the production pricing path"
detail = "Adversarial pass: stubbing cost via model_info (design § Phases) tests a different path; production DeepSeek could return None and count 0. Fix: require positive response_cost through the production model mapping and packaged price map; if mock_response cannot, a separately labelled adapter test; VH requires positive spend."
disposition = "fix-now"
response = """
Fixed in design sec-6. Route control. The concrete incorrect candidate the check must reject: a pricing path where response_cost reaches the success callback as None or 0 for the production model mapping deepseek/deepseek-v4-flash, so spend never accrues. Criterion: the spend case drives a served request through the production mapping and packaged price map and asserts spent rises by a positive amount; as a negative control, the same case run with a model that has no price entry (or a callback fed a zero cost) must fail the assertion. If mock_response does not take the production pricing path, the separately named adapter test carries this control and VH step 7 carries the production claim. Host phase constraint: the phase that builds gateway_hooks and the flake check.
"""
