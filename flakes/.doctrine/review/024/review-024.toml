[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Unauthenticated LiteLLM routes bypass custom_auth"
detail = "Adversarial pass (GPT gpt-6-sol), verified: /health/liveness (health_endpoints/_health_endpoints.py:1813) and /public/model_hub (public_endpoints/public_endpoints.py:208, one of 12 public routes) have no auth dependency in 1.100.1, so the custom_auth route allow-list (design § Key store) cannot refuse them on a host-wide relay. Fix: path+method allow-list at the ASGI boundary in front of LiteLLM; test unauthenticated requests to permitted and excluded paths against 1.102.1."
disposition = "fix-now"
response = """
Fixed in design sec-3 (route gate, an ASGI wrapper in front of LiteLLM passing only POST /chat/completions and GET /models, with or without /v1, 404 otherwise). Route probe. Must hold against any local process that can reach the relay on 127.0.0.1:4000 or the socket without a valid key: every other path and method, including /health/liveness, the /public routes, admin and key-management routes, path variants (trailing slash, double slash, percent-encoding, case) and other methods on the allowed paths, gets 404 without reaching LiteLLM. Need not hold against root or a member of the llm-gateway group, who can read keys.db directly. Criterion: the integration check, against the LiteLLM the system nixpkgs ships, sends those requests unauthenticated and asserts 404 for each, and asserts the two allowed routes still reach custom_auth (401 without a key). Host phase constraint: the phase that builds gateway_hooks and the flake check.
"""
route = "probe"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified in 1.100.1. Design sec-3: route gate (ASGI wrapper) in front of LiteLLM passes only POST /chat/completions and GET /models (± /v1), 404 otherwise; route check removed from custom_auth. sec-6 P2 tests unauthenticated /health/liveness, /public/model_hub and an admin route."

[[finding.turn]]
