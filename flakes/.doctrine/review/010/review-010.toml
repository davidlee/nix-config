[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "PHASE-06 should run the documented cut-over; observed out-of-order switch, recovery exercised for real, documented step 2 never run"
detail = """
Expected (design sec-4, PHASE-06 EX-2/EX-3): build both, activate prebuilt system via `nix-env -p … --set` + `result-darwin/activate`, then `result-home/activate`; then a deliberate switch-generation and re-switch.
Observed (notes PHASE-06): the user ran `just darwin-switch` first, so home packages left PATH before a home existed; the home build then failed on atuin (ISS-007); `darwin-rebuild --switch-generation` restored login (the last-resort path, unplanned). Completion: `just host=Draupnir darwin-switch` then `./result-home/activate` from the rolled-back generation. EX-1..EX-3 met (user-confirmed, VH-1), but the documented step 2 (manual nix-env/activate) and the step-2-failure path were never executed.
Bearing: the procedure is one-time and its only target, Draupnir, is now cut over.
"""
disposition = "tolerated"
response = """
Tolerated: the VH criteria (PHASE-06 EX-1..EX-3) are met and user-confirmed; the out-of-order run demonstrated the real failure the design guarded against (RV-009 F-4) and its last-resort recovery, which is stronger evidence for that path than a staged rollback. The unexecuted manual step 2 is a one-time procedure whose only target is already cut over; re-staging it would mean deliberately breaking the working Mac. Accepted risk: if a second darwin host is ever cut over from embedded HM, step 2 is unproven as written.
"""

