[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "A client can replace the configured provider adapter"
detail = """
Design sections: sec-1, sec-2, sec-3, sec-6.

Expected: each configured deployment has one provider and therefore one cost source. design.md:105-109 protects config model/api_key against params overrides, but that config merge does not constrain subsequent client kwargs.

Evidence: litellm/router.py:3580-3590 builds acompletion arguments with request kwargs last. litellm/main.py:493 reads custom_llm_provider from kwargs. litellm/litellm_core_utils/get_llm_provider_logic.py:191-205 honors that supplied provider rather than the configured OpenRouter prefix. custom_llm_provider is absent from the banned request-field tuple at litellm/proxy/auth/auth_utils.py:299-379. The OpenAI default base is selected by litellm/main.py:1033-1044. features/agents/gateway/gateway_hooks.py:97-112 does not forbid provider switches.

Probe: /tmp/codex-sl014/probe2.py and probe2.log. "custom_llm_provider":"openai" passes the exact model gate and returns 200 against the same loopback api_base. The upstream body loses usage.include, model becomes openrouter/local/unmapped, and the success callback reports provider=openai and response_cost=0.0 instead of provider=openrouter and 0.0123. A separate pure get_llm_provider call, with sockets blocked and no api_base, resolves openrouter/z-ai/glm-5.3-flash to openrouter normally, but to openai when that client field is set. No real provider received a request. The fake accepts all model strings; a real provider may reject the changed model string, so this is not evidence every such call is billable.

Failure scenario: a client switches an OpenRouter deployment to a different adapter despite the build admitting it on reportsCost. With the production config lacking api_base, that can change the default destination; with a pinned OpenRouter-compatible api_base it bypasses OpenRouter's usage/cost transform, as probed. This violates server ownership of routing and invalidates the cost-source proof even when model/api_key remain unchanged in config.

Fix: reject client custom_llm_provider (including accepted fallback and passthrough forms), or pin the adapter from server-owned deployment configuration after all request merges. Treat adapter/endpoint/credentials and cost source as one server-owned configuration. Add an end-to-end client-provider override negative test; do not broaden allow_client_side_credentials to make fake-upstream tests work, since configured params.api_base already works.
"""
disposition = "fix-now"
route = "review"
response = "Verified: probe2.log cases and the cited LiteLLM lines (router.py kwargs last; litellm_logging.py:838-853 spreads optional_params over litellm_params). Fixed by DEC-073 (user chose allow-list at route_gate): new sec-9 Request body guard refuses every top-level field off ALLOWED_FIELDS with a 400 before LiteLLM sees the body; sec-1 no longer claims run time unchanged; sec-6 adds unit and end-to-end twins that refuse each probed bypass body with no upstream traffic and no spend change, plus client-body fixtures; sec-8 lists gateway_hooks.py. custom_llm_provider is off the list. Predates SL-014; in scope by the user's choice."

