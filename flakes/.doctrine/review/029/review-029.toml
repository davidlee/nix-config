role = "raiser"
note = "Verified at design level: sec-3 now wraps every generated model entry with checkPrices, independently of needsMap. Local offline Nix probe of the revised predicate and entry composition rejects mapped, unmapped and reportsCost half-prices, plus output-only, while accepting both/neither. Sec-6 includes the required negative twins."

[[finding]]
id = "F-4"
status = "verified"
severity = "blocker"
title = "Client litellm_params erases the ledger key identity"
detail = """
Design sections: sec-1, sec-6, sec-8.

Expected: design.md:18-20 retains the ledger unchanged, and design.md:276 explicitly excludes gateway_hooks.py changes. Every successful billed request must accrue to the authenticated key.

Evidence: features/agents/gateway/gateway_hooks.py:123-127 trusts kwargs.litellm_params.metadata.user_api_key_hash and skips charging when absent. litellm/litellm_core_utils/litellm_logging.py:838-853 constructs model_call_details with its internal litellm_params, then spreads optional_params over it; a caller-supplied litellm_params entry can overwrite that field. litellm/proxy/auth/auth_utils.py:522-531 checks only banned fields inside litellm_params.metadata, rather than rejecting the client container. The normal metadata spoof test at features/agents/gateway/gateway-test:426-432 does not cover this path.

Probe: /tmp/codex-sl014/probe2.py and probe2.log. Adding only "litellm_params":{} to an otherwise normal request returns 200; fake OpenRouter still reports cost 0.0123; the success callback receives cost=0.0123 but has_hash=False. Ledger logs "spend not recorded: no key hash in the success payload" and spend remains unchanged. A normal metadata hash/alias spoof is a CLEAN negative control: the authenticated hash survives and the caller is charged. No real credential was used.

Failure scenario: a valid client includes the empty internal SDK container on every call. Real provider cost is known, but none is attributed to its key, so the lifetime budget is bypassed independently of provider usage suppression.

Fix: reject client-supplied internal litellm_params at the pre-call boundary (including nested passthrough/fallback locations), before LiteLLM logging merges. An explicit client-body allow-list should exclude it. Alternatively carry ledger identity through a proven server-owned callback channel that client optional params cannot replace. Add an end-to-end negative twin with the empty object and verify refused/no upstream traffic, or charged correctly if sanitization is chosen.
"""
disposition = "fix-now"
route = "review"
response = "Verified: probe2.log cases and the cited LiteLLM lines (router.py kwargs last; litellm_logging.py:838-853 spreads optional_params over litellm_params). Fixed by DEC-073 (user chose allow-list at route_gate): new sec-9 Request body guard refuses every top-level field off ALLOWED_FIELDS with a 400 before LiteLLM sees the body; sec-1 no longer claims run time unchanged; sec-6 adds unit and end-to-end twins that refuse each probed bypass body with no upstream traffic and no spend change, plus client-body fixtures; sec-8 lists gateway_hooks.py. litellm_params is off the list. Predates SL-014 (deepseek-flash); the user put the fix in scope."

