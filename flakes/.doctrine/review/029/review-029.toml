[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "Credential staging causes an avoidable gateway outage"
detail = """
Design section: sec-7.

Expected: design.md:250-254 says the old unit keeps serving until switch if credentials do not restart, and otherwise calls the old-config restart "harmless". The implementation already determines which case applies.

Evidence: features/agents/gateway/llm-gateway:308-312 documents the unconditional restart, :339 invokes it, and :347-355 executes systemctl restart llm-gateway and then polls for its socket. The same file:54-57 documents approximately 25 seconds for LiteLLM startup. features/agents/gateway.nix:131-151 runs a single gateway process with RuntimeDirectory; the socket relay does not keep that process alive during restart. The direct credentials CLI itself restarts; this is not an extra justfile action.

Failure scenario: rollout step 2 successfully stages the new providers, then stops the working old DeepSeek gateway while it imports/restarts LiteLLM. Requests during that interval fail, and in-flight calls can be interrupted. Step 3 can restart it again with the new unit. Credentials-first still avoids the missing-credential outage; it does not provide uninterrupted service.

Fix: state the expected restart interruption and schedule rollout accordingly. If uninterrupted old-config serving through staging is intended, add an explicit staging/no-restart mode and use it before the switch; that is an explicit CLI/test change rather than an assumption for phase planning. The new-build CLI path is otherwise feasible: credentials runs as the invoking user (main's credentials branch precedes as_service), with baked new PROVIDERS and the same credstore, while privilege is applied to encrypt/move/restart operations.

Confirmed by reading; no live service or credential commands were run.
"""
disposition = "fix-now"
response = "Verified: credentials() ends in restart() unconditionally (llm-gateway:339). sec-7 now states the two ~25 s outages (step 2 on the old config, step 3) and says to roll out with no client mid-request. No no-restart staging mode: not worth a CLI path for a one-off rollout."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = "Verified: credentials() ends in restart() unconditionally (llm-gateway:339). sec-7 now states the two ~25 s outages (step 2 on the old config, step 3) and says to roll out with no client mid-request. No no-restart staging mode: not worth a CLI path for a one-off rollout."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Verified by reading: sec-7 now explicitly documents the credential command restarting the old unit, both approximately 25-second interruption windows and interrupted in-flight requests, with rollout scheduled when no client is mid-request. This matches llm-gateway:339 and :347-355. The design accepts the documented interruption rather than adding a staging mode."

