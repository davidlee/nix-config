[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "OpenRouter body overrides bypass the exact model gate"
detail = """
Design sections: sec-1, sec-2, sec-6, sec-8.

Expected: design.md:18 says "The model gate is still an exact match"; DEC-065 keeps each key restricted to explicitly served models. design.md:276 leaves gateway_hooks.py unchanged.

Evidence: features/agents/gateway/gateway_hooks.py:97-112 checks only data.model and LiteLLM fallback targets. litellm/llms/openrouter/chat/transformation.py:70-81 forwards models/route; :164-166 merges extra_body over the generated request, including model. These fields are not gateway fallback targets.

Probe: /tmp/codex-sl014/probe2.py, results in probe2.log (local fake HTTP upstream, dummy credential, non-loopback connections blocked). With allowed gateway model openrouter/unmapped-local, models=["forbidden/upstream"], route="fallback" returns 200 and sends those fields upstream. extra_body={"model":"forbidden/upstream"} returns 200 and the fake receives model="forbidden/upstream". The pre-call hook logs the permitted gateway name in both cases. This proves request-body escape from the gate; the fake does not simulate OpenRouter's routing decisions.

Failure scenario: a key allowed one cheap OpenRouter model submits that name to pass authentication, then substitutes another upstream model with extra_body.model or supplies provider-side fallback models. The exact served-model/key model-list policy no longer constrains the billed model.

Fix: add an explicit pre-call validation step, resolved against server-owned deployment/provider configuration, that rejects models, route and model overrides in extra_body for OpenRouter requests. Preserve the intentionally supported provider sorting object and reasoning_effort. Validate fallback request dictionaries as well. Add negative end-to-end twins proving refusal before the fake receives a request.

Policy choice: a client-body allow-list, with narrowly allowed nested extra_body keys, is stronger against future adapter features than an ever-growing deny-list, but needs deliberate updates for new OpenAI features. A narrow deny-list is viable for this slice only if it also handles usage/stream_options overrides and internal SDK fields (the separate findings), including nested/fallback locations. Do not apply the client restriction to trusted configuration params.api_base needed by the test.
"""
disposition = "fix-now"
route = "review"
response = "Verified: probe2.log cases and the cited LiteLLM lines (router.py kwargs last; litellm_logging.py:838-853 spreads optional_params over litellm_params). Fixed by DEC-073 (user chose allow-list at route_gate): new sec-9 Request body guard refuses every top-level field off ALLOWED_FIELDS with a 400 before LiteLLM sees the body; sec-1 no longer claims run time unchanged; sec-6 adds unit and end-to-end twins that refuse each probed bypass body with no upstream traffic and no spend change, plus client-body fixtures; sec-8 lists gateway_hooks.py. extra_body, models and route are off the list."

