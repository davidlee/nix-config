[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The price predicate admits half-priced mapped models"
detail = """
Design sections: sec-3 and sec-6.

Expected: .doctrine/slice/014/design.md:120-121 promises "A params that sets only one of the two prices is an evaluation error naming the model".

Evidence: design.md:115-117 computes priced as input-present AND output-present, then sends false cases to the packaged map. There is no assertion rejecting unequal presence. features/agents/gateway/price-check.py:13-17 tests only model-id membership. A mapped direct model therefore passes; a reportsCost provider short-circuits the map check altogether.

Probe: evaluated the exact shown predicates with nix eval --offline --json, using deepseek/deepseek-flash and params.input_cost_per_token=0 without an output price. Result: {"evaluatedWithoutError":true,"halfPriced":false,"needsMap":true}. Ran the unchanged price-check.py on deepseek/deepseek-flash with the supplied Python environment: exit 0. Thus both stages succeed instead of the promised evaluation error.

Failure scenario: an operator adds only one explicit price to a model already in the map. The build succeeds, preserving a partial custom-price configuration the design explicitly says it rejects. The proposed negative twin only using an unmapped id can miss this case because map failure would mask the missing evaluation guard.

Fix: separately assert, for every served model, that input/output price fields are either both present or both absent, naming the gateway model on failure. Force that validation independently of needsMap, including reportsCost providers. Then perform the cost-source disjunction. Add mapped and unmapped half-price tests and a reportsCost half-price twin.
"""
disposition = "fix-now"
route = "review"
response = "Verified by reading sec-3: priced was an AND with no assertion. Fixed in sec-3: checkPrices asserts both-or-neither for every model where its config.yaml entry is built, so it runs whatever the cost source; needsMap uses the same field list. sec-6 refuses half-priced mapped, unmapped and reportsCost twins."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Verified by reading sec-3: priced was an AND with no assertion. Fixed in sec-3: checkPrices asserts both-or-neither for every model where its config.yaml entry is built, so it runs whatever the cost source; needsMap uses the same field list. sec-6 refuses half-priced mapped, unmapped and reportsCost twins."

[[finding.turn]]
