[[finding]]
id = "F-2"
status = "verified"
severity = "blocker"
title = "Client usage overrides disable OpenRouter budget accounting"
detail = """
Design sections: sec-1, sec-3, sec-6, sec-8.

Expected: design.md:18-21 relies on response_cost from OpenRouter usage.cost and leaves runtime unchanged. DEC-068 allows genuinely free/missing provider costs to warn and count zero; it does not authorize clients to disable cost reporting.

Evidence: litellm/llms/openrouter/chat/transformation.py:164-171 applies extra_body first, then adds usage.include=true only when usage is absent. :212-226 extracts usage.cost only if returned. features/agents/gateway/gateway_hooks.py:128-137 records the resulting cost; features/agents/gateway/keystore.py:119-136 counts zero or unusable costs as zero. For streaming, litellm/proxy/common_request_processing.py:448-475 forces top-level include_usage=true, but the later OpenRouter extra_body merge can replace that object again.

Probe: /tmp/codex-sl014/probe2.py and probe2.log. The fake returns cost 0.0123 when usage is requested. Baseline records 0.0123. extra_body={"usage":{"include":false}} reaches upstream unchanged; the fake omits its cost, success callback reports 0.0 and spend does not increase. A streamed request with extra_body={"stream_options":{"include_usage":false}} likewise reaches upstream unchanged; the fake omits its final usage chunk, callback reports 0.0 and spend does not increase. Plain top-level stream_options.include_usage=false is a CLEAN negative control: LiteLLM forces it true and records 0.0123. The fake models the provider withholding requested usage; no claim is made from a live provider call.

Failure scenario: a client repeatedly buys completions on an unmapped/alias OpenRouter deployment while suppressing provider usage. The key never accumulates spend and its lifetime budget never trips.

Fix: enforce usage reporting after all client merges, or reject client usage/stream_options overrides at every accepted location (especially extra_body); streaming must retain a provider usage chunk regardless of client display preferences. Add both bypass bodies and the top-level negative control to the fake-upstream ledger tests. Preserve DEC-068 for real provider-side zero/missing cost; prevent clients from manufacturing it.
"""
disposition = "fix-now"
route = "review"
response = "Verified: probe2.log cases and the cited LiteLLM lines (router.py kwargs last; litellm_logging.py:838-853 spreads optional_params over litellm_params). Fixed by DEC-073 (user chose allow-list at route_gate): new sec-9 Request body guard refuses every top-level field off ALLOWED_FIELDS with a 400 before LiteLLM sees the body; sec-1 no longer claims run time unchanged; sec-6 adds unit and end-to-end twins that refuse each probed bypass body with no upstream traffic and no spend change, plus client-body fixtures; sec-8 lists gateway_hooks.py. extra_body and usage are off the list; top-level stream_options stays, LiteLLM forces include_usage (the probe's clean control, now a VT). DEC-068 unchanged for provider-side zero cost."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Verified: probe2.log cases and the cited LiteLLM lines (router.py kwargs last; litellm_logging.py:838-853 spreads optional_params over litellm_params). Fixed by DEC-073 (user chose allow-list at route_gate): new sec-9 Request body guard refuses every top-level field off ALLOWED_FIELDS with a 400 before LiteLLM sees the body; sec-1 no longer claims run time unchanged; sec-6 adds unit and end-to-end twins that refuse each probed bypass body with no upstream traffic and no spend change, plus client-body fixtures; sec-8 lists gateway_hooks.py. extra_body and usage are off the list; top-level stream_options stays, LiteLLM forces include_usage (the probe's clean control, now a VT). DEC-068 unchanged for provider-side zero cost."

