[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "First-mount seed follows jail-planted symlinks on the host"
detail = """
Reviewer: Codex gpt-6-sol (read-only), adversarial lane. Section sec-3.
Claim: the first-mount seed lets a jail-controlled path trigger a host-side write. The -e check and the redirection follow symlinks, and there is a race between check and open.
Evidence: design.md:246-250 seeds with [ -e "$f" ] || ... > "$f"; jail.nix add-runtime runs on the host before bwrap (lib/combinators/add-runtime.nix:5).
Failure scenario: a jail replaces models.json in the persisted home with a dangling symlink to a host file it cannot otherwise write; the next launch follows the link and creates or truncates that host file.
Suggested repair: refuse symlinks and validate path components, or move the initialisation out of the launcher.
"""
disposition = "fix-now"
route = "review"
response = """
Confirmed by reproduction: the seed line as written, run against a dangling symlink at models.json, created the symlink target on the host. With noclobber (set -C) the write is refused, but a symlinked parent directory would still let the jail choose where a new file lands. User chose (2026-10-17) to drop the seed rather than harden it: no host-side write on a jail-writable path remains. sec-3 First mount now explains why there is no seed. The one home lacking the file today, agent-research, gets a tracked {"providers":{}} models.json in the home repo (user, 2026-10-17: just commit the file, it has no secrets); sec-5 step 4 and its files table, sec-6 (seed test and no-seed expectations removed), sec-7 (profileHomes map and seed dropped from jailed-agents.nix; new tracked file listed) and slice scope item 5 updated. A later new home shows only pi's cosmetic empty-file warning in non-gateway jails. Route review: the remaining question is accepting that commitment, settled in prose.
"""

