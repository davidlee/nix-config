[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "One-list invariant overclaimed across root and locked agents"
detail = """
Reviewer: Codex gpt-6-sol (read-only), adversarial lane. Section sec-2.
Claim: the one-list invariant does not hold across the root and a locked agents input; the design acknowledges they can differ but provides no check before activation.
Evidence: design.md:120-125 describes the relative import and the input import; design.md:132 says the served and pi model sets cannot drift. The service reads its models at features/agents/gateway.nix:125.
Failure scenario: a root change adds a served model while a consumer's inputs.agents stays locked to the earlier revision; the service offers a model absent from that jail's pi catalogue.
Suggested repair: require a lock or model-set equality check at cutover; qualify the invariant as holding for matching revisions.
"""
disposition = "fix-now"
route = "review"
response = """
Observation partly right: sec-2 said the two model sets cannot drift without qualification. Prescription not taken: the root always reads agents from its own tree (justfile tree override), out-of-tree drift until re-lock was already stated in sec-2 with the existing re-lock rule, and a mismatch fails safe because the gateway checks every request against the key's own model list. An equality check would be machinery the impact does not justify. Repair in prose: the invariant now holds within one revision of agents, and the lag window and its fail-safe are stated. Route review.
"""

