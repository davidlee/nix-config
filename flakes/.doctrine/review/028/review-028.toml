[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "pi key recovery omits consumer update and order"
detail = """
Reviewer: Codex gpt-6-sol (read-only), adversarial lane. Section sec-5.
Claim: the stated recovery for a lost or leaked pi key is incomplete: issuing a new alias also requires updating every consumer's key path and rebuilding or reloading its launcher.
Evidence: design.md:427-430 says recovery is issuing a new alias and revoking the old one; design.md:101-103 makes the client name part of keyFile; the gateway CLI refuses to overwrite an existing --out file (features/agents/gateway/llm-gateway:269).
Failure scenario: pi is revoked and a new alias issued, but an Emacs or doctrine launcher still reads keys/pi and cannot start.
Suggested repair: specify the consumer update and activation order before revoking the old alias.
"""
disposition = "fix-now"
response = """
Failure scenario does not hold: README section LLM gateway, Rotation, writes the new alias's key into the same keys/<client> file (move the old aside, issue with --out, revoke), so no consumer key path changes. The root cause is real: sec-2's comment said the client name is the ledger alias, which invites the reading. Repaired: sec-2 comment now says the file keeps the client name while a rotation re-issues the key under a new alias into it; sec-5 recovery spells out the rotation steps and that consumers pick the key up at next launch.
"""

