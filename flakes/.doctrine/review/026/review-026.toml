3. sec-2 / sec-3: two callbacks (model_gate, ledger) with 401 (key) / 403 (model), not the single-ledger YAML; `authenticate` raises Refused rather than returning None.
4. Served models: sec-2 YAML (:77-80), sec-4 first-run example (:206) and sec-6 F-2 (:291) name deepseek-v4-pro/flash; the gateway serves only deepseek-flash (user direction, b544a5f5).
5. sec-5: `gateway` takes `{ keyFile; url; runDirectory; }` (runDirectory added: agents/ is a published flake and cannot import gateway constants); gateway + `offline` profile is not refused.
6. sec-6 VH-4: eca's config.json is untracked and hand-edited; home-switch only changes the jailed-eca wrapper.
7. sec-4 / DEC-051 consequence: a revoked alias is never reissued; rotation = new alias (user ruling 2026-10-17).
