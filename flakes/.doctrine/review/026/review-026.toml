[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "POL-001 r5: expected no path able to emit a bearer key; observed LiteLLM's auth-failure path carries the raw key, unhashed because ours lack the sk- prefix"
detail = """
Expected: POL-001 r5 — logs/telemetry never carry a client key.
Observed (LiteLLM 1.102.1): on an auth failure, LiteLLM builds `UserAPIKeyAuth(api_key=<raw key>)` and hands it to `post_call_failure_hook` and OTEL `seed_request_identity` (`proxy/auth/auth_exception_handler.py:172-197`). Its "hash logged keys" guard (`proxy/_types.py:3153-3176`) hashes only `sk-`-prefixed or JWT keys; ours come from `secrets.token_urlsafe` (`keystore.py:~83`) and stay raw.
Latent: no failure callbacks are configured, OTEL is off, and our hooks do not implement the failure hook — nothing emits it today. Adding any logger/OTEL exposes it.
"""
disposition = "fix-now"
response = """
Code fix in reconcile: issue keys as `sk-<token_urlsafe>` so LiteLLM's own guard hashes them on every logging/failure path. The worker must first confirm in LiteLLM 1.102.1 that an `sk-` key still goes only through our custom_auth (no master-key or DB lookup path) and that the stored sha256 matches what reaches the hooks; else stop and escalate. Existing keys (eca-2) keep working, since only the hash is stored. Test: issued keys carry the prefix; auth path unchanged.
"""

