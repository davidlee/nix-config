[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "credentials: expected a failed op read to leave the stored credential intact; observed systemd-creds encrypt overwrites it with empty input"
detail = """
Expected: a cancelled or failed `op read` (e.g. a dismissed 1Password unlock during rotation) leaves `/etc/credstore.encrypted/llm-gateway.<p>` as it was.
Observed: `features/agents/gateway/llm-gateway` `credentials()` (~:294-317) pipes `op read` stdout straight into `sudo systemd-creds encrypt … - <CREDSTORE>/llm-gateway.<p>`, which writes the target in place; exit codes are checked only after both finish. On op failure, encrypt consumes empty stdin and replaces the working credential. The CLI then prints "op read failed; service not restarted", implying no harm; the running service keeps its old key until the next restart/reboot, which then starts with an empty key (see the empty-credential finding).
Test gap: `keystore-test` (~:525) asserts the restart is skipped, not that the stored file is preserved.
Read by the seat (code), not reproduced live (needs root).
"""
disposition = "fix-now"
response = """
Code fix in reconcile: `credentials` encrypts to a temporary path in the credstore and renames over the target only when both `op read` and `systemd-creds encrypt` succeed; a failure removes the temp file and leaves the stored credential untouched. Test: a failing op read must leave the existing credential file byte-identical (fake host seam).
"""

