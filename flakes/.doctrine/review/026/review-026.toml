[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "model gate: expected only a key's listed models to be served (DEC-051); observed it checks data[model] only while the Router honours per-request fallbacks"
detail = """
Expected: DEC-051 — a key reaches only the models on its list.
Observed: `gateway_hooks.py` `ModelGate` (~:266-273) checks `data["model"]` only. LiteLLM's Router reads a per-request `fallbacks` list (`litellm/router.py:2842, 7588, 7695`, `kwargs.get("fallbacks")`), so a request for an allowed model with `fallbacks: [<other configured model>]` can be served by a model not on the key's list when the first fails.
Not exercised. Today only one model is configured, so nothing is reachable through it; it becomes a real bypass once more models are added (IMP-029).
"""
disposition = "fix-now"
response = """
Code fix in reconcile: ModelGate refuses (403) any request that names a model outside the key's list by any route the Router honours: `fallbacks`, `context_window_fallbacks`, `content_policy_fallbacks`, `model_list` / `router`-level overrides. The worker enumerates the request fields in LiteLLM 1.102.1 that select a deployment. Test with a fallback naming an unlisted configured model.
"""

