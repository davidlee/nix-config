[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Selector registry should declare every file the design changes; gateway_hooks.py, bake.nix and llm-gateway-serve are undeclared"
detail = """
Expected: every path the slice edits matches a design-target selector (design sec-8 table mirrors the registry).
Observed: `doctrine slice conformance 14`, read past the `flakes/` prefix (ISS-005), leaves three real undeclared paths, each covered only by the scope-relevant glob `features/agents/gateway/**`:
- features/agents/gateway/gateway_hooks.py — the body guard (DEC-073). sec-8's table lists it; the registry does not.
- features/agents/gateway/bake.nix — PHASE-02 D1: `script` hoisted here as `{pkgs, lib}: name: python: values: drv`.
- features/agents/gateway/llm-gateway-serve — PHASE-02 D1: comment change; launcher now baked via `proxy.serve`.
sec-8 lists neither bake.nix nor llm-gateway-serve, and sec-3 does not mention `proxy.serve providers values` (the one projection of PROVIDERS shared by the service and checks.llm-gateway). The adaptation was in scope and user-accepted; the design text just never caught up.
"""
disposition = "design-wrong"
response = """
Design and registry lag an in-scope, user-accepted adaptation (PHASE-02 D1) and the DEC-073 file. Reconciliation Brief, per-slice: `doctrine slice selector add` the three paths as design-target (load-bearing for conformance); mirror in design sec-8 table (rows for bake.nix, llm-gateway-serve) and sec-3 (`proxy.serve`).
"""

