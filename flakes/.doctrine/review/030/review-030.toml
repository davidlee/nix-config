selector as undelivered: git paths carry a `flakes/` prefix the selectors lack
(ISS-005). Judged by hand, each flakes/ path matches its selector. Genuinely
outside the selectors: the home-repo files (.local/share/jail.nix/home/agent/.pi/agent/.gitignore,
settings.json; agent-research/.pi/agent/models.json), planned by PHASE-04 EX-4 and
PHASE-05 EX-4 but outside the doctrine root, so no selector can name them; and
doctrine bookkeeping (notes.md, ISS-014/015). PHASE-04/06 rows were missing until
recorded at audit.
"""
disposition = "tolerated"
response = """
Tool limit, not drift. Every flakes/ path matches its design-target selector once the `flakes/` git prefix is accounted for (ISS-005 tracks the misattribution). The home-repo paths sit outside the doctrine root, so no selector can name them; PHASE-04 EX-4 and PHASE-05 EX-4 plan them explicitly. PHASE-04/06 delta rows were recorded at audit.
