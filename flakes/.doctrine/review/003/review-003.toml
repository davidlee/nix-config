Expected: each VT keyword present in its test_file.
Observed: PHASE-01 VT-2 lists `allUnique`; RV-002 F-5 replaced it with `duplicates` (features.nix ~:86) so the error can name what collided. Other VT keywords checked by grep: all present (features-test.nix test names; features.nix tree/classes/assertions/requires/_file; perSystem.nix checks/features-test.nix; hosts.nix selections/classesOf/modules.*; workstation.nix; snooze descriptor; justfile coverage/_drvs coverage/snooze-nag-test path; hosts.nix Sleipnir+openrgb).
Plan criteria are immutable (append-only); the uniqueness intent is covered by testDuplicateNamesFail.
"""
disposition = "tolerated"
response = """
Plan criteria are immutable, so the keyword cannot be edited and is not a reconcile surface. The criterion's intent (duplicates fail resolution) holds: `duplicates` in features.nix, exercised by testDuplicateNamesFail with passing twins. A future verify-vt run will report VT-2 as missing `allUnique`; this disposition is the record of why.
"""

