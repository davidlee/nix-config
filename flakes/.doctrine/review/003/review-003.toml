status = "verified"
severity = "minor"
title = "Expected a feature path never to coincide with a legacy flag path; nothing enforces it"
detail = """
Expected (ADR-001 D2 amendment, proposed at reconcile): no path is both a legacy flag and a feature.
Observed: features.nix separates them only by namespace (flags top-level, features under `feature.`). Nothing stops a flag `hardware.openrgb` from returning beside `feature.hardware.openrgb`, so the stated invariant would be prose only.
Source: external second opinion on the reconcile ADR wording, relayed by the user 2026-10-15; user +1 to enforcing it as a structural check.
Suggested: structural check over every record: no option is declared at `<area>.<name>` in the outer evaluation; fails every host, like the other D4 structural checks.
"""
disposition = "fix-now"
response = """
fix-now. User directed 2026-10-15 ("I'm leaning +1 to both of these (with the structural check)"). Add the check to features.nix's `structural` list with a paired-twin test in features-test.nix; mirror in design sec-3/sec-6, README § Feature tree, and ADR-001 D2 / ADR-002 D4 via the reconcile REV.
"""

