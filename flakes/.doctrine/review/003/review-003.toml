id    = 3
slug  = "reconciliation-review-of-sl-001"
title = "reconciliation review of SL-001"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "auditor"
responder = "author"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-001 at 5ba01615 against design sec-1..8, plan EX/VT/VA for PHASE-01..03, slice tests 1–9, RV-001/RV-002 outcomes. Gates re-run this pass: just test green (checks.features + snooze-nag, dictate, nudge tests); alejandra/statix/deadnix clean on touched .nix; just drvs and drvs-sets identical to the EN-2 baseline for all four configurations (override inputs unchanged since baseline); just coverage one drvPath, differing from Sleipnir's; flake.lock clean. Path conformance and VT attribution checked by hand (ISS-005). No code defects; six findings, all design/governance staleness or tooling.
"""

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Second pass: F-7 (flag/feature path collision), raised from an external second opinion the user relayed and agreed to. Fixed in features.nix with a paired-twin test; gates re-run green and identical to baseline. Passes 1 and 2 together cover the whole slice.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-001"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Expected design sec-3 to state the resolver's structural checks; RV-002 added three it does not describe"
detail = """
Expected: design sec-3 (steps 1, sketch, invariants, flowchart) describes every structural check features.nix enforces.
Observed: features.nix (`structural`, ~:83-101) also refuses unknown descriptor keys (RV-002 F-1), "." in area or feature names (F-2), and names each duplicate area/path (F-5); all failures throw one "feature tree is malformed:" bullet list. Design sec-3 lists only duplicates (as a boolean, message "feature tree has a duplicate area or feature name") and unknown `requires` paths, and its sketch uses `allUnique`.
User assented to these additions on RV-002 ("agreed"), recorded in notes § Code review RV-002 for reconcile. Code is right; design is stale.
Also sec-2 descriptor table: the key set is now closed (unknown keys fail), which the table does not say.
"""
disposition = "aligned"
response = """
Code is correct and user-assented (RV-002, "agreed"); the defect is design prose only. Delegated to /reconcile: Reconciliation Brief § Per-slice, design.md sec-2 descriptor table + sec-3 steps/flowchart/sketch/invariants.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
