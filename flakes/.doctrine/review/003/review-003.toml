[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "Expected slice conformance and verify-vt to attribute SL-001's edits; both report nothing attributable"
detail = """
Expected: `doctrine slice conformance 1` and `slice verify-vt 1` attribute recorded source-deltas to selectors and VT files.
Observed: conformance: 28 undeclared (all `flakes/`-prefixed), 16 undelivered, 0 conformant. verify-vt: every VT row UNATTRIBUTABLE. Cause: ISS-005 — source-delta paths are git-root-relative (`~`), selectors and VT test_files are doctrine-root-relative (`~/flakes`).
Manual mapping (prefix stripped): 26 code/doc paths each match a design-target selector; all 16 design-target selectors match an edit; the 2 remaining paths are the slice's own doctrine artefacts (notes.md, slice-001.toml). No scope creep, no undelivered target.
"""
disposition = "tolerated"
response = """
Tooling defect, not a slice defect; tracked by ISS-005. Rationale: the manual mapping in the finding is complete (26/26 paths conformant, 16/16 selectors delivered), and VT keywords were checked by script against each test_file (F-6). Re-running conformance once ISS-005 is fixed would confirm mechanically; nothing in SL-001 depends on it.
"""

