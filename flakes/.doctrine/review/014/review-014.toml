[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Gate: expected every probe measure identical (design § Gate and probe; PHASE-03 EX-6, PHASE-04 EX-4); observed .manpath moved, accepted without consult"
detail = """
Expected: design § Gate and probe — accepted when every probe measure is identical; a changed built artefact → stop and /consult. PHASE-03 EX-6 / PHASE-04 EX-4 say "every probe measure identical".
Observed: home/home-files-links `.manpath` moved in PHASE-03 and PHASE-04 (gfzjffpa → jcx1mql8). The orchestrator accepted it as ordering-only: nix-diff shows man-cache differs only through man-paths, which differs only by package order (openscad in P03; cava/waybar dedupe in P04). Content equality of the built man-cache was not proven. The slice objective itself allows "unchanged or proven ordering-only", so the design's gate wording is stricter than the slice it serves.
"""
disposition = "design-wrong"
response = """
The gate rule in design § Gate and probe is stricter than the slice objective ("unchanged or proven ordering-only") it serves. The acceptance was sound on evidence (nix-diff: man-cache differs only via man-paths, which differs only by order). Reconcile amends design § Gate and probe to admit nix-diff-proven order-only changes to a built artefact, naming `.manpath` as the case met. Brief: Per-slice F-1. The probe false positive itself is IMP-019.
"""

