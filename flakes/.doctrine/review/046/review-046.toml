[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "The home-base placement bypasses the governed boundary for optional development features"
detail = """
Reviewer: codex. Verified authority/design mismatch; effect on future or minimal homes is inference.

Design.md:151-155 and :601-602 import a new modules/home/dev-env.nix unconditionally from the home base. That module installs sccache and mold and exports RUSTC_WRAPPER, the mold rustflags and an agent-specific preference from :79-97. These are optional development capabilities; a functioning home does not require a Rust compiler cache, linker preference or Claude agent-team setting. The current modules/home/default.nix:1-8 explicitly describes and contains the shared base.

SPEC-002 ('doctrine show SPEC-002', Author contract / Where config lives; .doctrine/spec/tech/002/spec-002.md:157-187) reserves the home base for what every home needs and requires anything optional to live in a feature. Its deciding rule is 'Would some host of this kind work without it? Then it is not base.' ADR-001 D2/D6 puts capability activation in feature selection. Unconditional base installation means a host choosing a minimal profile cannot exclude these tools/settings through the feature tree; it also changes all home users as an incidental part of migrating one consumer. The research's 'SPEC-002 not applicable, dev-envs is not a feature' (research/research.md, Thread 1) misses that this proposal also changes the root flake's home composition.

Repair: retain DEC-114's one data owner and its identical env/package application, but place the host application module behind a normal feature selected by the personal profile on Linux and darwin. Keep host-facts data in agents/ and consumer application as designed; no parallel list is needed. Add a minimal-home evaluation showing the feature can be excluded without installing its tools or exporting RUSTC_WRAPPER, and personal-home evaluation showing env and package are enabled together. If unconditional base placement is intended instead, explicitly reconcile the SPEC-002/ADR-001 exception with the user rather than silently redefining base. This finding challenges placement, not the settled all-project preference or sccache/mold choice.
"""
disposition = "fix-now"
response = "Unchanged repair, now applied: design.md adopted at run rev 35 (see the earlier response on this finding). Route: review — the fix is design text, checked by reading the adopted sections."
route = "review"

