[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Removing the Doctrine symlink strands the existing Codex MCP registration"
detail = """
Reviewer: codex. Verified source/config evidence; startup failure after removal is inference, not a performed destructive probe.

SL-023 design.md:147-150 removes ~/.local/bin/doctrine and assumes future bakes use the canonical install. But the current ~/.codex/config.toml:340-342 already registers [mcp_servers.doctrine] with command = "/home/david/.local/bin/doctrine". readlink ~/.local/bin/doctrine returns /home/david/.local/share/doctrine/bin/doctrine. An absolute subprocess command does not consult the newly ordered PATH: removing the link leaves this registration pointing at a missing executable on the next server start.

The handover's operator list (design.md:703-704) includes link removal but no migration of Codex's user registration. The bake criterion (design.md:656) inspects only pi's .doctrine/state/pi/extensions/mcp.ts and type -a; it can pass while Codex remains broken. Doctrine's src/codex_mcp.rs:210-224 deliberately preserves the PATH entry rather than its canonical target; :257-265 describes replacement of an old registration. This is exactly persisted state that must be refreshed, not something PATH ordering repairs automatically. The jail's separate persisted home may hold another registration and needs independent examination.

Repair: keep S5's canonical path, but add an ordered migration: activate/verify the canonical PATH; refresh each affected host and jail Codex registration through Doctrine's supported installer/registration workflow; verify its recorded absolute command and start the MCP server from a fresh Codex process; only then remove the alias. Include rollback and audit other baked /run/doctrine-bin invocations before retiring that mount. Extend the bake criterion to Codex's actual registered command and startup on both sides, not only pi's generated constant. No config or alias was changed in this review.
"""
disposition = "fix-now"
response = "Unchanged repair, now applied: design.md adopted at run rev 35 (see the earlier response on this finding). Route: review — the fix is design text, checked by reading the adopted sections."
route = "review"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Verified: ~/.codex/config.toml:340-342 registers command = "/home/david/.local/bin/doctrine"; that path is the symlink to the canonical install. doctrine:src/codex_mcp.rs:210-224 bakes the PATH entry's own path, so the registration names the alias and PATH reordering does not repair it.
Repair in design: order the migration — (1) land the user-bin PATH, fresh login; (2) re-run `doctrine install` on the host and inside a jail, so pi and codex re-bake the canonical path; (3) verify the recorded command in ~/.codex/config.toml and in the jail's persisted codex config, and start the MCP server from a fresh codex on both sides; (4) only then remove ~/.local/bin/doctrine. Rollback: recreate the symlink. Also grep the persisted jail homes for baked /run/doctrine-bin before retiring that mount. The verification row "one Doctrine, both sides" is extended to codex's registered command and its MCP startup.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = """
codex: VERIFIED the stated design repair, as requested; the edits and execution remain unapplied/unverified. The response now orders canonical PATH activation, installer refresh for host and jail registrations, inspection of both recorded commands and fresh Codex MCP startup BEFORE alias removal, with alias recreation as rollback and an audit of persisted /run/doctrine-bin bakes before mount retirement. This addresses the actual absolute-command failure rather than relying on PATH alone. Rechecked doctrine:src/codex_mcp.rs:210-224 (bakes the PATH entry) and :257-265 (classifies an old interpreted command for replacement). The installer runs must select the relevant pi/codex integrations and operate in the homes whose registrations are checked. Acceptance is of this migration and verification obligation, not a claim that registrations have already changed or MCP startup has passed.
"""

