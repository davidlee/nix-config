disposition = "fix-now"
response = """
Verified: SPEC-002 § Where config lives (spec-002.md:165-187) — home base holds what every home needs; anything optional is a feature; rule 1. sccache, mold, RUSTC_WRAPPER and the agent-teams flag are optional. No feature installs sccache/mold today, so there is no duplicate to fold into.
Repair: drop modules/home/dev-env.nix from the home base. Add a feature `dev.env` in features/dev.nix whose home half applies `(import ../agents/dev-env.nix).for pkgs` (home.sessionVariables + home.packages, one fact applied together), selected in features/profiles/personal.nix (Linux and darwin). agents/dev-env.nix stays the single data owner; the consumer's application is unchanged. Coverage: Draupnir and Sleipnir homes evaluate with it; the existing lean-home isolation evaluates without it (no RUSTC_WRAPPER, no sccache).
"""

