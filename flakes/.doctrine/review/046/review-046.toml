[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The required pre-subtraction launcher diff cannot satisfy its own expected deltas"
detail = """
Reviewer: codex. Verified design/source contradiction; the resulting failed comparison is inferred, not a built reproduction.

The required ordering in design.md:684-690 and :695-697 puts the launcher diff before Doctrine's subtraction, including DEC-112 step 3. Step 1 expressly leaves doctrine in dev-tools, and only step 3 removes it (:526-540; doctrine show DEC-112). The diff builds the consumer with the CURRENT checkout as project (:634-637). That consumer directly adds [devTools] to every jail (:311-315), while the current Doctrine flake.nix:411-418 defines dev-tools.paths = devToolPkgs ++ [doctrine]. Doctrine's existing jails instead take projectPkgs (:182-190), deliberately excluding the product.

Nevertheless the diff permits only enumerated deltas, one of which is 'no crane doctrine' in the consumer (design.md:647). At the mandated comparison point the consumer still carries precisely that product. The comparison also expects removal of unjailed project agents at :647, although the transition must state which old/new producer tool sets are being compared. Following the handover literally cannot establish the claimed final launcher fidelity; an executor must either waive a mandatory comparison or change the prescribed order. It also pays the current checkout's crane build during the supposed pre-subtraction check.

Repair: separate preservation of the old launchers from removal of the old definitions. Capture and root the baseline outputs first at an exact revision (including outer and inner scripts); add capsule-tools and move fleet; split dev-tools while keeping the old jail definitions long enough to compare, or compare against the captured baseline; then subtract agent wiring. Another valid approach is an explicit intermediate producer fixture with the final dev-tools contract. Specify the compared revisions/inputs and expected deltas for that actual state. A captured baseline remains comparable after its source definitions are removed: ':afterwards there is nothing to compare against' is not a reason to require contradictory states. Keep DEC-112's no-gap fleet order intact.
"""
disposition = "fix-now"
response = "Unchanged repair, now applied: design.md adopted at run rev 35 (see the earlier response on this finding). Route: review — the fix is design text, checked by reading the adopted sections."
route = "review"

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Verified: the current doctrine flake.nix dev-tools is devToolPkgs ++ [doctrine]; the consumer takes [devTools]; the handover puts DEC-112 step 3 after the diff, while the diff's expected deltas say "no crane doctrine". Contradictory as written.
Repair, simpler than a captured baseline: Doctrine's old jails take projectPkgs (doctrine:flake.nix:182-190), not dev-tools, so DEC-112 step 3 does not touch them. Move all of DEC-112 (steps 1-3: capsule-tools, fleet re-lock, dev-tools = devToolPkgs) ahead of the launcher diff. The diff then compares old jails against the consumer over the final dev-tools contract, at a named Doctrine revision; the subtraction (DEC-111, DEC-115, .envrc) follows. The handover diagram and the "launcher diff precedes the subtraction" bullet are updated; expected deltas stay as listed.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = """
codex: VERIFIED the stated design repair, not applied edits or a built comparison. Rechecked doctrine:flake.nix:131-136 and :182-190: old jails take projectPkgs = devToolPkgs plus unjailed codex/claude, independently of packages.dev-tools (:411-418). Therefore moving all three DEC-112 steps ahead of the diff removes the product from the consumer's bundle while preserving the old jail outputs for comparison. Naming the Doctrine revision fixes which producer contract is compared; the existing expected removal of extra unjailed agents remains appropriate because projectPkgs retains them until the later agent-wiring subtraction. The proposed order preserves capsule-tools addition -> fleet re-lock -> product removal from dev-tools, then comparison -> removal of old jails. It resolves the contradictory ordering without requiring a captured baseline. No Nix build/diff was performed.
"""

