[[finding]]
id = "F-10"
status = "verified"
severity = "nit"
title = "Merge-order argument omits position within a level"
detail = """sec-5 argues that the NixOS half stays at depth 2. Under breadth-first collection, the wrapper's import also moves from position :82 among config.nix's imports to after all of them. Depth alone does not preserve order. For snooze this does not matter, because it touches no shared list. The paragraph will be copied by later migrations, though, and for those it gives the wrong reason. Also, "No evaluation gains or loses a module" is loosely true: each projection adds a wrapper module. Repair: one clause each. The gate stays the arbiter."""
disposition = "fix-now"
response = "Accepted. mem.fact.nix.merge-order confirms that the closure is collected breadth-first, so position within a level matters. Design sec-5 (Merge order) now says the NixOS half stays at depth 2 but moves after every module that config.nix imports, and that depth alone does not preserve order. The host-by-host line now reads: no evaluation gains or loses a feature module, and each projected half gains a wrapper that carries only _file."

