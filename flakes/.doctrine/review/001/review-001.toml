[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "DEC-001 deferral blocks every shared home feature; dependency not stated"
detail = """For the Mac, classesOf returns only darwin. A homeManager-only feature selected there fails the ADR-005 D6 check. Every module in modules/home/shared (cli, emacs, zsh, nvim, nushell, programs, shpool) is imported on both Linux and darwin. None of them can move into the tree until darwin's Home Manager receives projected modules (IMP-012, or a home-manager.sharedModules hook in mkDarwin). That hook is not free: darwin/default.nix builds extraSpecialArgs without features or stable, so projected home modules that take those arguments would break. sec-4 frames the gap as "until a feature needs it". In practice it is a hard prerequisite of the shared-home migration. Repair: say so in sec-4 or sec-8, and relate IMP-012 as blocking that migration, so the MULTIHOST rebase orders it correctly."""
disposition = "fix-now"
response = "Accepted. Verified that darwin/home.nix imports modules/home/shared zsh, nvim-plugins, nvim, programs, emacs, cli and nushell, and that darwin/default.nix lines 8-15 build extraSpecialArgs without features or stable. Design sec-4 (Darwin) now states that IMP-012, or an equivalent, must land before any shared home module is migrated, and why a sharedModules hook alone is not enough. sec-8 points to it. IMP-012's body now records that it blocks the shared-home migration. DEC-001 is not reopened: its choice for SL-001 stands, and only its consequence is now stated."

