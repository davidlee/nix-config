[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "No stated pattern for ADR-004 integrations under the {flags; modules} contract"
detail = 'ADR-004 D2 says the outer layer selects integrations whose applicability depends on selection. The resolver projects only tree features and has no slot for a conditional integration module. The first desktop migration (the xdg.nix portal fan-out) will have to choose a mechanism, and that may change the contract this slice is meant to fix as the pattern. HYP-001 already allows one cheap answer with no new mechanism: an integration is an ordinary feature that requires both of its ends and is selected by the profile. Repair: add one sentence to sec-8 "Open, accepted as-is" naming that pattern, or naming the contract change it would need. Then the migration slices inherit a decision instead of a gap.'
disposition = "fix-now"
response = """Accepted. Design sec-8 "Open, accepted as-is" now names the pattern: an integration whose applicability depends on selection (ADR-004 D2) is an ordinary feature that requires both of its ends and is selected by the profile that selects them. It needs no new mechanism and no change to the contract. The stated cost is that a host turning one end off must also turn the integration off, as with any prerequisite (DEC-005). I did not repeat the reviewer's xdg example: ADR-004 treats the portal fan-out as an always-present option (D1), not as a selection-dependent integration."""

