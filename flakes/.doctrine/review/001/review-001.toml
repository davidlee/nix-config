[[finding]]
id = "F-4"
status = "verified"
severity = "nit"
title = "ADR-005 D1 completeness is not checked"
detail = "Nothing asserts that every non-parked feature in the tree is selected by some host or coverage target. With two features this is handwritten; record it as accepted rather than implied."
disposition = "tolerated"
route = "review"
response = "Accepted for two features; recorded in sec-8 open items. A completeness check waits until the tree is larger."

