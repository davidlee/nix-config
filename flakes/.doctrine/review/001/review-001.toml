title = "design review of SL-001"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "design"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = "Agent self-review of design.md rev 36: sections 1-8 against ADR-001..005 and DEC-001..009, the resolver sketch evaluated against fixtures, and the verification mapping. F-3 is answered with an instrument (control) route, to be verified once phases exist."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-001"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Resolver called pure, but hard-wires the legacy flag module"
detail = "sec-3 Contract says the resolver is a pure function of its arguments, but the sketch always imports ./modules/features.nix. Tests therefore always carry the real legacy flags. Harmless, but the claim is overstated."
disposition = "fix-now"
route = "review"
response = "sec-3 Contract now says the resolver is pure apart from the legacy flag module it always includes."

