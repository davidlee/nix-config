response = "sec-3 Contract now says the resolver is pure apart from the legacy flag module it always includes."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "checked in design.md rev 36"

[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "T4 fixtures detect different faults; the design does not say which"
detail = "sec-6 T4: a class value that is throw detects the resolver forcing a value; a function module naming pkgs.does-not-exist detects only applying the module, since deepSeq does not apply functions. The table presents them as one check. State what each fixture guards."
disposition = "fix-now"
route = "review"
response = "sec-6 T4 row now states what each fixture detects: the throw value detects forcing, the pkgs module function detects application."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
