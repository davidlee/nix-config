disposition = "fix-now"
route = "review"
response = "sec-6 T4 row now states what each fixture detects: the throw value detects forcing, the pkgs module function detects application."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "checked in design.md rev 36"

[[finding]]
id = "F-3"
status = "answered"
severity = "minor"
title = "Home-only failure (test 3) is argued from structure, not observed"
detail = "sec-6 maps slice test 3 to T3 at resolver level plus the argument that mkHome reads the same guarded selection. No test evaluates homeConfigurations with a failing selection. A regression that gave mkHome its own unguarded resolution would pass T3."
disposition = "fix-now"
route = "control"
response = "sec-6 adds a one-off negative control. The incorrect candidate it must reject is a mkHome with its own unguarded resolution: with a deliberately false assertion in the host file, the home-only drvPath evaluation must fail with the control message. Plan places it in the phase that rewires hosts.nix."

