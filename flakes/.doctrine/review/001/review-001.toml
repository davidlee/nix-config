[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "HYP-001 cannot be refuted by this pilot, yet sec-8 sets it to confirmed"
detail = """sec-8 confirms HYP-001 if tests 1-9 pass with no graph walk and nothing auto-selected. The design implements no graph walk, so that clause holds by construction. Snooze and openrgb have no prerequisites and no integrations, and requires is exercised only by inline fixtures (T3). None of the coupling EVD-001 names is exercised: desktop base with five compositors, the cross-class satan (home) to postgresql (system) edge, or the ADR-004 xdg portal fan-out. HYP-001 claims sufficiency for this repo's coupling. A pass shows only that the mechanism works for two features with no edges. Recording "confirmed" at close would let later migration slices treat an untested claim as settled. Repair, one of: (a) narrow the outcome to "supported for an edge-free pilot" and say which later slice tests the edges, or (b) add one fixture test that models the real EVD-001 graph (base plus compositors, a cross-class prerequisite, a host turning base off) and state what failure there would refute."""
disposition = "fix-now"
route = "review"
response = 'Accepted. The observation was checked against the design: there is no graph walk, and neither pilot feature has a prerequisite or an integration. Of the two proposed repairs I took (a), narrowing the outcome. Repair (b), a fixture that models the EVD-001 graph, would also pass by construction, because requires can express every edge; the open question is ergonomics, which only a real migration shows. Also, the hypothesis lifecycle offers only proposed, confirmed or refuted, so there is no "supported" status to set. Design sec-8 (HYP-001) now says SL-001 can refute HYP-001 but not confirm it: on a pass, the result is recorded as supporting evidence, HYP-001 stays proposed, and the first migration slice with real edges decides it. Sibling swept: the HYP-001 line in slice-001.md Verification / closure. DEC-009 only defers "HYP-001 status" to close, so it stays consistent and is not reopened.'

