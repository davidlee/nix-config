[[finding]]
id = "F-8"
status = "verified"
severity = "minor"
title = "Real-tree tests assert exact contents and break on every migration"
detail = "T1 expects modules.nixos to equal exactly the snooze tag, and modules.homeManager likewise. T1d expects all three lists to be empty for the Mac. T2 runs on the real tree and the real workstation profile. The next slice that adds a feature to workstation or to the tree turns these red although nothing is broken. They test the current inventory, not resolver behaviour, which goes against the project's test-behaviour standard. Repair: on the real tree, assert membership (the snooze tag is present in both lists; absent after the override; no homeManager or nixos tags for the Mac), and leave exact-list assertions to the fixture tests (T9 already covers order)."
disposition = "fix-now"
response = "Accepted. In design sec-6, T1 now asserts that the snooze tags are included in the nixos and homeManager lists, and T2 that neither list includes them. A paragraph after the table explains why tests on the real tree assert membership, and why T1d stays exact: nothing is selected without a profile or host definition, so an empty result for the Mac is a behaviour, not an inventory. Exact lists and order stay on fixtures (T9). T11 already checked a property, not contents."

