[[finding]]
id = "F-9"
status = "verified"
severity = "nit"
title = "A requires typo in an unselected feature is not detected"
detail = "requires paths are resolved only inside the check for a selected feature, so a misspelt path stays silent until some host selects the feature. Checking every record's requires paths against the record set is descriptor-level only (ADR-002 D4 allows it) and costs a few lines beside the uniqueness check. Optional; it can go to sec-8 as accepted if it is not wanted."
disposition = "fix-now"
response = "Accepted. The change is net neutral in size: the lazy throw inside on is gone, and the structural check sits beside the uniqueness check. Design sec-3 changes as follows. Step 1 runs two structural checks over every record, selected or not: duplicate names, and requires paths that name no record. The sketch adds paths and unknown and uses getAttrFromPath. A new invariant covers the check. The flowchart and its caption now show the structural branch; before, they claimed a single branch although the uniqueness throw already existed, a stale projection found in self-review. In sec-6, T3u now uses an unselected feature, which is the negative control for this change. I evaluated the revised sketch against inline fixtures with nix eval: order is kept, T3, T3u, T8 and T10 throw, a valid prerequisite resolves, and an unselected throw feature is untouched."

